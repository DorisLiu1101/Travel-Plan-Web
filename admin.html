<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f4f5f0">
	<title>行程管理後台</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/@phosphor-icons/web"></script>
	<style>
		:root {
			color-scheme: light;
			--ink: #26332e;
			--muted: #78817a;
			--paper: #f4f5f0;
			--white: #fff;
			--line: #e3e7e0;
			--green: #315a4c;
			--green-deep: #203d34;
			--coral: #cf795f;
			--lime: #e9efbd;
			--shadow: 0 12px 36px rgba(37, 57, 47, .07);
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', 'DM Sans', sans-serif; }
		button { cursor: pointer; }
		.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
		.shell.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
		.shell.sidebar-collapsed .sidebar { display: none; }
		.sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 26px 18px 18px; background: var(--green-deep); color: #f5f7f1; }
		.brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 26px; border-bottom: 1px solid rgba(255,255,255,.13); }
		.brand-home { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #f5f7f1; text-decoration: none; }
		.brand-home:hover, .brand-home:focus-visible { border-color: #e9efbd; background: rgba(255,255,255,.1); color: #e9efbd; }
		.brand-home svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
		.brand strong { display: block; font-size: 15px; letter-spacing: .02em; }
		.brand small { display: block; margin-top: 2px; color: #b5c4ba; font-family: 'DM Sans', sans-serif; font-size: 11px; }
		.side-tabs { display: grid; flex: 0 0 auto; gap: 4px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.13); }
		.side-tab { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 38px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #dce5dc; text-align: left; font-size: 11px; font-weight: 600; transition: background .18s, color .18s; }
		.side-tab i { width: 18px; flex: 0 0 18px; color: #a9bbb0; font-size: 16px; text-align: center; }
		.side-tab:hover { background: rgba(255,255,255,.08); }
		.side-tab[aria-selected="true"] { border-color: rgba(233,239,189,.22); background: rgba(233,239,189,.12); color: var(--lime); }
		.side-tab[aria-selected="true"] i { color: var(--lime); }
		.itinerary-nav-panel { display: flex; flex: 1; flex-direction: column; min-height: 0; }
		.journey-settings-link { margin: 4px 0; }
		.journey-settings-link[aria-current="page"] { border-color: rgba(233,239,189,.22); background: rgba(233,239,189,.12); color: var(--lime); }
		.journey-settings-link[aria-current="page"] i { color: var(--lime); }
		.sidebar-divider { height: 1px; flex: 0 0 1px; margin: 9px 3px 3px; background: rgba(255,255,255,.16); }
		.side-label { display: flex; align-items: center; gap: 9px; padding: 22px 9px 10px; color: #a9bbb0; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
		.side-count { margin-left: auto; }
		.day-list { display: grid; grid-auto-rows: 43px; align-content: start; flex: 1; min-height: 0; gap: 4px; overflow-y: auto; padding-right: 3px; scrollbar-color: rgba(233,239,189,.38) transparent; scrollbar-width: thin; }
		.day-list::-webkit-scrollbar { width: 5px; height: 5px; }
		.day-list::-webkit-scrollbar-track { background: transparent; }
		.day-list::-webkit-scrollbar-thumb { border: 1px solid transparent; border-radius: 99px; background: rgba(233,239,189,.35); background-clip: padding-box; }
		.day-list::-webkit-scrollbar-thumb:hover { background: rgba(233,239,189,.68); background-clip: padding-box; }
		.day-link { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 43px; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; color: #dce5dc; text-align: left; transition: background .18s, color .18s; }
		.day-link:hover { background: rgba(255,255,255,.08); }
		.day-link.active { background: var(--lime); color: var(--green-deep); }
		.day-number { display: grid; width: 25px; height: 25px; flex: 0 0 25px; place-items: center; border: 1px solid currentColor; border-radius: 50%; font: 600 10px 'DM Sans', sans-serif; opacity: .82; }
		.day-label { min-width: 0; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
		.add-day { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; margin-top: 12px; border: 1px dashed rgba(255,255,255,.35); border-radius: 7px; background: transparent; color: #eff4ec; font-size: 12px; }
		.add-day:hover { background: rgba(255,255,255,.08); }
		.add-day:disabled { cursor: not-allowed; opacity: .45; }
		.side-bottom { margin-top: auto; padding: 15px 9px 2px; color: #a9bbb0; font-size: 11px; line-height: 1.7; }
		.main { min-width: 0; }
		.topbar { position: sticky; z-index: 5; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px; padding: 12px clamp(18px, 4vw, 54px); border-bottom: 1px solid var(--line); background: rgba(244,245,240,.94); backdrop-filter: blur(14px); }
		.top-heading-group { display: flex; align-items: center; gap: 11px; min-width: 0; }
		.bookmark-toggle { position: relative; width: 36px; height: 40px; min-height: 40px; padding: 0; border-color: #d8dfd5; border-radius: 5px 5px 9px 9px; background: #fff; color: var(--green); }
		.bookmark-toggle:hover { border-color: #9aaf9d; background: #f7faf5; }
		.bookmark-toggle svg { width: 19px; height: 22px; }
		.bookmark-toggle[aria-expanded="false"] { color: var(--coral); }
		.top-title { min-width: 0; }
		.eyebrow { color: var(--coral); font: 700 10px 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		.top-title h1 { overflow: hidden; margin: 3px 0 0; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
		.top-actions { display: flex; align-items: center; gap: 9px; }
		.save-state { display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
		.state-dot { width: 7px; height: 7px; border-radius: 50%; background: #80a48b; }
		.state-dot.dirty { background: var(--coral); }
		.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: var(--ink); font-size: 12px; font-weight: 600; transition: transform .16s, background .16s; }
		.button:hover { transform: translateY(-1px); background: #fafbf8; }
		.button.primary { border-color: var(--green); background: var(--green); color: white; }
		.button.primary:hover { background: var(--green-deep); }
		.button.icon-only { width: 38px; padding: 0; }
		.button.icon-only svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
		.button.icon-only:disabled { cursor: not-allowed; opacity: .4; transform: none; }
		.button.icon-only.danger { color: #a85f52; }
		.button.icon-only.danger:hover { border-color: #e7c9c2; background: #fff5f2; }
		.content { width: min(100%, 1120px); margin: 0 auto; padding: 30px clamp(16px, 4vw, 54px) 64px; }
		.tab-panel[hidden] { display: none; }
		.panel-intro { margin: 0 0 18px; }
		.panel-intro h2 { margin: 4px 0 5px; font-size: 21px; }
		.panel-intro p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
		.journey-panel[hidden] { display: none; }
		.intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; animation: rise .45s ease both; }
		.intro h2 { margin: 4px 0 5px; font-size: clamp(21px, 3vw, 28px); line-height: 1.35; }
		.intro p { margin: 0; color: var(--muted); font-size: 12px; }
		.counter { display: flex; align-items: baseline; gap: 7px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); white-space: nowrap; }
		.counter strong { color: var(--green); font: 700 20px 'DM Sans', sans-serif; }
		.counter span { color: var(--muted); font-size: 11px; }
		.site-settings { margin-bottom: 18px; padding: 19px 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); }
		.site-settings-head { margin-bottom: 15px; }
		.site-settings-head h3 { margin: 0 0 4px; font-size: 13px; }
		.site-settings-head p { margin: 0; color: var(--muted); font-size: 10px; }
		.site-settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 15px; }
		.site-setting { display: grid; gap: 5px; min-width: 0; color: #59655e; font-size: 10px; font-weight: 700; }
		.site-setting input { width: 100%; min-width: 0; height: 37px; padding: 0 10px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font-size: 11px; }
		.site-setting textarea { width: 100%; min-width: 0; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }
		.site-setting input:focus, .site-setting textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); background: #fff; }
		.site-setting-image { grid-column: 1 / -1; }
		.catalog-site-settings { display: grid; gap: 12px 15px; grid-template-columns: repeat(2, minmax(0,1fr)); padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
		.catalog-site-settings h3 { grid-column: 1 / -1; margin: 0; font-size: 13px; }
		.catalog-site-settings .site-setting-image textarea { min-height: 0; overflow-wrap: anywhere; word-break: break-all; resize: none; }
		.catalog-site-settings .site-setting-image .image-row { align-items: stretch; }
		.catalog-site-settings .site-setting-image textarea { width: 100%; padding: 10px 11px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }
		.catalog-site-settings .site-setting-image textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); background: #fff; }
		.map-engine-setting { padding: 0; margin: 15px 0 0; border: 0; }
		.map-engine-setting legend { margin-bottom: 7px; color: #59655e; font-size: 10px; font-weight: 700; }
		.map-engine-options { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
		.map-engine-option { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 7px 10px; border: 1px solid #dce2da; border-radius: 6px; background: #fbfcfa; color: var(--ink); cursor: pointer; }
		.map-engine-option:has(input:checked) { border-color: var(--green); background: #eef4ed; box-shadow: inset 0 0 0 1px var(--green); }
		.map-engine-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
		.map-engine-option i { color: var(--green); font-size: 17px; }
		.map-engine-option span { font-size: 10px; font-weight: 600; }
		.weather-select-control { display: grid; grid-template-columns: 40px minmax(0,1fr); align-items: center; gap: 8px; }
		.weather-icon-preview { display: grid; width: 40px; height: 39px; place-items: center; border: 1px solid var(--line); border-radius: 5px; background: #edf2ec; color: var(--green); font-size: 21px; }
		.weather-select-control select { width: 100%; min-width: 0; height: 39px; padding: 0 9px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px 'Noto Sans TC', sans-serif; }
		.weather-select-control select:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); }
		.source-picker { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
		.source-info { display: grid; gap: 3px; min-width: 0; }
		.source-info strong { font-size: 11px; }
		.source-info span { overflow: hidden; color: var(--muted); font: 11px 'DM Sans', sans-serif; text-overflow: ellipsis; white-space: nowrap; }
		.source-info small { color: var(--muted); font-size: 9px; line-height: 1.5; }
		.source-actions { display: flex; flex: 0 0 auto; flex-wrap: wrap; gap: 7px; }
		.source-picker .button { flex: 0 0 auto; }
		.source-picker input[type="file"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
		.button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
		.editor-card { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); animation: rise .5s .05s ease both; }
		.editor-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 23px; border-bottom: 1px solid var(--line); }
		.editor-head h3 { margin: 0 0 4px; font-size: 14px; }
		.editor-head p { margin: 0; color: var(--muted); font-size: 11px; }
		.move-actions { display: flex; gap: 6px; }
		.editor-body { padding: 22px 23px 27px; }
		.section { padding: 0 0 24px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
		.section:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
		.section-title { display: flex; align-items: center; gap: 9px; margin: 0 0 16px; font-size: 13px; }
		.section-title i { color: var(--coral); font-size: 18px; }
		.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 17px; }
		.field { display: grid; gap: 6px; min-width: 0; }
		.field.full { grid-column: 1 / -1; }
		.field label, .list-heading { color: #59655e; font-size: 11px; font-weight: 700; }
		.field input, .field textarea, .list-item textarea { width: 100%; min-width: 0; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font-size: 12px; transition: border .15s, box-shadow .15s; }
		.field input { height: 39px; padding: 0 11px; }
		.field textarea, .list-item textarea { min-height: 70px; padding: 10px 11px; line-height: 1.65; resize: vertical; }
		.field input:focus, .field textarea:focus, .list-item textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); background: #fff; }
		.image-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); align-items: stretch; gap: 13px; }
		.image-row textarea { min-height: 0; overflow-wrap: anywhere; word-break: break-all; resize: none; }
		.image-preview { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: linear-gradient(135deg, #e8eddf, #f5e7d7); }
		.image-preview img { display: block; width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
		.list-block + .list-block { margin-top: 19px; }
		.list-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
		.list-items { display: grid; gap: 8px; }
		.list-item { display: grid; grid-template-columns: 25px minmax(0,1fr) 34px; align-items: start; gap: 8px; }
		.spot-items { display: grid; gap: 12px; }
		.spot-item { display: grid; grid-template-columns: 25px minmax(0,1fr) 34px; align-items: start; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fcfdfa; }
		.spot-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-width: 0; }
		.spot-field.spot-description { grid-column: 1 / -1; }
		.spot-field { display: grid; align-content: start; gap: 6px; min-width: 0; color: #59655e; font-size: 10px; font-weight: 700; }
		.spot-field input, .spot-field textarea { width: 100%; min-width: 0; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fff; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }
		.spot-field input { height: 37px; padding: 0 9px; }
		.spot-field textarea { min-height: 70px; padding: 8px 9px; resize: vertical; }
		.spot-field input:focus, .spot-field textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); }
		.spot-field .field-hint { color: var(--muted); font-size: 9px; font-weight: 400; line-height: 1.5; }
		.spot-image-preview { display: block; width: 72px; height: 40px; margin-top: 5px; border: 1px solid var(--line); border-radius: 4px; background: #edf1e8; object-fit: cover; }
		.spot-image-preview[hidden] { display: none; }
		.list-index { display: grid; width: 25px; height: 25px; margin-top: 4px; place-items: center; border-radius: 50%; background: #edf1e8; color: var(--green); font: 600 10px 'DM Sans', sans-serif; }
		.remove-item { width: 32px; height: 32px; margin-top: 2px; border: 0; border-radius: 5px; background: transparent; color: #9a6258; font-size: 17px; }
		.remove-item:hover { background: #fff0eb; }
		.small-button { display: inline-flex; align-items: center; gap: 5px; min-height: 29px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--green); font-size: 10px; font-weight: 700; }
		.small-button:hover { background: #f2f5ee; }
		.export { margin-top: 25px; padding: 19px; border: 1px solid #d8e0d4; border-radius: 8px; background: #eaf0e7; }
		.export-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
		.export-head h3 { margin: 0; font-size: 13px; }
		.export-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
		.export-actions { display: flex; gap: 7px; }
		.code-output { width: 100%; min-height: 195px; padding: 13px; border: 1px solid #cbd8ca; border-radius: 5px; background: #1f302b; color: #d6e8c8; font: 11px/1.65 'DM Sans', monospace; resize: vertical; }
		.toast { position: fixed; z-index: 10; right: 22px; bottom: 22px; padding: 11px 15px; border-radius: 6px; background: var(--green-deep); color: white; font-size: 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s; }
		.toast.show { opacity: 1; transform: translateY(0); }
		.empty { padding: 40px 20px; color: var(--muted); text-align: center; }
		@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 760px) {
			.shell { grid-template-columns: 1fr; }
			.sidebar { position: static; min-width: 0; height: auto; padding: 12px 14px; }
			.brand { padding: 0 3px 11px; border-bottom: 0; }
			.brand strong { font-size: 13px; }
			.brand small, .side-bottom { display: none; }
			.side-tabs { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.13); }
			.side-tab { justify-content: center; gap: 5px; min-width: 0; min-height: 36px; padding: 0 4px; font-size: 9px; }
			.side-tab i { width: auto; flex-basis: auto; font-size: 14px; }
			.itinerary-nav-panel { flex: 0 0 auto; }
			.side-label { padding: 8px 2px 4px; font-size: 10px; }
			.day-list { display: flex; min-width: 0; width: 100%; max-width: 100%; gap: 6px; overflow-x: auto; padding: 4px 1px 8px; scrollbar-color: rgba(233,239,189,.4) transparent; scrollbar-width: thin; }
			.day-list::-webkit-scrollbar { width: auto; height: 4px; }
			.day-list::-webkit-scrollbar-thumb { background: rgba(233,239,189,.42); }
			.day-list::-webkit-scrollbar-thumb:hover { background: rgba(233,239,189,.72); }
			.day-link { width: auto; min-width: max-content; height: 34px; min-height: 34px; gap: 6px; padding: 4px 8px; }
			.day-number { width: 22px; height: 22px; flex-basis: 22px; }
			.day-label { max-width: 94px; font-size: 10px; }
			.spot-fields { grid-template-columns: repeat(2, minmax(0,1fr)); }
			.spot-field.spot-image { grid-column: 1 / -1; }
			.add-day { display: flex; min-height: 34px; margin-top: 7px; border-style: solid; font-size: 10px; }
			.topbar { min-height: 63px; padding: 9px 14px; }
			.top-title h1 { max-width: 37vw; font-size: 14px; }
			.save-state { display: none; }
			.button { min-height: 35px; padding: 0 9px; font-size: 10px; }
			.button.icon-only { width: 35px; }
			.button.icon-only svg { width: 17px; height: 17px; }
			.content { padding: 20px 13px 45px; }
			.panel-intro h2 { font-size: 19px; }
			.intro { align-items: flex-start; }
			.intro p { max-width: 240px; line-height: 1.6; }
			.counter { padding: 8px; }
			.site-settings { padding: 15px; }
			.catalog-manager { padding: 15px; }
			.editor-head { padding: 16px; }
			.editor-body { padding: 18px 15px; }
			.export { padding: 14px; }
			.export-head { align-items: flex-start; }
		}
		@media (max-width: 430px) {
			.field-grid { grid-template-columns: 1fr; }
			.field.full { grid-column: auto; }
			.site-settings-grid { grid-template-columns: 1fr; }
			.catalog-site-settings { grid-template-columns: 1fr; }
			.catalog-site-settings h3, .catalog-site-settings .site-setting-image { grid-column: auto; }
			.map-engine-options { grid-template-columns: 1fr; }
			.weather-picker { grid-template-columns: repeat(3, minmax(0,1fr)); }
			.spot-fields { grid-template-columns: 1fr; }
			.spot-field.spot-image, .spot-field.spot-description { grid-column: auto; }
			.top-actions { gap: 5px; }
			.button.primary { gap: 5px; }
			.intro h2 { font-size: 20px; }
			.intro p { font-size: 10px; }
			.counter { flex-direction: column; gap: 0; align-items: center; }
			.export-head { flex-direction: column; }
		}
	</style>
</head>
<body>
	<div class="shell">
		<aside class="sidebar">
			<div class="brand">
				<a class="brand-home" href="index.html" aria-label="返回首頁" title="返回首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5h-6v-6h-5v6h-6V10Z"/></svg></a>
				<div><strong>行程管理器</strong><small>TRAVEL PLAN STUDIO</small></div>
			</div>
			<div id="itinerary-nav-panel" class="itinerary-nav-panel">
				<button id="journey-settings-link" class="side-tab journey-settings-link" type="button" aria-current="page" aria-controls="journey-panel-settings"><i class="ph ph-sliders-horizontal"></i><span>行程設置</span></button>
				<div class="sidebar-divider" aria-hidden="true"></div>
				<div class="side-label"><span>每日行程</span><span id="side-count" class="side-count">10 DAYS</span></div>
				<nav id="day-list" class="day-list" aria-label="每日行程"></nav>
				<button id="add-day" class="add-day" type="button" disabled><i class="ph ph-plus"></i> 新增一天</button>
			</div>
			<div class="side-bottom">本機編輯模式<br>修改後請匯出並取代來源 JS</div>
		</aside>

		<main class="main">
			<header class="topbar">
				<div class="top-heading-group"><button id="sidebar-toggle" class="button icon-only bookmark-toggle" type="button" title="隱藏側邊欄" aria-label="隱藏側邊欄" aria-expanded="true" aria-controls="itinerary-nav-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.7-5.5 3.7v-17Z"/><path d="M9.5 8h5M9.5 11h5"/></svg></button><div class="top-title"><div class="eyebrow" id="workspace-eyebrow">JOURNEY SETTINGS</div><h1 id="page-title">行程設置</h1></div></div>
				<div class="top-actions">
					<div class="save-state"><span id="state-dot" class="state-dot"></span><span id="state-text">尚未載入資料</span></div>
					<button id="save-source" class="button" type="button" title="儲存回原檔" aria-label="儲存回原檔" disabled><i class="ph ph-floppy-disk"></i>儲存</button>
					<button id="export-top" class="button primary icon-only" type="button" title="產生更新檔" aria-label="產生更新檔" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 14.5v5h14v-5"/></svg></button>
				</div>
			</header>

			<div class="content">
				<section id="journey-panel-settings" class="journey-panel" aria-labelledby="journey-settings-link">
						<section class="journey-settings" aria-label="行程設置">
							<header class="panel-intro"><div class="eyebrow">JOURNEY SETTINGS</div><h2>行程設置</h2><p>選擇資料來源，並設定此行程在前台顯示的網站標題。</p></header>
							<section class="source-picker" aria-label="選擇行程資料檔">
								<div class="source-info"><strong>資料來源</strong><span id="source-name">尚未選取</span><small id="source-write-status">選取本機 JS 後才會載入行程資料。</small></div>
								<div class="source-actions"><button id="choose-source-file" class="button" type="button"><i class="ph ph-folder-open"></i>選取本機 JS</button><input id="source-file" type="file" accept=".js,application/javascript,text/javascript"></div>
							</section>
							<section id="site-settings" class="site-settings" aria-label="網站標題設定"></section>
						</section>
					</section>
				<section id="journey-panel-daily" class="journey-panel" aria-label="每日行程" hidden>
					<section class="intro">
						<div><div class="eyebrow">ITINERARY</div><h2>編輯每日行程</h2><p>選擇日期編輯路線資訊，完成後匯出所選 JS 資料檔。</p></div>
						<div class="counter"><strong id="day-total">0</strong><span>個行程日</span></div>
					</section>
					<section id="editor" class="editor-card" aria-live="polite"></section>
					<section id="export-section" class="export">
						<div class="export-head">
							<div><h3>更新檔案預覽</h3><p>下載後以此檔案取代來源：<span id="export-target-label">data.js</span></p></div>
							<div class="export-actions">
								<button id="copy-code" class="button" type="button" disabled><i class="ph ph-copy"></i>複製</button>
								<button id="download-code" class="button primary" type="button" disabled><i class="ph ph-download-simple"></i>下載 <span id="download-file-label">data.js</span></button>
							</div>
						</div>
						<textarea id="code-output" class="code-output" readonly spellcheck="false" aria-label="產生的行程資料 JS" placeholder="點擊右上角「產生更新檔」以預覽匯出內容"></textarea>
					</section>
					</section>
			</div>
		</main>
	</div>
	<div id="toast" class="toast" role="status"></div>

	<script>
		const editor = document.getElementById('editor');
		const dayList = document.getElementById('day-list');
		const codeOutput = document.getElementById('code-output');
		const stateText = document.getElementById('state-text');
		const stateDot = document.getElementById('state-dot');
		let itineraryData = [];
		let hasLoadedSource = false;
		const siteSettingsDefaults = {
			pageTitle: '土耳其傳奇 11 日',
			heroTitle: '星月傳奇．土耳其11日',
			dateText: '2026/10/8(四) ~ 2026/10/18(日)',
			subtitle: '跟團行程 · 11 天 · 2026 秋季',
			heroImage: 'https://images.unsplash.com/photo-1549740425-5e9ed4d8cd34?q=80&w=1800&auto=format&fit=crop',
			mapEngine: 'google'
		};
		let siteSettingsDraft = { ...siteSettingsDefaults, ...(typeof siteSettings === 'undefined' ? {} : siteSettings) };
		let exportFileName = 'data.js';
		let sourceFileHandle = null;
		let sourceSnapshot = '';
		let useFallbackSourcePicker = false;
		let selectedDay = 0;
		let hasChanges = false;
		let toastTimer;

		function escapeHtml(value) {
			return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
		}

		function showToast(message) {
			const toast = document.getElementById('toast');
			toast.textContent = message;
			toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
		}

		function renderSiteSettings() {
			const fields = [
				['pageTitle', '瀏覽器分頁 title', '顯示於瀏覽器分頁與書籤'],
				['heroTitle', '首頁主標題', '顯示於前台首頁照片上'],
				['dateText', '日期文字', '顯示於首頁主標題下方'],
				['subtitle', '副標 / 行程說明', '顯示於首頁日期下方']
			];
			const mapEngines = [
				['google', 'Google Map', 'ph-map-pin'],
				['amap', '高德地圖', 'ph-map-pin-line'],
				['baidu', '百度地圖', 'ph-map-trifold']
			];
			document.getElementById('site-settings').innerHTML = `
				<div class="site-settings-head"><h3>網站標題</h3><p>這些設定會和每日行程一起輸出到 ${escapeHtml(exportFileName)}。</p></div>
				<div class="site-settings-grid">${fields.map(([key, label, hint]) => `
					<label class="site-setting">${label}<input type="text" data-site-setting="${key}" value="${escapeHtml(siteSettingsDraft[key])}" aria-label="${label}" title="${hint}"></label>`).join('')}
					<label class="site-setting site-setting-image" for="hero-image-setting">標題背景圖網址<div class="image-row"><textarea id="hero-image-setting" data-site-setting="heroImage" aria-label="標題背景圖網址" placeholder="https://...">${escapeHtml(siteSettingsDraft.heroImage)}</textarea><div class="image-preview">${siteSettingsDraft.heroImage ? `<img src="${escapeHtml(siteSettingsDraft.heroImage)}" alt="標題背景圖預覽" onerror="this.style.display='none'">` : ''}</div></div></label>
				</div>
				<fieldset class="map-engine-setting"><legend>地圖搜尋引擎</legend><div class="map-engine-options">${mapEngines.map(([value, label, icon]) => `
					<label class="map-engine-option"><input type="radio" name="mapEngine" data-site-setting="mapEngine" value="${value}" ${siteSettingsDraft.mapEngine === value ? 'checked' : ''}><i class="ph ${icon}" aria-hidden="true"></i><span>${label}</span></label>`).join('')}
				</div></fieldset>`;
		}

		function markChanged() {
			hasChanges = true;
			codeOutput.value = '';
			stateText.textContent = '有未匯出的修改';
			stateDot.classList.add('dirty');
			document.getElementById('day-total').textContent = itineraryData.length;
			document.getElementById('side-count').textContent = `${itineraryData.length} DAYS`;
			updateSourceSaveButton();
		}

		function getDayLabel(index) {
			const day = itineraryData[index];
			return day.day || `Day ${index + 1}`;
		}

		function renderSidebar() {
			dayList.innerHTML = itineraryData.map((day, index) => {
				const isActive = activeJourneyPanel === 'journey-panel-daily' && index === selectedDay;
				return `
				<button class="day-link ${isActive ? 'active' : ''}" type="button" data-select="${index}" aria-current="${isActive ? 'page' : 'false'}">
					<span class="day-number">${String(index + 1).padStart(2, '0')}</span>
					<span class="day-label">${escapeHtml(day.day || `Day ${index + 1}`)} · ${escapeHtml(day.title || '未命名行程')}</span>
				</button>`;
			}).join('');
			document.getElementById('day-total').textContent = itineraryData.length;
			document.getElementById('side-count').textContent = `${itineraryData.length} DAYS`;
		}

		function inputField(label, path, value, options = {}) {
			const full = options.full ? ' full' : '';
			const placeholder = options.placeholder ? ` placeholder="${escapeHtml(options.placeholder)}"` : '';
			const type = options.type || 'text';
			if (options.textarea) {
				return `<div class="field${full}"><label for="field-${path.replace('.', '-')}">${label}</label><textarea id="field-${path.replace('.', '-')}" data-path="${path}"${placeholder}>${escapeHtml(value)}</textarea></div>`;
			}
			return `<div class="field${full}"><label for="field-${path.replace('.', '-')}">${label}</label><input id="field-${path.replace('.', '-')}" type="${type}" data-path="${path}" value="${escapeHtml(value)}"${placeholder}></div>`;
		}

		function renderWeatherPicker(selectedIcon) {
			const weatherIcons = [
				['ph-sun', '晴天'], ['ph-cloud-sun', '晴時多雲'], ['ph-cloud', '多雲'], ['ph-cloud-moon', '夜間多雲'], ['ph-moon', '晴夜'],
				['ph-cloud-rain', '降雨'], ['ph-cloud-snow', '降雪'], ['ph-cloud-fog', '起霧'], ['ph-lightning', '雷雨'], ['ph-wind', '強風']
			];
			const activeIcon = weatherIcons.some(([icon]) => icon === selectedIcon) ? selectedIcon : 'ph-sun';
			return `<div class="field weather-select-field"><label for="weather-icon-select">天氣圖示</label><div class="weather-select-control"><span class="weather-icon-preview"><i id="weather-icon-preview" class="ph ${activeIcon}" aria-hidden="true"></i></span><select id="weather-icon-select" data-path="weather.icon" aria-label="天氣圖示">${weatherIcons.map(([icon, label]) => `<option value="${icon}" ${activeIcon === icon ? 'selected' : ''}>${label}</option>`).join('')}</select></div></div>`;
		}

		function renderList(title, key, items, placeholder, icon) {
			const list = Array.isArray(items) ? items : [];
			return `<div class="list-block">
				<div class="list-top"><span class="list-heading"><i class="ph ${icon}"></i> ${title} (${list.length})</span><button class="small-button" type="button" data-add-item="${key}"><i class="ph ph-plus"></i>新增</button></div>
				<div class="list-items">${list.map((item, index) => `<div class="list-item">
					<span class="list-index">${String(index + 1).padStart(2, '0')}</span>
					<textarea data-list="${key}" data-index="${index}" aria-label="${title} ${index + 1}" placeholder="${placeholder}">${escapeHtml(item)}</textarea>
					<button class="remove-item" type="button" data-remove-item="${key}" data-index="${index}" aria-label="刪除第 ${index + 1} 項" title="刪除此項"><i class="ph ph-trash"></i></button>
				</div>`).join('')}</div>
			</div>`;
		}

		function parseSourceFile(source) {
			const itineraryMatch = source.match(/\bconst\s+itineraryData\s*=\s*([\s\S]*);\s*$/);
			if (!itineraryMatch) throw new Error('找不到 const itineraryData 資料。');
			const itinerary = JSON.parse(itineraryMatch[1]);
			if (!Array.isArray(itinerary)) throw new Error('itineraryData 必須是陣列。');
			const settingsMatch = source.match(/\bconst\s+siteSettings\s*=\s*([\s\S]*?);\s*(?=const\s+itineraryData\b)/);
			const settings = settingsMatch ? JSON.parse(settingsMatch[1]) : {};
			return { itinerary, settings };
		}

		async function loadSourceFile(file, fileHandle = null) {
			if (hasChanges && !window.confirm('目前有尚未匯出的修改。切換資料來源會捨棄這些修改，確定繼續嗎？')) return;
			try {
				const source = await file.text();
				const { itinerary, settings } = parseSourceFile(source);
				itineraryData.splice(0, itineraryData.length, ...itinerary);
				hasLoadedSource = true;
				siteSettingsDraft = { ...siteSettingsDefaults, ...settings };
				exportFileName = file.name;
				sourceFileHandle = fileHandle;
				sourceSnapshot = source;
				document.getElementById('source-name').textContent = file.name;
				document.getElementById('source-write-status').textContent = fileHandle ? '已選取原檔；儲存時仍會要求明確寫入權限。' : '此瀏覽器選檔模式僅能讀取；請下載更新檔取代原檔。';
				document.getElementById('export-target-label').textContent = file.name;
				document.getElementById('download-file-label').textContent = file.name;
				document.getElementById('add-day').disabled = false;
				document.getElementById('export-top').disabled = false;
				document.getElementById('copy-code').disabled = false;
				document.getElementById('download-code').disabled = false;
				codeOutput.value = '';
				hasChanges = false;
				stateText.textContent = `已載入 ${file.name}`;
				stateDot.classList.remove('dirty');
				updateSourceSaveButton();
				renderSiteSettings();
				renderEditor();
				updateWorkspaceTitle();
				showToast(`已載入 ${file.name}`);
			} catch (error) {
				showToast(`無法讀取此檔案：${error.message}`);
			}
		}

		function updateSourceSaveButton() {
			document.getElementById('save-source').disabled = !sourceFileHandle || !hasChanges;
		}

		async function chooseSourceFile() {
			const fileInput = document.getElementById('source-file');
			if (useFallbackSourcePicker || !window.showOpenFilePicker) {
				useFallbackSourcePicker = true;
				document.getElementById('source-write-status').textContent = '此瀏覽器只能讀取選取的檔案；編輯後請下載更新檔取代原檔。';
				fileInput.click();
				return;
			}
			try {
				const [fileHandle] = await window.showOpenFilePicker({
					types: [{ description: 'JavaScript 檔案', accept: { 'text/javascript': ['.js'] } }],
					multiple: false
				});
				const file = await fileHandle.getFile();
				await loadSourceFile(file, fileHandle);
			} catch (error) {
				if (error.name === 'AbortError') return;
				useFallbackSourcePicker = true;
				sourceFileHandle = null;
				updateSourceSaveButton();
				document.getElementById('source-write-status').textContent = '瀏覽器限制直接讀取檔案；請在接續的檔案視窗重新選取，並以下載方式更新原檔。';
				showToast('無法直接讀取檔案，改用一般選檔；回寫不可用，請使用下載。');
				fileInput.click();
			}
		}

		async function saveSourceFile() {
			if (!sourceFileHandle || !hasChanges) return;
			let writable;
			try {
				let permission = await sourceFileHandle.queryPermission({ mode: 'readwrite' });
				if (permission !== 'granted') permission = await sourceFileHandle.requestPermission({ mode: 'readwrite' });
				if (permission !== 'granted') throw new Error('未取得寫入權限。');
				const currentSource = await (await sourceFileHandle.getFile()).text();
				if (currentSource !== sourceSnapshot) throw new Error('原檔在載入後已有變更，請重新選取檔案以避免覆蓋。');
				const source = buildExportSource();
				parseSourceFile(source);
				writable = await sourceFileHandle.createWritable();
				await writable.write(source);
				await writable.close();
				sourceSnapshot = source;
				codeOutput.value = source;
				hasChanges = false;
				stateText.textContent = `已回寫 ${exportFileName}`;
				stateDot.classList.remove('dirty');
				updateSourceSaveButton();
				showToast(`已儲存回 ${exportFileName}`);
			} catch (error) {
				if (writable) await writable.abort().catch(() => {});
				showToast(`無法回寫檔案：${error.message}`);
			}
		}

		function parseSpot(spot) {
			const value = String(spot ?? '');
			const separatorIndex = value.indexOf(' ｜ ');
			if (separatorIndex < 0) return { name: value, description: '' };
			return { name: value.slice(0, separatorIndex), description: value.slice(separatorIndex + 3) };
		}

		function renderSpots(day) {
			const spots = Array.isArray(day.spots) ? day.spots : [];
			const mapQueries = Array.isArray(day.spotMapQueries) ? day.spotMapQueries : [];
			return `<div class="list-block">
				<div class="list-top"><span class="list-heading"><i class="ph ph-map-pin"></i> 景點 (${spots.length})</span><button class="small-button" type="button" data-add-item="spots"><i class="ph ph-plus"></i>新增</button></div>
				<div class="spot-items">${spots.map((spot, index) => {
					const parts = parseSpot(spot);
					const query = mapQueries[index] ?? (parts.name ? `${parts.name} 土耳其` : '');
					const imageUrl = day.spotImages?.[index] || '';
					return `<div class="spot-item">
						<span class="list-index">${String(index + 1).padStart(2, '0')}</span>
						<div class="spot-fields">
							<label class="spot-field">景點名稱<input type="text" data-spot-index="${index}" data-spot-field="name" value="${escapeHtml(parts.name)}" placeholder="例如：聖索菲亞清真寺"></label>
							<label class="spot-field map-query">Map 搜尋內容<input type="text" data-spot-index="${index}" data-spot-field="mapQuery" value="${escapeHtml(query)}" placeholder="景點名稱 + 土耳其"></label>
							<label class="spot-field spot-image">圖片連結<input type="url" data-spot-index="${index}" data-spot-field="image" value="${escapeHtml(imageUrl)}" placeholder="https://..."><img class="spot-image-preview" src="${escapeHtml(imageUrl)}" alt="景點圖片預覽" ${imageUrl ? '' : 'hidden'} onerror="this.hidden=true"></label>
							<label class="spot-field spot-description">景點介紹<textarea data-spot-index="${index}" data-spot-field="description" placeholder="輸入景點內容">${escapeHtml(parts.description)}</textarea></label>
						</div>
						<button class="remove-item" type="button" data-remove-spot="${index}" aria-label="刪除景點 ${index + 1}" title="刪除此景點"><i class="ph ph-trash"></i></button>
					</div>`;
				}).join('')}</div>
			</div>`;
		}

		function renderEditor() {
			if (!itineraryData.length) {
				editor.innerHTML = '<div class="empty">目前沒有行程，請新增一天開始編輯。</div>';
				document.getElementById('page-title').textContent = '行程總覽';
				renderSidebar();
				return;
			}
			selectedDay = Math.max(0, Math.min(selectedDay, itineraryData.length - 1));
			const day = itineraryData[selectedDay];
			document.getElementById('page-title').textContent = `${day.day || '行程'}｜${day.title || '未命名行程'}`;
			const image = escapeHtml(day.image || '');
			editor.innerHTML = `
				<div class="editor-head">
					<div><h3>第 ${selectedDay + 1} 組行程資料</h3><p>修改內容會即時保留在此頁，匯出後才會寫入更新檔。</p></div>
					<div class="move-actions">
						<button class="button icon-only" type="button" data-move="-1" title="前移一天" aria-label="前移一天" ${selectedDay === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
						<button class="button icon-only" type="button" data-move="1" title="後移一天" aria-label="後移一天" ${selectedDay === itineraryData.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m5.5-5.5L12 19l-5.5-5.5"/></svg></button>
						<button class="button icon-only danger" type="button" data-delete-day title="刪除此行程日" aria-label="刪除此行程日"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V4.8h6V7m3 0-.8 12H6.8L6 7m3.5 3.5v5m5-5v5"/></svg></button>
					</div>
				</div>
				<div class="editor-body">
					<section class="section">
						<h4 class="section-title"><i class="ph ph-calendar-dots"></i>日期與主題</h4>
						<div class="field-grid">
							${inputField('行程天數標籤', 'day', day.day, { placeholder: 'Day 1' })}
							${inputField('日期', 'fullDate', day.fullDate, { placeholder: '2026/10/8 (四)' })}
							${inputField('行程標題', 'title', day.title, { full: true })}
						</div>
					</section>
					<section class="section">
						<h4 class="section-title"><i class="ph ph-cloud-sun"></i>天氣與主視覺</h4>
						<div class="field-grid">
							${renderWeatherPicker(day.weather?.icon)}
							${inputField('氣溫', 'weather.temp', day.weather?.temp, { placeholder: '10-18°C' })}
							<div class="field full"><label for="field-image">圖片網址</label><div class="image-row"><textarea id="field-image" data-path="image" placeholder="https://...">${image}</textarea><div class="image-preview">${image ? `<img src="${image}" alt="行程圖片預覽" onerror="this.style.display='none'">` : ''}</div></div></div>
						</div>
					</section>
					<section class="section">
						<h4 class="section-title"><i class="ph ph-map-trifold"></i>行程內容</h4>
						${renderList('航班資訊', 'flights', day.flights, '輸入航班資訊', 'ph-airplane-tilt')}
						${renderSpots(day)}
						${renderList('特別提醒', 'specialNotes', day.specialNotes, '輸入當日提醒', 'ph-warning-circle')}
					</section>
					<section class="section">
						<h4 class="section-title"><i class="ph ph-notebook"></i>旅遊備註</h4>
						<div class="field-grid">
							${inputField('穿搭建議', 'outfit', day.outfit, { textarea: true, full: true })}
							${inputField('必買', 'buy', day.buy, { textarea: true })}
							${inputField('必吃', 'eat', day.eat, { textarea: true })}
							${inputField('膳宿安排', 'stay', day.stay, { textarea: true, full: true })}
							${inputField('旅遊提醒 / Tips', 'tips', day.tips, { textarea: true, full: true })}
						</div>
					</section>
				</div>`;
			renderSidebar();
		}

		function updatePath(path, value) {
			const parts = path.split('.');
			let target = itineraryData[selectedDay];
			for (const part of parts.slice(0, -1)) {
				if (!target[part] || typeof target[part] !== 'object') target[part] = {};
				target = target[part];
			}
			target[parts[parts.length - 1]] = value;
		}

		function addDay() {
			const lastDayLabel = itineraryData[itineraryData.length - 1]?.day || '';
			const lastRange = lastDayLabel.match(/(\d+)(?:\s*-\s*(\d+))?/);
			const nextNumber = lastRange ? Number(lastRange[2] || lastRange[1]) + 1 : itineraryData.length + 1;
			itineraryData.push({
				day: `Day ${nextNumber}`, fullDate: '', title: '', weather: { icon: 'ph-sun', temp: '' }, image: '',
				flights: [], spots: [], specialNotes: [], outfit: '', buy: '', eat: '', stay: '', tips: ''
			});
			selectedDay = itineraryData.length - 1;
			markChanged();
			activateJourneyPanel('journey-panel-daily');
			renderEditor();
			showToast('已新增行程日');
		}

		dayList.addEventListener('click', (event) => {
			const button = event.target.closest('[data-select]');
			if (!button) return;
			activateJourneyPanel('journey-panel-daily');
			selectedDay = Number(button.dataset.select);
			renderEditor();
			updateWorkspaceTitle();
		});

		editor.addEventListener('input', (event) => {
			const target = event.target;
			if (target.dataset.path) updatePath(target.dataset.path, target.value);
			if (target.id === 'weather-icon-select') editor.querySelector('#weather-icon-preview').className = `ph ${target.value}`;
			if (target.dataset.spotField) {
				const day = itineraryData[selectedDay];
				const index = Number(target.dataset.spotIndex);
				const parts = parseSpot(day.spots[index]);
				if (target.dataset.spotField === 'image') {
					if (!Array.isArray(day.spotImages)) day.spotImages = day.spots.map((_, spotIndex) => day.spotImages?.[spotIndex] || '');
					day.spotImages[index] = target.value;
					const preview = target.parentElement.querySelector('.spot-image-preview');
					if (target.value) {
						preview.src = target.value;
						preview.hidden = false;
					} else {
						preview.removeAttribute('src');
						preview.hidden = true;
					}
				} else if (target.dataset.spotField === 'name' || target.dataset.spotField === 'description') {
					parts[target.dataset.spotField] = target.value;
					day.spots[index] = `${parts.name} ｜ ${parts.description}`;
					if (target.dataset.spotField === 'name' && !day.spotMapQueries?.[index]) {
						target.closest('.spot-item').querySelector('[data-spot-field="mapQuery"]').value = parts.name ? `${parts.name} 土耳其` : '';
					}
				} else {
					if (!Array.isArray(day.spotMapQueries)) {
						day.spotMapQueries = day.spots.map((spot, spotIndex) => day.spotMapQueries?.[spotIndex] ?? `${parseSpot(spot).name} 土耳其`);
					}
					day.spotMapQueries[index] = target.value;
				}
			}
			if (target.dataset.list) itineraryData[selectedDay][target.dataset.list][Number(target.dataset.index)] = target.value;
			if (target.id === 'field-image') {
				const preview = editor.querySelector('.image-preview');
				preview.innerHTML = target.value ? `<img src="${escapeHtml(target.value)}" alt="行程圖片預覽" onerror="this.style.display='none'">` : '';
			}
			markChanged();
			const titleInput = editor.querySelector('[data-path="title"]');
			const dayInput = editor.querySelector('[data-path="day"]');
			if (titleInput || dayInput) {
				document.getElementById('page-title').textContent = `${dayInput?.value || '行程'}｜${titleInput?.value || '未命名行程'}`;
				const activeLabel = dayList.querySelector('.day-link.active .day-label');
				if (activeLabel) activeLabel.textContent = `${dayInput?.value || 'Day'} · ${titleInput?.value || '未命名行程'}`;
			}
		});

		editor.addEventListener('click', (event) => {
			const addButton = event.target.closest('[data-add-item]');
			const removeButton = event.target.closest('[data-remove-item]');
			const removeSpotButton = event.target.closest('[data-remove-spot]');
			const moveButton = event.target.closest('[data-move]');
			if (addButton) {
				const key = addButton.dataset.addItem;
				if (!Array.isArray(itineraryData[selectedDay][key])) itineraryData[selectedDay][key] = [];
				itineraryData[selectedDay][key].push(key === 'spots' ? ' ｜ ' : '');
				if (key === 'spots' && Array.isArray(itineraryData[selectedDay].spotMapQueries)) itineraryData[selectedDay].spotMapQueries.push('');
				if (key === 'spots' && Array.isArray(itineraryData[selectedDay].spotImages)) itineraryData[selectedDay].spotImages.push('');
				markChanged();
				renderEditor();
				const fields = key === 'spots' ? editor.querySelectorAll('[data-spot-field="name"]') : editor.querySelectorAll(`[data-list="${key}"]`);
				fields[fields.length - 1]?.focus();
				return;
			}
			if (removeSpotButton) {
				const index = Number(removeSpotButton.dataset.removeSpot);
				itineraryData[selectedDay].spots.splice(index, 1);
				itineraryData[selectedDay].spotMapQueries?.splice(index, 1);
				itineraryData[selectedDay].spotImages?.splice(index, 1);
				markChanged();
				renderEditor();
				return;
			}
			if (removeButton) {
				itineraryData[selectedDay][removeButton.dataset.removeItem].splice(Number(removeButton.dataset.index), 1);
				markChanged();
				renderEditor();
				return;
			}
			if (moveButton) {
				const nextIndex = selectedDay + Number(moveButton.dataset.move);
				[itineraryData[selectedDay], itineraryData[nextIndex]] = [itineraryData[nextIndex], itineraryData[selectedDay]];
				selectedDay = nextIndex;
				markChanged();
				renderEditor();
				return;
			}
			if (event.target.closest('[data-delete-day]')) {
				if (itineraryData.length === 1) return showToast('至少保留一天行程');
				if (!window.confirm(`確定刪除「${getDayLabel(selectedDay)}」嗎？`)) return;
				itineraryData.splice(selectedDay, 1);
				selectedDay = Math.min(selectedDay, itineraryData.length - 1);
				markChanged();
				renderEditor();
				showToast('已刪除行程日');
			}
		});

		function buildExportSource() {
			return `const siteSettings = ${JSON.stringify(siteSettingsDraft, null, 4)};\n\nconst itineraryData = ${JSON.stringify(itineraryData, null, 4)};\n`;
		}

		function makeExport() {
			codeOutput.value = buildExportSource();
			document.getElementById('export-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
			stateText.textContent = hasChanges ? '已產生，請複製或下載' : '更新檔已產生';
			showToast(hasChanges ? '更新檔已產生，記得複製或下載' : '更新檔已產生');
		}

		function markExported() {
			hasChanges = false;
			stateText.textContent = '已複製或下載更新檔';
			stateDot.classList.remove('dirty');
		}

		const shell = document.querySelector('.shell');
		const sidebarToggle = document.getElementById('sidebar-toggle');
		const journeyPanels = [...document.querySelectorAll('.journey-panel')];
		const journeySettingsLink = document.getElementById('journey-settings-link');
		let activeJourneyPanel = 'journey-panel-settings';
		function updateWorkspaceTitle() {
			if (activeJourneyPanel === 'journey-panel-settings') {
				document.getElementById('workspace-eyebrow').textContent = 'JOURNEY SETTINGS';
				document.getElementById('page-title').textContent = '行程設置';
				return;
			}
			const day = itineraryData[selectedDay];
			document.getElementById('workspace-eyebrow').textContent = 'TRAVEL PLAN';
			document.getElementById('page-title').textContent = `${day?.day || '旅遊行程'}｜${day?.title || '行程總覽'}`;
		}

		function activateJourneyPanel(panelId) {
			activeJourneyPanel = panelId;
			journeySettingsLink.setAttribute('aria-current', String(panelId === 'journey-panel-settings' ? 'page' : 'false'));
			journeyPanels.forEach((panel) => { panel.hidden = panel.id !== activeJourneyPanel; });
			renderSidebar();
			updateWorkspaceTitle();
		}

		journeySettingsLink.addEventListener('click', () => activateJourneyPanel('journey-panel-settings'));
		function setSidebarCollapsed(collapsed) {
			shell.classList.toggle('sidebar-collapsed', collapsed);
			sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
			sidebarToggle.title = collapsed ? '顯示側邊欄' : '隱藏側邊欄';
			sidebarToggle.setAttribute('aria-label', sidebarToggle.title);
		}
		sidebarToggle.addEventListener('click', () => setSidebarCollapsed(!shell.classList.contains('sidebar-collapsed')));
		document.getElementById('site-settings').addEventListener('input', (event) => {
			const key = event.target.dataset.siteSetting;
			if (!key) return;
			siteSettingsDraft[key] = event.target.value;
			if (key === 'heroImage') {
				const imageUrl = /^https?:\/\//i.test(event.target.value.trim()) ? escapeHtml(event.target.value.trim()) : '';
				const preview = event.target.parentElement.querySelector('.image-preview');
				preview.innerHTML = imageUrl ? `<img src="${imageUrl}" alt="標題背景圖預覽" onerror="this.style.display='none'">` : '';
			}
			markChanged();
		});
		document.getElementById('add-day').addEventListener('click', addDay);
		document.getElementById('choose-source-file').addEventListener('click', chooseSourceFile);
		document.getElementById('source-file').addEventListener('change', (event) => {
			const file = event.target.files?.[0];
			if (file) loadSourceFile(file);
			event.target.value = '';
		});
		document.getElementById('save-source').addEventListener('click', saveSourceFile);
		document.getElementById('export-top').addEventListener('click', makeExport);
		document.getElementById('copy-code').addEventListener('click', async () => {
			if (!codeOutput.value) makeExport();
			try {
				await navigator.clipboard.writeText(codeOutput.value);
			} catch {
				codeOutput.focus();
				codeOutput.select();
				document.execCommand('copy');
				codeOutput.setSelectionRange(0, 0);
			}
			markExported();
			showToast('data.js 已複製');
		});
		document.getElementById('download-code').addEventListener('click', () => {
			if (!codeOutput.value) makeExport();
			const file = new Blob([codeOutput.value], { type: 'text/javascript;charset=utf-8' });
			const url = URL.createObjectURL(file);
			const link = document.createElement('a');
			link.href = url;
			link.download = exportFileName;
			link.click();
			URL.revokeObjectURL(url);
			markExported();
			showToast('已下載 data.js');
		});

		window.addEventListener('beforeunload', (event) => {
			if (!hasChanges) return;
			event.preventDefault();
			event.returnValue = '';
		});

		if (hasLoadedSource) {
			renderSiteSettings();
			renderEditor();
		} else {
			renderSidebar();
			document.getElementById('site-settings').innerHTML = '<div class="empty">請先選取本機 JS 資料檔，載入後即可編輯行程與網站設定。</div>';
			editor.innerHTML = '<div class="empty">尚未載入行程資料。請先在「行程設置」選取本機 JS 檔。</div>';
		}
		activateJourneyPanel(activeJourneyPanel);
	</script>
</body>
</html>
