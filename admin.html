<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f4f5f0">
	<title>行程管理後台</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/@phosphor-icons/web"></script>
	<style>
		:root {
			color-scheme: light;
			--ink: #26332e;
			--muted: #78817a;
			--paper: #f4f5f0;
			--white: #fff;
			--line: #e3e7e0;
			--green: #315a4c;
			--green-deep: #203d34;
			--coral: #cf795f;
			--lime: #e9efbd;
			--shadow: 0 12px 36px rgba(37, 57, 47, .07);
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', 'DM Sans', sans-serif; font-size: 15px; }
		button { cursor: pointer; }
		.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
		.shell.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
		.shell.sidebar-collapsed .sidebar { display: none; }
		.sidebar-handle {
			position: fixed; top: 90px; left: 216px; transform: none;
			width: 14px; height: 54px; background: var(--green-deep); color: rgba(255,255,255,.6);
			border: none; border-radius: 0 4px 4px 0; display: flex; align-items: center; justify-content: center;
			cursor: pointer; z-index: 50; transition: background .2s, color .2s, left .2s;
		}
		.sidebar-handle:hover { background: var(--lime); color: var(--green-deep); }
		.shell.sidebar-collapsed .sidebar-handle { left: 0; background: var(--green); color: white; }
		.shell.sidebar-collapsed .sidebar-handle i { transform: scaleX(-1); }
		.sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 26px 18px 18px; background: var(--green-deep); color: #f5f7f1; }
		.brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 26px; border-bottom: 1px solid rgba(255,255,255,.13); }
		.brand-home { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #f5f7f1; text-decoration: none; }
		.brand-home:hover, .brand-home:focus-visible { border-color: #e9efbd; background: rgba(255,255,255,.1); color: #e9efbd; }
		.brand-home svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
		.brand strong { display: block; font-size: 15px; letter-spacing: .02em; }
		.brand small { display: block; margin-top: 2px; color: #b5c4ba; font-family: 'DM Sans', sans-serif; font-size: 11px; }
		.side-tabs { display: grid; flex: 0 0 auto; gap: 4px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.13); }
		.side-tab { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 48px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #dce5dc; text-align: center; font-size: 13px; font-weight: 700; transition: background .18s, color .18s; }
		.side-tab i { color: #a9bbb0; font-size: 18px; }
		.side-tab:hover { background: rgba(255,255,255,.08); }
		.side-tab[aria-selected="true"] { border-color: rgba(233,239,189,.22); background: rgba(233,239,189,.12); color: var(--lime); }
		.side-tab[aria-selected="true"] i { color: var(--lime); }
		.itinerary-nav-panel { display: flex; flex: 1; flex-direction: column; min-height: 0; }
		.journey-settings-link { margin: 12px 0; }
		.journey-settings-link[aria-current="page"] { border-color: rgba(233,239,189,.22); background: rgba(233,239,189,.12); color: var(--lime); }
		.journey-settings-link[aria-current="page"] i { color: var(--lime); }
		.sidebar-divider { height: 1px; flex: 0 0 1px; margin: 0 3px 3px; background: rgba(255,255,255,.16); }
		.side-label { display: flex; align-items: center; gap: 9px; padding: 22px 9px 10px; color: #a9bbb0; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
		.side-count { margin-left: auto; }
		.day-list { display: grid; grid-auto-rows: 43px; align-content: start; flex: 1; min-height: 0; gap: 4px; overflow-y: auto; padding-right: 3px; scrollbar-width: none; -ms-overflow-style: none; }
		.day-list::-webkit-scrollbar { display: none; }
		.day-link { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 43px; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; color: #dce5dc; text-align: left; transition: background .18s, color .18s; }
		.day-link:hover { background: rgba(255,255,255,.08); }
		.day-link.active { background: var(--lime); color: var(--green-deep); }
		.day-number { display: grid; width: 25px; height: 25px; flex: 0 0 25px; place-items: center; border: 1px solid currentColor; border-radius: 50%; font: 600 10px 'DM Sans', sans-serif; opacity: .82; }
		.day-label { min-width: 0; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
		.add-day { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; margin-top: 12px; border: 1px dashed rgba(255,255,255,.35); border-radius: 7px; background: transparent; color: #eff4ec; font-size: 12px; }
		.add-day:hover { background: rgba(255,255,255,.08); }
		.add-day:disabled { cursor: not-allowed; opacity: .45; }
		.side-bottom { margin-top: auto; padding: 15px 9px 2px; color: #a9bbb0; font-size: 11px; line-height: 1.7; }
		.main { min-width: 0; }
		.topbar { position: sticky; z-index: 5; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px; padding: 12px clamp(18px, 4vw, 54px); border-bottom: 1px solid var(--line); background: rgba(244,245,240,.94); backdrop-filter: blur(14px); }
		.top-heading-group { display: flex; align-items: center; gap: 12px; min-width: 0; }
		.sidebar-toggle-btn { border-color: transparent; background: transparent; color: #59655e; box-shadow: none; transition: background .2s, color .2s; }
		.sidebar-toggle-btn:hover { background: #e3e8df; color: var(--green-deep); }
		.sidebar-toggle-btn[aria-expanded="false"] { color: var(--coral); background: #fdf3f1; }
		.top-title { min-width: 0; }
		.eyebrow { color: var(--coral); font: 700 10px 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		.top-title h1 { overflow: hidden; margin: 3px 0 0; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
		.top-actions { display: flex; align-items: center; gap: 9px; }
		.save-state { display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
		.state-dot { width: 7px; height: 7px; border-radius: 50%; background: #80a48b; }
		.state-dot.dirty { background: var(--coral); }
		.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: var(--ink); font-size: 12px; font-weight: 600; transition: transform .16s, background .16s; }
		.button:hover { transform: translateY(-1px); background: #fafbf8; }
		.button.primary { border-color: var(--green); background: var(--green); color: white; }
		.button.primary:hover { background: var(--green-deep); }
		.button.icon-only { width: 38px; padding: 0; }
		.button.icon-only i, .button.download-combo i { font-size: 19px; line-height: 1; }
		.button.icon-only svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
		.button.icon-only:disabled { cursor: not-allowed; opacity: .4; transform: none; }
		.button.icon-only.danger { color: #a85f52; }
		.button.icon-only.danger:hover { border-color: #e7c9c2; background: #fff5f2; }
		.button.needs-update { position: relative; border-color: var(--coral); color: #b54a32; background: #fff8f5; font-weight: 700; animation: pulse-border 2s infinite; }
		.button.needs-update::after { content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px #fff; }
		@keyframes pulse-border { 0%, 100% { box-shadow: 0 0 0 0 rgba(207, 121, 95, 0.4); } 50% { box-shadow: 0 0 0 4px rgba(207, 121, 95, 0); } }
		.confirm-dialog { width: min(420px, calc(100% - 28px)); max-width: none; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); box-shadow: 0 24px 70px rgba(21,37,29,.28); }
		.confirm-dialog::backdrop { background: rgba(16,29,23,.58); backdrop-filter: blur(3px); }
		.confirm-dialog-body { padding: 22px; }
		.confirm-dialog-heading { display: flex; align-items: flex-start; gap: 13px; }
		.confirm-dialog-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 50%; background: #fff0eb; color: #a85f52; font-size: 20px; }
		.confirm-dialog-heading h2 { margin: 1px 0 5px; font-size: 15px; }
		.confirm-dialog-heading p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
		.confirm-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
		.confirm-dialog-actions .button.danger { border-color: #a85f52; background: #a85f52; color: white; }
		.confirm-dialog-actions .button.danger:hover { border-color: #894b41; background: #894b41; }
		.content { width: min(100%, 1120px); margin: 0 auto; padding: 30px clamp(16px, 4vw, 54px) 64px; }
		.tab-panel[hidden] { display: none; }
		.panel-intro { margin: 0 0 18px; }
		.panel-intro h2 { margin: 4px 0 5px; font-size: 21px; }
		.panel-intro p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
		.journey-panel[hidden] { display: none; }
		.intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; animation: rise .45s ease both; }
		.intro h2 { margin: 4px 0 5px; font-size: clamp(21px, 3vw, 28px); line-height: 1.35; }
		.intro p { margin: 0; color: var(--muted); font-size: 12px; }
		.counter { display: flex; align-items: baseline; gap: 7px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); white-space: nowrap; }
		.counter strong { color: var(--green); font: 700 20px 'DM Sans', sans-serif; }
		.counter span { color: var(--muted); font-size: 11px; }
		.site-settings { margin-bottom: 18px; padding: 19px 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); }
		.site-settings-head { margin-bottom: 15px; }
		.site-settings-head h3 { margin: 0 0 4px; font-size: 13px; }
		.site-settings-head p { margin: 0; color: var(--muted); font-size: 10px; }
		.site-settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 15px; }
		.visible-tabs-setting { grid-column: 1 / -1; padding: 0; margin: 2px 0 0; border: 0; }
		.visible-tabs-setting legend { margin-bottom: 7px; color: #59655e; font-size: 10px; font-weight: 700; }
		.visible-tabs-options { display: flex; flex-wrap: wrap; gap: 8px; }
		.visible-tab-option { position: relative; display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid #dce2da; border-radius: 999px; background: #fbfcfa; color: var(--ink); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .18s ease; }
		.visible-tab-option:has(input:checked) { border-color: var(--green); background: #edf4ee; color: var(--green-deep); box-shadow: inset 0 0 0 1px rgba(49,90,76,.12); }
		.visible-tab-option input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
		.visible-tab-option span { pointer-events: none; }
		.site-setting { display: grid; gap: 5px; min-width: 0; color: #59655e; font-size: 10px; font-weight: 700; }
		.site-setting input { width: 100%; min-width: 0; height: 37px; padding: 0 10px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font-size: 11px; }
		.site-setting textarea { width: 100%; min-width: 0; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }
		.site-setting input:focus, .site-setting textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); background: #fff; }
		.site-setting-image { grid-column: 1 / -1; }
		.catalog-site-settings { display: grid; gap: 12px 15px; grid-template-columns: repeat(2, minmax(0,1fr)); padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
		.catalog-site-settings h3 { grid-column: 1 / -1; margin: 0; font-size: 13px; }
		.catalog-site-settings .site-setting-image textarea { min-height: 0; overflow-wrap: anywhere; word-break: break-all; resize: none; }
		.catalog-site-settings .site-setting-image .image-row { align-items: stretch; }
		.catalog-site-settings .site-setting-image textarea { width: 100%; padding: 10px 11px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }
		.catalog-site-settings .site-setting-image textarea:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); background: #fff; }
		.map-engine-setting { padding: 0; margin: 15px 0 0; border: 0; }
		.map-engine-setting legend { margin-bottom: 7px; color: #59655e; font-size: 10px; font-weight: 700; }
		.map-engine-options { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
		.map-engine-option { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 7px 10px; border: 1px solid #dce2da; border-radius: 6px; background: #fbfcfa; color: var(--ink); cursor: pointer; }
		.map-engine-option:has(input:checked) { border-color: var(--green); background: #eef4ed; box-shadow: inset 0 0 0 1px var(--green); }
		.map-engine-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
		.map-engine-option i { color: var(--green); font-size: 17px; }
		.map-engine-option span { font-size: 10px; font-weight: 600; }
		.theme-setting { padding: 0; margin: 15px 0 0; border: 0; }
		.theme-setting legend { margin-bottom: 7px; color: #59655e; font-size: 10px; font-weight: 700; }
		.theme-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
		.theme-option { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; min-height: 56px; padding: 10px; border: 1px solid #dce2da; border-radius: 6px; background: #fbfcfa; color: var(--ink); cursor: pointer; transition: all .18s; }
		.theme-option:hover { background: #f2f6f1; border-color: #bccbc1; }
		.theme-option:has(input:checked) { border-color: var(--green); background: #eef4ed; box-shadow: inset 0 0 0 1px var(--green); }
		.theme-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
		.theme-palette-preview { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
		.theme-dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
		.theme-info { min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
		.theme-info strong { font-size: 10px; font-weight: 700; color: var(--ink); }
		.theme-current-colors { margin-top: 10px; border: 1px solid #dce2da; border-radius: 6px; background: #fafbf9; overflow: hidden; }
		.theme-custom-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; align-items: end; background: #fff; }
		.theme-color-field { display: flex; flex-direction: column; gap: 4px; }
		.theme-color-field label { font-size: 9px; font-weight: 700; color: #59655e; display: flex; flex-direction: column; gap: 1px; }
		.theme-color-hint { font-size: 8px; font-weight: 400; color: var(--muted); }
		.theme-color-input-wrap { display: flex; align-items: center; gap: 6px; }
		.theme-color-input-wrap input[type="color"] { width: 34px; height: 34px; border: 1px solid #dce2da; border-radius: 5px; padding: 1px; cursor: pointer; background: white; -webkit-appearance: none; appearance: none; }
		.theme-color-input-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
		.theme-color-input-wrap input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }
		.theme-color-input-wrap .hex-input-group { display: flex; align-items: center; width: 72px; height: 34px; border: 1px solid #dce2da; border-radius: 5px; padding: 0 6px; background: #fbfcfa; transition: border .15s, box-shadow .15s; }
		.theme-color-input-wrap .hex-input-group:focus-within { border-color: #719783; box-shadow: 0 0 0 2px rgba(91,139,111,.12); background: #fff; }
		.theme-color-input-wrap .hex-input-group span { color: var(--muted); font-family: 'DM Sans', monospace; font-size: 11px; user-select: none; }
		.theme-color-input-wrap .hex-input-group input[type="text"] { width: 100%; height: 100%; border: none; background: transparent; outline: none; padding: 0; font-family: 'DM Sans', monospace; font-size: 11px; text-transform: uppercase; color: var(--ink); margin-left: 2px; }
		.theme-preview-card { border: 1px solid #dce2da; border-radius: 6px; overflow: hidden; font-size: 10px; box-shadow: 0 2px 5px rgba(0,0,0,.03); }
		.theme-preview-header { padding: 5px 8px; display: flex; align-items: center; gap: 6px; color: white; font-weight: 700; }
		.theme-preview-badge { padding: 1px 5px; border-radius: 3px; font-size: 8px; color: white; font-weight: 700; }
		.theme-preview-title { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.theme-preview-body { padding: 5px 8px; display: flex; align-items: center; gap: 6px; font-size: 9px; }
		.theme-preview-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
		.weather-select-control { display: grid; grid-template-columns: 40px minmax(0,1fr); align-items: center; gap: 8px; }
		.weather-icon-preview { display: grid; width: 40px; height: 39px; place-items: center; border: 1px solid var(--line); border-radius: 5px; background: #edf2ec; color: var(--green); font-size: 21px; }
		.weather-select-control select { width: 100%; min-width: 0; height: 39px; padding: 0 9px; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fbfcfa; color: var(--ink); font: 400 11px 'Noto Sans TC', sans-serif; }
		.weather-select-control select:focus { border-color: #719783; box-shadow: 0 0 0 3px rgba(91,139,111,.12); }
		.source-picker { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
		.source-info { display: grid; gap: 3px; min-width: 0; }
		.source-info strong { font-size: 11px; }
		.source-info span { overflow: hidden; color: var(--muted); font: 11px 'DM Sans', sans-serif; text-overflow: ellipsis; white-space: nowrap; }
		.source-info small { color: var(--muted); font-size: 9px; line-height: 1.5; }
		.source-actions { display: flex; flex: 0 0 auto; flex-wrap: wrap; gap: 7px; }
		.source-picker .button { flex: 0 0 auto; }
		.source-picker input[type="file"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
		.button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
		.editor-card { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); animation: rise .5s .05s ease both; }
		.editor-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 23px; border-bottom: 1px solid var(--line); }
		.editor-head h3 { margin: 0 0 4px; font-size: 14px; }
		.editor-head p { margin: 0; color: var(--muted); font-size: 11px; }
		.move-actions { display: flex; gap: 6px; }
		.editor-body { padding: 22px 23px 27px; }
		.section { padding: 0 0 24px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
		.section:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
		.section-title { display: flex; align-items: center; gap: 9px; margin: 0 0 16px; font-size: 13px; }
		.section-title i { color: var(--coral); font-size: 18px; }
		.section-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; margin-bottom: 14px; list-style: none; cursor: pointer; }
		.section-summary::-webkit-details-marker { display: none; }
		.section-summary .section-title { margin: 0; }
		.section-summary .section-caret { color: var(--muted); font-size: 16px; transition: transform .18s; }
		.section[open] > .section-summary .section-caret { transform: rotate(180deg); }
		.section-body { padding-top: 2px; }
		.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
		.section-heading .section-title { margin: 0; }
		.notes-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
		.clear-notes-button, .restore-notes-button { width: 32px; min-height: 32px; height: 32px; padding: 0; }
		.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 17px; }
		.field { display: grid; gap: 6px; min-width: 0; }
		.field.full { grid-column: 1 / -1; }

		.spot-field input, .spot-field textarea { width: 100%; min-width: 0; border: 1px solid #dce2da; border-radius: 5px; outline: none; background: #fff; color: var(--ink); font: 400 11px/1.6 'Noto Sans TC', sans-serif; }

		.remove-item:hover { background: #fff0eb; }
		.small-button { display: inline-flex; align-items: center; gap: 5px; min-height: 29px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--green); font-size: 10px; font-weight: 700; }
		.small-button:hover { background: #f2f5ee; }

		.button.download-combo { display: inline-flex; align-items: center; min-height: 38px; height: 38px; padding: 0 5px 0 11px; gap: 8px; border-radius: 6px; }

		.toast { position: fixed; z-index: 10; right: 22px; bottom: 22px; padding: 11px 15px; border-radius: 6px; background: var(--green-deep); color: white; font-size: 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s; }

<body>
	<div class="shell">
		<aside class="sidebar">
			<div class="brand">
				<a class="brand-home" href="index.html" aria-label="返回首頁" title="返回首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5h-6v-6h-5v6h-6V10Z"/></svg></a>
				<div><strong>行程管理器</strong><small>TRAVEL PLAN STUDIO</small></div>
			</div>
			<div id="itinerary-nav-panel" class="itinerary-nav-panel">
				<button id="journey-settings-link" class="side-tab journey-settings-link" type="button" aria-current="page" aria-controls="journey-panel-settings"><i class="ph ph-sliders-horizontal"></i><span>行程設置</span></button>

				<nav id="day-list" class="day-list" aria-label="每日行程"></nav>

		</aside>
		
		<button id="sidebar-toggle" class="sidebar-handle" type="button" title="隱藏/顯示側邊欄" aria-label="隱藏/顯示側邊欄" aria-expanded="true" aria-controls="itinerary-nav-panel"><i class="ph ph-caret-left"></i></button>

		<main class="main">
			<header class="topbar">
				<div class="top-heading-group"><div class="top-title"><div class="eyebrow" id="workspace-eyebrow">JOURNEY SETTINGS</div><h1 id="page-title">行程設置</h1></div></div>
				<div class="top-actions">
					<div class="save-state" style="margin-right: 8px;"><span id="state-dot" class="state-dot"></span><span id="state-text">尚未載入資料</span></div>
					<button id="top-save-btn" class="button icon-only primary" type="button" title="儲存更新檔" style="min-height: 34px; width: 34px;"><i class="ph ph-floppy-disk"></i></button>
				</div>
			</header>

			<div class="content">
				<section id="journey-panel-settings" class="journey-panel" aria-labelledby="journey-settings-link">
						<section class="journey-settings" aria-label="行程設置">
							<header class="panel-intro"><div class="eyebrow">JOURNEY SETTINGS</div><h2>行程設置</h2><p>選擇資料來源，並設定此行程在前台顯示的網站標題。</p></header>
							<section class="source-picker" aria-label="選擇行程資料檔" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 7px; background: #fff;">
								<div class="source-info"><strong>資料來源</strong><span id="source-name">尚未選取</span><small id="source-write-status">選取或載入 JS 後即可開始編輯。</small></div>
								<div class="source-actions" style="display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;">
									<input type="text" id="online-source-name" placeholder="線上檔名 (如: 2610)" style="width: 130px; height: 35px; border: 1px solid #dce2da; border-radius: 5px; background: #fbfcfa; outline: none; font-size: 11px; padding: 0 10px; margin-right: 2px;">
									<button id="load-online-source" class="button icon-only" type="button" title="從線上載入"><i class="ph ph-cloud-arrow-down"></i></button>
									<button id="new-source-file" class="button icon-only" type="button" title="建立新行程 JS" aria-label="建立新行程 JS"><i class="ph ph-plus"></i></button>
									<button id="choose-source-file" class="button icon-only" type="button" title="選取本機 JS" aria-label="選取本機 JS"><i class="ph ph-folder-open"></i></button>
									<input id="source-file" type="file" accept=".js,application/javascript,text/javascript">
								</div>
							</section>
							<section id="site-settings" class="site-settings" aria-label="網站標題設定"></section>
							<section id="export-section" class="export">
								<div class="export-head">
									<div><h3>更新檔案預覽</h3><p>可直接儲存或下載取代：<span id="export-target-label">data.js</span></p></div>
									<div class="export-actions">
										<button id="export-top" class="button icon-only" type="button" title="產生更新檔" aria-label="產生更新檔" disabled><i class="ph ph-floppy-disk" aria-hidden="true"></i></button>
										<button id="copy-code" class="button icon-only" type="button" title="複製程式碼" aria-label="複製程式碼" disabled><i class="ph ph-copy" aria-hidden="true"></i></button>
										<button id="download-code" class="button primary download-combo" type="button" title="下載更新檔" aria-label="下載更新檔" disabled>
											<i class="ph ph-download-simple" aria-hidden="true"></i>
											<span id="download-file-label" class="download-combo-tag">data.js</span>
										</button>
									</div>
								</div>
								<textarea id="code-output" class="code-output" readonly spellcheck="false" aria-label="產生的行程資料 JS" placeholder="選取資料檔後產生預覽"></textarea>
							</section>
						</section>
					</section>
				<section id="journey-panel-daily" class="journey-panel" aria-label="每日行程" hidden>
					<section class="intro">
						<div><div class="eyebrow">ITINERARY</div><h2>編輯每日行程</h2><p>選擇日期編輯路線資訊，完成後匯出所選 JS 資料檔。</p></div>
						<div class="counter"><strong id="day-total">0</strong><span>個行程日</span></div>
					</section>
					<section id="editor" class="editor-card" aria-live="polite"></section>

		</main>
	</div>
	<div id="toast" class="toast" role="status"></div>
	<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
		<div class="confirm-dialog-body">
			<div class="confirm-dialog-heading"><span class="confirm-dialog-icon"><i class="ph ph-warning-circle" aria-hidden="true"></i></span><div><h2 id="confirm-dialog-title">確認操作</h2><p id="confirm-dialog-message"></p></div></div>
			<div class="confirm-dialog-actions"><button id="confirm-cancel" class="button" type="button">取消</button><button id="confirm-accept" class="button danger" type="button">確認</button></div>
		</div>
	</dialog>

	<script>
		const editor = document.getElementById('editor');
		const dayList = document.getElementById('day-list');
		const codeOutput = document.getElementById('code-output');
		const stateText = document.getElementById('state-text');
		const stateDot = document.getElementById('state-dot');
		const exportTopBtn = document.getElementById('export-top');
		let itineraryData = [];
		let hasLoadedSource = false;
		let savedFavorite1 = null;
		let savedFavorite2 = null;
		let savedFavorite3 = null;
		try {
			savedFavorite1 = JSON.parse(localStorage.getItem('travelFavoriteTheme1')) || JSON.parse(localStorage.getItem('travelFavoriteTheme'));
			savedFavorite2 = JSON.parse(localStorage.getItem('travelFavoriteTheme2'));
			savedFavorite3 = JSON.parse(localStorage.getItem('travelFavoriteTheme3'));
		} catch (e) {}
		const PRESET_THEMES = {
			forest: { id: 'forest', name: '森林松綠', primary: '#315a4c', deep: '#203d34', accent: '#cf795f', bg: '#eef2ec' },
			ocean:  { id: 'ocean',  name: '蔚藍海島', primary: '#1f648d', deep: '#133d57', accent: '#e6823b', bg: '#edf4f8' },
			sand:   { id: 'sand',   name: '大地暖沙', primary: '#7d5a3c', deep: '#4d3723', accent: '#d97706', bg: '#f7f4ee' },
			kyoto:  { id: 'kyoto',  name: '京都緋紅', primary: '#8c2d2d', deep: '#571a1a', accent: '#52744d', bg: '#f9f3f3' },
			favorite1: savedFavorite1 || { id: 'favorite1', name: '🌟 專屬配色 1', primary: '#3b4b5e', deep: '#1f2937', accent: '#6366f1', bg: '#f1f5f9' },
			favorite2: savedFavorite2 || { id: 'favorite2', name: '🌟 專屬配色 2', primary: '#7c3aed', deep: '#4c1d95', accent: '#ec4899', bg: '#f5f3ff' },
			favorite3: savedFavorite3 || { id: 'favorite3', name: '🌟 專屬配色 3', primary: '#059669', deep: '#064e3b', accent: '#10b981', bg: '#ecfdf5' }
		};

		function hexToRgb(hex) {
			let clean = String(hex || '').replace('#', '');
			if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
			const num = parseInt(clean, 16);
			if (isNaN(num)) return { r: 49, g: 90, b: 76 };
			return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
		}

		function darkenColor(hex, percent = 35) {
			const { r, g, b } = hexToRgb(hex);
			const factor = Math.max(0, 1 - percent / 100);
			const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
			return '#' + [clamp(r * factor), clamp(g * factor), clamp(b * factor)].map(x => x.toString(16).padStart(2, '0')).join('');
		}

		// 計算當前生效的配色組合（若為預設主題則取預設值，若為自訂則取自訂或由主色推算深色）
		function getEffectiveTheme(settings) {
			const themeKey = settings?.theme || 'forest';
			if (themeKey !== 'custom' && PRESET_THEMES[themeKey]) {
				return { ...PRESET_THEMES[themeKey] };
			}
			const custom = settings?.customTheme || settings?.themeColors || {};
			const primary = custom.primary || PRESET_THEMES.forest.primary;
			const accent = custom.accent || PRESET_THEMES.forest.accent;
			const bg = custom.bg || PRESET_THEMES.forest.bg;
			return {
				id: 'custom',
				name: '自訂配色',
				desc: '自選色彩組合',
				primary,
				deep: custom.deep || darkenColor(primary, 35),
				accent,
				bg
			};
		}

		const siteSettingsDefaults = {
			pageTitle: '土耳其傳奇 11 日',
			heroTitle: '星月傳奇．土耳其11日',
			dateText: '2026/10/8(四) ~ 2026/10/18(日)',
			subtitle: '跟團行程 · 11 天 · 2026 秋季',
			heroImage: 'https://images.unsplash.com/photo-1549740425-5e9ed4d8cd34?q=80&w=1800&auto=format&fit=crop',
			mapEngine: 'google',
			visibleTabs: ['overview', 'itinerary'],
			theme: 'forest',
			customTheme: {
				primary: '#315a4c',
				accent: '#cf795f',
				bg: '#eef2ec'
			}
		};
		let siteSettingsDraft = {
			...siteSettingsDefaults,
			...(typeof siteSettings === 'undefined' ? {} : siteSettings),
			customTheme: {
				...siteSettingsDefaults.customTheme,
				...(typeof siteSettings !== 'undefined' && siteSettings?.customTheme ? siteSettings.customTheme : {})
			}
		};
		const visibleTabIds = ['overview', 'itinerary', 'expenses', 'todo'];
		function normalizeVisibleTabs() {
			const validTabs = Array.isArray(siteSettingsDraft.visibleTabs) ? siteSettingsDraft.visibleTabs.filter((tab) => visibleTabIds.includes(tab)) : [];
			siteSettingsDraft.visibleTabs = validTabs.length ? [...new Set(validTabs)] : [...siteSettingsDefaults.visibleTabs];
		}
		normalizeVisibleTabs();
		let exportFileName = 'data.js';
		let useFallbackSourcePicker = false;
		let selectedDay = 0;
		let hasChanges = false;
		let toastTimer;
		let pendingConfirmAction = null;
		const editorSectionState = new Map();
		const travelNoteFields = ['outfit', 'buy', 'eat', 'meals', 'lodging', 'tips'];
		const clearedNotesSnapshots = new WeakMap();

		function isEditorSectionOpen(sectionId) {
			return editorSectionState.get(`${selectedDay}:${sectionId}`) ?? sectionId === 'day';
		}

		function escapeHtml(value) {
			return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
		}

		function showToast(message) {
			const toast = document.getElementById('toast');
			toast.textContent = message;
			toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
		}

		function openConfirmDialog(title, message, actionLabel, action) {
			const dialog = document.getElementById('confirm-dialog');
			document.getElementById('confirm-dialog-title').textContent = title;
			document.getElementById('confirm-dialog-message').textContent = message;
			document.getElementById('confirm-accept').textContent = actionLabel;
			pendingConfirmAction = action;
			dialog.showModal();
			document.getElementById('confirm-cancel').focus();
		}

		const confirmDialog = document.getElementById('confirm-dialog');
		document.getElementById('confirm-cancel').addEventListener('click', () => {
			pendingConfirmAction = null;
			confirmDialog.close();
		});

		function parseSourceFile(source) {
			const itineraryMatch = source.match(/\bconst\s+itineraryData\s*=\s*([\s\S]*);\s*$/);
			if (!itineraryMatch) throw new Error('找不到 const itineraryData 資料。');
			const itinerary = JSON.parse(itineraryMatch[1]);
			if (!Array.isArray(itinerary)) throw new Error('itineraryData 必須是陣列。');
			const settingsMatch = source.match(/\bconst\s+siteSettings\s*=\s*([\s\S]*?);\s*(?=const\s+itineraryData\b)/);
			const settings = settingsMatch ? JSON.parse(settingsMatch[1]) : {};
			return { itinerary, settings };
		}

		function migrateLegacyStayFields(itinerary) {
			for (const day of itinerary) {
				const mealParts = [];
				const lodgingParts = [];
				for (const part of String(day.stay || '').split(/\s*\/\s*/)) {
					const value = part.trim();
					if (!value) continue;
					if (/^宿\s*[：:]/.test(value)) lodgingParts.push(value.replace(/^宿\s*[：:]\s*/, ''));
					else mealParts.push(value);
				}
				if (!String(day.meals || '').trim()) day.meals = mealParts.join(' / ');
				if (!String(day.lodging || '').trim()) day.lodging = lodgingParts.join(' / ');
				delete day.stay;

				const mapQueries = Array.isArray(day.spotMapQueries) ? day.spotMapQueries : [];
				const images = Array.isArray(day.spotImages) ? day.spotImages : [];
				const notes = Array.isArray(day.spotNotes) ? day.spotNotes : [];
				day.spots = (Array.isArray(day.spots) ? day.spots : []).map((spot, index) => {
					const parsedSpot = spot && typeof spot === 'object' ? spot : parseSpot(spot);
					const name = String(parsedSpot.name ?? '');
					return {
						name,
						description: String(parsedSpot.description ?? ''),
						mapQuery: String(parsedSpot.mapQuery ?? mapQueries[index] ?? (name ? `${name} 土耳其` : '')),
						image: String(parsedSpot.image ?? images[index] ?? ''),
						note: String(parsedSpot.note ?? notes[index] ?? '')
					};
				});
				delete day.spotMapQueries;
				delete day.spotImages;
				delete day.spotNotes;
			}
		}

		async function loadSourceFile(file) {
			if (hasChanges && !window.confirm('目前有尚未匯出的修改。切換資料來源會捨棄這些修改，確定繼續嗎？')) return;
			try {
				const source = await file.text();
				const { itinerary, settings } = parseSourceFile(source);
				migrateLegacyStayFields(itinerary);
				itineraryData.splice(0, itineraryData.length, ...itinerary);
				hasLoadedSource = true;
				// 合併現有或載入的配色設定（優先讀取 themeColors）
				const loadedColors = settings.themeColors || settings.customTheme || {};
				siteSettingsDraft = {
					...siteSettingsDefaults,
					...settings,
					customTheme: {
						...siteSettingsDefaults.customTheme,
						...loadedColors
					}
				};
				normalizeVisibleTabs();
				exportFileName = file.name;
				document.getElementById('source-name').textContent = file.name;
				document.getElementById('source-write-status').textContent = '已載入資料；編輯後可產生更新檔下載取代原檔。';
				document.getElementById('export-target-label').textContent = file.name;
				document.getElementById('download-file-label').textContent = file.name;
				document.getElementById('add-day').disabled = false;
				document.getElementById('export-top').disabled = false;
				document.getElementById('copy-code').disabled = false;
				const dlBtn = document.getElementById('download-code');
				dlBtn.disabled = false;
				dlBtn.title = `下載 ${file.name}`;
				dlBtn.setAttribute('aria-label', `下載 ${file.name}`);
				codeOutput.value = '';
				hasChanges = false;
				stateText.textContent = `已載入 ${file.name}`;
				stateDot.classList.remove('dirty');
				exportTopBtn?.classList.remove('needs-update');
				renderSiteSettings();
				renderEditor();
				updateWorkspaceTitle();
				showToast(`已載入 ${file.name}`);
			} catch (error) {
				showToast(`無法讀取此檔案：${error.message}`);
			}
		}

		async function chooseSourceFile() {
			const fileInput = document.getElementById('source-file');
			if (useFallbackSourcePicker || !window.showOpenFilePicker) {
				useFallbackSourcePicker = true;
				document.getElementById('source-write-status').textContent = '此瀏覽器只能讀取選取的檔案；編輯後請下載更新檔取代原檔。';
				fileInput.click();
				return;
			}
			try {
				const [fileHandle] = await window.showOpenFilePicker({
					types: [{ description: 'JavaScript 檔案', accept: { 'text/javascript': ['.js'] } }],
					multiple: false
				});
				const file = await fileHandle.getFile();
				await loadSourceFile(file);
			} catch (error) {
				if (error.name === 'AbortError') return;
				useFallbackSourcePicker = true;
				document.getElementById('source-write-status').textContent = '瀏覽器限制檔案存取；請重新選取檔案，編輯後下載更新檔取代原檔。';
				showToast('無法直接讀取檔案，改用一般選檔；更新後請下載檔案。');
				fileInput.click();
			}
		}

		async function createNewSourceFile() {
			if (hasChanges && !window.confirm('目前有尚未儲存的修改。建立新檔會捨棄這些修改，確定繼續嗎？')) return;
			const fileName = 'new.js';
			const newItinerary = [];
			const newSettings = {
				...siteSettingsDefaults,
				pageTitle: '',
				heroTitle: '',
				dateText: '',
				subtitle: '',
				heroImage: '',
				visibleTabs: [...siteSettingsDefaults.visibleTabs],
				customTheme: { ...siteSettingsDefaults.customTheme }
			};
			const source = serializeSource(newSettings, newItinerary);
			let fileHandle = null;
			let writable;
			if (window.showSaveFilePicker && !useFallbackSourcePicker) {
				try {
					fileHandle = await window.showSaveFilePicker({
						suggestedName: fileName,
						types: [{ description: 'JavaScript 檔案', accept: { 'text/javascript': ['.js'] } }]
					});
					writable = await fileHandle.createWritable();
					await writable.write(source);
					await writable.close();
				} catch (error) {
					if (writable) {
						try { await writable.abort(); } catch {}
					}
					if (error.name === 'AbortError') return;
					fileHandle = null;
					useFallbackSourcePicker = true;
					showToast('無法建立新檔，將下載新 JS 草稿。');
				}
			} else {
				useFallbackSourcePicker = true;
			}
			if (!fileHandle) {
				const blob = new Blob([source], { type: 'text/javascript;charset=utf-8' });
				const url = URL.createObjectURL(blob);
				const downloadLink = document.createElement('a');
				downloadLink.href = url;
				downloadLink.download = fileName;
				downloadLink.click();
				URL.revokeObjectURL(url);
			}
			hasChanges = false;
			stateDot.classList.remove('dirty');
			await loadSourceFile(new File([source], fileHandle?.name || fileName, { type: 'text/javascript' }));
			document.getElementById('source-write-status').textContent = fileHandle ? '已建立新 JS；編輯後可產生更新檔下載。' : '新 JS 草稿已下載；編輯後可再次下載更新檔。';
			showToast(fileHandle ? '已建立新行程 JS' : '已下載新行程 JS 草稿');
		}

		function parseSpot(spot) {
			const value = String(spot ?? '');
			const separatorIndex = value.indexOf(' ｜ ');
			if (separatorIndex < 0) return { name: value, description: '' };
			return { name: value.slice(0, separatorIndex), description: value.slice(separatorIndex + 3) };
		}

		function updatePath(path, value) {
			const parts = path.split('.');
			let target = itineraryData[selectedDay];
			for (const part of parts.slice(0, -1)) {
				if (!target[part] || typeof target[part] !== 'object') target[part] = {};
				target = target[part];
			}
			target[parts[parts.length - 1]] = value;
		}

		function createEmptyDay(dayNumber) {
			return {
				day: `Day ${dayNumber}`, fullDate: '', title: '', weather: { icon: 'ph-sun', temp: '' }, image: '',
				flights: [], spots: [], specialNotes: [], outfit: '', buy: '', eat: '', meals: '', lodging: '', tips: ''
			};
		}

		function addDay() {
			const lastDayLabel = itineraryData[itineraryData.length - 1]?.day || '';
			const lastRange = lastDayLabel.match(/(\d+)(?:\s*-\s*(\d+))?/);
			const nextNumber = lastRange ? Number(lastRange[2] || lastRange[1]) + 1 : itineraryData.length + 1;
			itineraryData.push(createEmptyDay(nextNumber));
			selectedDay = itineraryData.length - 1;
			markChanged();
			activateJourneyPanel('journey-panel-daily');
			renderEditor();
			showToast('已新增行程日');
		}

		dayList.addEventListener('click', (event) => {
			const button = event.target.closest('[data-select]');
			if (!button) return;
			activateJourneyPanel('journey-panel-daily');
			selectedDay = Number(button.dataset.select);
			renderEditor();
			updateWorkspaceTitle();
		});
		editor.addEventListener('toggle', (event) => {
			if (!event.target.matches('details[data-editor-section]')) return;
			editorSectionState.set(`${selectedDay}:${event.target.dataset.editorSection}`, event.target.open);
		}, true);

		editor.addEventListener('input', (event) => {
			const target = event.target;
			if (travelNoteFields.includes(target.dataset.path)) {
				clearedNotesSnapshots.delete(itineraryData[selectedDay]);
				editor.querySelector('[data-restore-travel-notes]').disabled = true;
			}
			if (target.dataset.path) updatePath(target.dataset.path, target.value);
			if (target.id === 'weather-icon-select') editor.querySelector('#weather-icon-preview').className = `ph ${target.value}`;
			if (target.dataset.spotField) {
				const day = itineraryData[selectedDay];
				const index = Number(target.dataset.spotIndex);
				const spot = day.spots[index];
				spot[target.dataset.spotField] = target.value;
				if (target.dataset.spotField === 'image') {
					const preview = target.parentElement.querySelector('.spot-image-preview');
					if (target.value) {
						preview.src = target.value;
						preview.hidden = false;
					} else {
						preview.removeAttribute('src');
						preview.hidden = true;
					}
				} else if (target.dataset.spotField === 'name' && !spot.mapQuery) {
					spot.mapQuery = target.value ? `${target.value} 土耳其` : '';
					target.closest('.spot-item').querySelector('[data-spot-field="mapQuery"]').value = spot.mapQuery;
				}
			}
			if (target.dataset.list) itineraryData[selectedDay][target.dataset.list][Number(target.dataset.index)] = target.value;
			if (target.id === 'field-image') {
				const preview = editor.querySelector('.image-preview');
				preview.innerHTML = target.value ? `<img src="${escapeHtml(target.value)}" alt="行程圖片預覽" onerror="this.style.display='none'">` : '';
			}
			markChanged();
			const titleInput = editor.querySelector('[data-path="title"]');
			const dayInput = editor.querySelector('[data-path="day"]');
			if (titleInput || dayInput) {
				document.getElementById('page-title').textContent = `${dayInput?.value || '行程'}｜${titleInput?.value || '未命名行程'}`;
				const activeLabel = dayList.querySelector('.day-link.active .day-label');
				if (activeLabel) activeLabel.textContent = `${dayInput?.value || 'Day'} · ${titleInput?.value || '未命名行程'}`;
			}
		});

		editor.addEventListener('change', (event) => {
			if (event.target.id === 'day-date-picker') {
				const dateVal = event.target.value;
				if (dateVal) {
					const d = new Date(dateVal);
					if (!isNaN(d)) {
						const days = ['日', '一', '二', '三', '四', '五', '六'];
						const formatted = `${dateVal.replace(/-/g, '/')}(${days[d.getDay()]})`;
						const input = document.getElementById('field-fullDate');
						if (input) {
							input.value = formatted;
							input.dispatchEvent(new Event('input', { bubbles: true }));
						}
					}
				}
			}
		});

		editor.addEventListener('click', (event) => {
			const toggleNoteBtn = event.target.closest('[data-toggle-note]');
			if (toggleNoteBtn) {
				const key = toggleNoteBtn.dataset.toggleNote;
				toggleNoteBtn.style.display = 'none';
				const container = editor.querySelector(`.note-input-container[data-note-key="${key}"]`);
				if (container) {
					container.style.display = 'block';
					const textarea = container.querySelector('textarea');
					if (textarea) textarea.focus();
				}
				return;
			}
			const clearNotesButton = event.target.closest('[data-clear-travel-notes]');
			if (clearNotesButton) {
				event.preventDefault();
				event.stopPropagation();
				const day = itineraryData[selectedDay];
				if (!travelNoteFields.some((field) => String(day[field] || '').trim())) return showToast('旅遊備註已經是空白');
				clearedNotesSnapshots.set(day, Object.fromEntries(travelNoteFields.map((field) => [field, day[field]])));
				travelNoteFields.forEach((field) => { day[field] = ''; });
				markChanged();
				renderEditor();
				showToast('已清空旅遊備註，可按恢復還原');
				return;
			}
			const restoreNotesButton = event.target.closest('[data-restore-travel-notes]');
			if (restoreNotesButton) {
				event.preventDefault();
				event.stopPropagation();
				const day = itineraryData[selectedDay];
				const snapshot = clearedNotesSnapshots.get(day);
				if (!snapshot) return;
				travelNoteFields.forEach((field) => { day[field] = snapshot[field]; });
				clearedNotesSnapshots.delete(day);
				markChanged();
				renderEditor();
				showToast('已恢復清空前的旅遊備註');
				return;
			}
			const addButton = event.target.closest('[data-add-item]');
			const removeButton = event.target.closest('[data-remove-item]');
			const removeSpotButton = event.target.closest('[data-remove-spot]');
			const moveButton = event.target.closest('[data-move]');
			if (addButton) {
				event.preventDefault();
				event.stopPropagation();
				const key = addButton.dataset.addItem;
				if (!Array.isArray(itineraryData[selectedDay][key])) itineraryData[selectedDay][key] = [];
				itineraryData[selectedDay][key].push(key === 'spots' ? { name: '', description: '', mapQuery: '', image: '', note: '' } : '');
				markChanged();
				renderEditor();
				const fields = key === 'spots' ? editor.querySelectorAll('[data-spot-field="name"]') : editor.querySelectorAll(`[data-list="${key}"]`);
				fields[fields.length - 1]?.focus();
				return;
			}
			if (removeSpotButton) {
				const index = Number(removeSpotButton.dataset.removeSpot);
				itineraryData[selectedDay].spots.splice(index, 1);
				markChanged();
				renderEditor();
				return;
			}
			if (removeButton) {
				itineraryData[selectedDay][removeButton.dataset.removeItem].splice(Number(removeButton.dataset.index), 1);
				markChanged();
				renderEditor();
				return;
			}
			if (moveButton) {
				const nextIndex = selectedDay + Number(moveButton.dataset.move);
				[itineraryData[selectedDay], itineraryData[nextIndex]] = [itineraryData[nextIndex], itineraryData[selectedDay]];
				selectedDay = nextIndex;
				markChanged();
				renderEditor();
				return;
			}
			if (event.target.closest('[data-delete-day]')) {
				if (itineraryData.length === 1) return showToast('至少保留一天行程');
				const dayLabel = getDayLabel(selectedDay);
				openConfirmDialog('刪除行程日', `確定刪除「${dayLabel}」嗎？刪除後需重新匯入原始檔才能還原。`, '刪除', () => {
					itineraryData.splice(selectedDay, 1);
					selectedDay = Math.min(selectedDay, itineraryData.length - 1);
					markChanged();
					renderEditor();
					showToast('已刪除行程日');
				});
			}
		});

		// 序列化行程與設定資料為 JS 原始碼，將配色解析為前台直接套用的 themeColors 物件
		function serializeSource(settings, itinerary) {
			const effectiveTheme = getEffectiveTheme(settings);
			let exportThemeKey = settings.theme || 'forest';
			if (exportThemeKey.startsWith('favorite')) exportThemeKey = 'custom';
			
			const exportSettings = {
				...settings,
				theme: exportThemeKey,
				themeColors: {
					primary: effectiveTheme.primary,
					deep: effectiveTheme.deep,
					accent: effectiveTheme.accent,
					bg: effectiveTheme.bg
				}
			};
			return `const siteSettings = ${JSON.stringify(exportSettings, null, 4)};\n\nconst itineraryData = ${JSON.stringify(itinerary, null, 4)};\n`;
		}

		function buildExportSource() {
			return serializeSource(siteSettingsDraft, itineraryData);
		}

		function makeExport() {
			if (activeJourneyPanel !== 'journey-panel-settings') activateJourneyPanel('journey-panel-settings');
			codeOutput.value = buildExportSource();
			document.getElementById('export-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
			exportTopBtn?.classList.remove('needs-update');
			stateText.textContent = hasChanges ? '已產生最新內容，請下載或複製' : '更新檔已產生';
			showToast(hasChanges ? '更新檔已產生，請下載或複製' : '更新檔已產生');
		}

		function markExported() {
			hasChanges = false;
			exportTopBtn?.classList.remove('needs-update');
			stateText.textContent = '已下載或複製最新檔案';
			stateDot.classList.remove('dirty');
		}

		const shell = document.querySelector('.shell');
		const sidebarToggle = document.getElementById('sidebar-toggle');
		const journeyPanels = [...document.querySelectorAll('.journey-panel')];
		const journeySettingsLink = document.getElementById('journey-settings-link');
		let activeJourneyPanel = 'journey-panel-settings';
		function updateWorkspaceTitle() {
			if (activeJourneyPanel === 'journey-panel-settings') {
				document.getElementById('workspace-eyebrow').textContent = 'JOURNEY SETTINGS';
				document.getElementById('page-title').textContent = '行程設置';
				return;
			}
			const day = itineraryData[selectedDay];
			document.getElementById('workspace-eyebrow').textContent = 'TRAVEL PLAN';
			document.getElementById('page-title').textContent = `${day?.day || '旅遊行程'}｜${day?.title || '行程總覽'}`;
		}

		function activateJourneyPanel(panelId) {
			activeJourneyPanel = panelId;
			journeySettingsLink.setAttribute('aria-current', String(panelId === 'journey-panel-settings' ? 'page' : 'false'));
			journeyPanels.forEach((panel) => { panel.hidden = panel.id !== activeJourneyPanel; });
			renderSidebar();
			updateWorkspaceTitle();
		}

		journeySettingsLink.addEventListener('click', () => activateJourneyPanel('journey-panel-settings'));
		function setSidebarCollapsed(collapsed) {
			shell.classList.toggle('sidebar-collapsed', collapsed);
			sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
			sidebarToggle.title = collapsed ? '顯示側邊欄' : '隱藏側邊欄';
			sidebarToggle.setAttribute('aria-label', sidebarToggle.title);
		}
		sidebarToggle.addEventListener('click', () => setSidebarCollapsed(!shell.classList.contains('sidebar-collapsed')));
		function updateThemePreviewUi() {
			const currentTheme = getEffectiveTheme(siteSettingsDraft);
			const previewCard = document.getElementById('theme-preview-card');
			if (previewCard) {
				previewCard.style.background = currentTheme.bg;
				previewCard.style.borderColor = currentTheme.primary + '40';
				const header = previewCard.querySelector('#theme-preview-header');
				if (header) header.style.background = currentTheme.primary;
				const badge = previewCard.querySelector('#theme-preview-badge');
				if (badge) badge.style.background = currentTheme.accent;
				const dot = previewCard.querySelector('#theme-preview-dot');
				if (dot) dot.style.background = currentTheme.accent;
			}
			const customPrimaryDot = document.querySelector('.theme-custom-dot-primary');
			if (customPrimaryDot) customPrimaryDot.style.background = currentTheme.primary;
			const customAccentDot = document.querySelector('.theme-custom-dot-accent');
			if (customAccentDot) customAccentDot.style.background = currentTheme.accent;
			const customBgDot = document.querySelector('.theme-custom-dot-bg');
			if (customBgDot) customBgDot.style.background = currentTheme.bg;
		}

		function syncCustomThemeInputs(primary, accent, bg) {
			const fields = { primary, accent, bg };
			for (const [key, val] of Object.entries(fields)) {
				const colorInput = document.querySelector(`[data-theme-color="${key}"]`);
				if (colorInput) colorInput.value = val;
				const hexInput = document.querySelector(`[data-theme-hex="${key}"]`);
				if (hexInput) hexInput.value = val.replace(/#/g, '').toUpperCase();
			}
		}

		function handleThemeSettingEvent(event) {
			const themePreset = event.target.dataset.themePreset;
			if (themePreset) {
				if (themePreset === 'custom') {
					siteSettingsDraft.theme = 'custom';
				} else {
					siteSettingsDraft.theme = themePreset;
					const preset = PRESET_THEMES[themePreset];
					if (preset) {
						siteSettingsDraft.customTheme = {
							primary: preset.primary,
							accent: preset.accent,
							bg: preset.bg
						};
						syncCustomThemeInputs(preset.primary, preset.accent, preset.bg);
					}
				}
				updateThemePreviewUi();
				markChanged();
				return true;
			}

			const themeColor = event.target.dataset.themeColor;
			if (themeColor) {
				const val = event.target.value;
				const hexInput = document.querySelector(`[data-theme-hex="${themeColor}"]`);
				if (hexInput) hexInput.value = val.toUpperCase().replace(/#/g, '');
				if (!siteSettingsDraft.customTheme) siteSettingsDraft.customTheme = {};
				siteSettingsDraft.customTheme[themeColor] = val;
				siteSettingsDraft.theme = 'custom';
				const customRadio = document.querySelector('[data-theme-preset="custom"]');
				if (customRadio) customRadio.checked = true;
				updateThemePreviewUi();
				markChanged();
				return true;
			}

			const themeHex = event.target.dataset.themeHex;
			if (themeHex) {
				let val = event.target.value.trim().replace(/#/g, '');
				if (/^[0-9a-fA-F]{6}$/.test(val)) {
					const hexVal = '#' + val;
					const colorInput = document.querySelector(`[data-theme-color="${themeHex}"]`);
					if (colorInput) colorInput.value = hexVal;
					if (!siteSettingsDraft.customTheme) siteSettingsDraft.customTheme = {};
					siteSettingsDraft.customTheme[themeHex] = hexVal;
					siteSettingsDraft.theme = 'custom';
					const customRadio = document.querySelector('[data-theme-preset="custom"]');
					if (customRadio) customRadio.checked = true;
					updateThemePreviewUi();
					markChanged();
				}
				return true;
			}
			return false;
		}

		const siteSettingsContainer = document.getElementById('site-settings');
		siteSettingsContainer.addEventListener('input', (event) => {
			if (handleThemeSettingEvent(event)) return;
			const visibleTab = event.target.dataset.visibleTab;
			if (visibleTab) {
				const selectedTabs = new Set(siteSettingsDraft.visibleTabs);
				if (event.target.checked) selectedTabs.add(visibleTab);
				else selectedTabs.delete(visibleTab);
				if (selectedTabs.size === 0) {
					event.target.checked = true;
					return showToast('至少保留一個前台頁籤');
				}
				siteSettingsDraft.visibleTabs = [...selectedTabs];
				markChanged();
				return;
			}
			const typoKey = event.target.dataset.typo;
			if (typoKey) {
				const [level, device] = typoKey.split('.');
				if (!siteSettingsDraft.typography) {
					siteSettingsDraft.typography = {
						hero: { desktop: 38, mobile: 30 },
						heading: { desktop: 22, mobile: 18 },
						body: { desktop: 16, mobile: 15 },
						small: { desktop: 14, mobile: 12 }
					};
				}
				siteSettingsDraft.typography[level][device] = Number(event.target.value) || 16;
				markChanged();
				return;
			}
			const key = event.target.dataset.siteSetting;
			if (!key) return;
			siteSettingsDraft[key] = event.target.value;
			if (key === 'heroImage') {
				const imageUrl = /^https?:\/\//i.test(event.target.value.trim()) ? escapeHtml(event.target.value.trim()) : '';
				const preview = event.target.parentElement.querySelector('.image-preview');
				preview.innerHTML = imageUrl ? `<img src="${imageUrl}" alt="標題背景圖預覽" onerror="this.style.display='none'">` : '';
			}
			markChanged();
		});

		siteSettingsContainer.addEventListener('click', (event) => {
			const saveBtn1 = event.target.closest('#save-favorite1-btn');
			const saveBtn2 = event.target.closest('#save-favorite2-btn');
			const saveBtn3 = event.target.closest('#save-favorite3-btn');
			if (saveBtn1 || saveBtn2 || saveBtn3) {
				let favIndex = 1;
				if (saveBtn2) favIndex = 2;
				if (saveBtn3) favIndex = 3;
				const current = getEffectiveTheme(siteSettingsDraft);
				const favId = 'favorite' + favIndex;
				const favTheme = {
					id: favId,
					name: '🌟 專屬配色 ' + favIndex,
					primary: current.primary,
					deep: current.deep,
					accent: current.accent,
					bg: current.bg
				};
				localStorage.setItem('travelFavoriteTheme' + favIndex, JSON.stringify(favTheme));
				PRESET_THEMES[favId] = favTheme;
				siteSettingsDraft.theme = favId;
				markChanged();
				renderSiteSettings();
				showToast(`已記憶為您的${favTheme.name}！`);
			}
		});

		siteSettingsContainer.addEventListener('change', (event) => {
			handleThemeSettingEvent(event);
			const themeHex = event.target.dataset.themeHex;
			if (themeHex) {
				let val = event.target.value.trim().replace(/#/g, '');
				if (!/^[0-9a-fA-F]{6}$/.test(val)) {
					const cur = siteSettingsDraft.customTheme?.[themeHex] || '#315a4c';
					event.target.value = cur.replace(/#/g, '').toUpperCase();
				}
			}
			if (event.target.id === 'date-picker-start' || event.target.id === 'date-picker-end') {
				const start = document.getElementById('date-picker-start').value;
				const end = document.getElementById('date-picker-end').value;
				const days = ['日', '一', '二', '三', '四', '五', '六'];
				let text = '';
				if (start) {
					const sd = new Date(start);
					if (!isNaN(sd)) text += `${start.replace(/-/g, '/')}(${days[sd.getDay()]})`;
				}
				if (end) {
					const ed = new Date(end);
					if (!isNaN(ed)) text += (text ? ' ~ ' : '') + `${end.replace(/-/g, '/')}(${days[ed.getDay()]})`;
				}
				const dateInput = document.getElementById('date-text-input');
				if (dateInput) {
					dateInput.value = text;
					siteSettingsDraft.dateText = text;
					markChanged();
				}
			}
		});
		document.getElementById('add-day').addEventListener('click', addDay);
		document.getElementById('new-source-file').addEventListener('click', createNewSourceFile);
		document.getElementById('choose-source-file').addEventListener('click', chooseSourceFile);
		document.getElementById('source-file').addEventListener('change', (event) => {
			const file = event.target.files?.[0];
			if (file) loadSourceFile(file);
			event.target.value = '';
		});
		document.getElementById('load-online-source').addEventListener('click', async () => {
			if (hasChanges && !window.confirm('目前有尚未儲存的修改。載入新檔會捨棄這些修改，確定繼續嗎？')) return;
			let name = document.getElementById('online-source-name').value.trim();
			if (!name) return showToast('請先輸入檔名');
			if (!name.endsWith('.js')) name += '.js';
			try {
				showToast(`正在嘗試載入 ${name}...`);
				const response = await fetch(`./WebPage/${name}`);
				if (!response.ok) throw new Error(`找不到檔案或無權限讀取 (HTTP ${response.status})`);
				const text = await response.text();
				const file = new File([text], name, { type: 'text/javascript' });
				await loadSourceFile(file);
			} catch (error) {
				if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
					showToast('瀏覽器安全限制：直接點擊開啟 HTML 時無法使用雲端載入。請改用旁邊的「資料夾」圖示選取檔案，或使用 Live Server 開啟網頁。');
				} else {
					showToast(`載入失敗：${error.message}`);
				}
			}
		});
		document.getElementById('export-top').addEventListener('click', makeExport);
		document.getElementById('copy-code').addEventListener('click', async () => {
			// 若有未匯出的修改或預覽為空，自動先打包最新資料
			if (hasChanges || !codeOutput.value) makeExport();
			try {
				await navigator.clipboard.writeText(codeOutput.value);
			} catch {
				codeOutput.focus();
				codeOutput.select();
				document.execCommand('copy');
				codeOutput.setSelectionRange(0, 0);
			}
			markExported();
			showToast(`${exportFileName} 已複製`);
		});
		document.getElementById('download-code').addEventListener('click', () => {
			// 若有未匯出的修改或預覽為空，自動先打包最新資料
			if (hasChanges || !codeOutput.value) makeExport();
			const file = new Blob([codeOutput.value], { type: 'text/javascript;charset=utf-8' });
			const url = URL.createObjectURL(file);
			const link = document.createElement('a');
			link.href = url;
			link.download = exportFileName;
			link.click();
			URL.revokeObjectURL(url);
			markExported();
			showToast(`已下載 ${exportFileName}`);
		});
		document.getElementById('top-save-btn')?.addEventListener('click', () => {
			if (!itineraryData || !itineraryData.length) return showToast('尚未載入任何行程資料');
			document.getElementById('download-code').click();
		});

		window.addEventListener('beforeunload', (event) => {
			if (!hasChanges) return;
			event.preventDefault();
			event.returnValue = '';
		});

		if (hasLoadedSource) {
			renderSiteSettings();
			renderEditor();
		} else {
			renderSidebar();
			document.getElementById('site-settings').innerHTML = '<div class="empty">請先選取本機 JS 資料檔，載入後即可編輯行程與網站設定。</div>';
			editor.innerHTML = '<div class="empty">尚未載入行程資料。請先在「行程設置」選取本機 JS 檔。</div>';
		}
		activateJourneyPanel(activeJourneyPanel);
	</script>
</body>
</html>
