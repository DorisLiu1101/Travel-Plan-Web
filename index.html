<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>土耳其傳奇旅行</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #0f172a; }
        .glass-panel { background: rgba(13, 31, 35, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .text-shadow { text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    </style>
</head>
<body class="text-gray-100 antialiased min-h-screen">
    <div id="app" class="max-w-md mx-auto relative w-full h-screen overflow-y-scroll snap-y snap-mandatory hide-scrollbar bg-black">
        
        <!-- 卡片迴圈，滿版 9:16 -->
        <div v-for="(day, index) in itineraryData" :key="index" class="relative w-full h-[100dvh] snap-center bg-cover bg-center flex flex-col justify-between" :style="{ backgroundImage: 'url(' + day.bgImage + ')' }">
            
            <!-- 上方標題區 (深綠漸層) -->
            <div class="w-full bg-gradient-to-b from-[#112324]/90 to-transparent px-5 pt-8 pb-12 flex justify-between items-start shrink-0">
                <div class="flex flex-col min-w-0 pr-4">
                    <span class="text-sm font-bold tracking-wider opacity-90 mb-1 text-shadow">{{ day.date }} ｜ {{ day.day }}</span>
                    <h1 class="text-2xl font-black tracking-wide truncate text-shadow">{{ day.title }}</h1>
                </div>
                <!-- 天氣區塊 -->
                <div class="flex flex-col items-center justify-center shrink-0">
                    <svg class="w-8 h-8 text-white opacity-90 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span class="text-sm font-bold mt-1 text-shadow">{{ day.temp }}</span>
                </div>
            </div>

            <!-- 下半部資訊區 -->
            <div class="w-full flex flex-col shrink-0 mt-auto">
                
                <!-- 網格照片區塊 (無文字) -->
                <div class="w-full px-4 mb-3" v-if="day.gridImages && day.gridImages.length">
                    <div class="grid grid-cols-3 gap-2">
                        <div v-for="(img, idx) in day.gridImages" :key="idx" class="aspect-[4/3] rounded overflow-hidden border border-white/20 shadow-lg bg-gray-800">
                            <img :src="img" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>

                <!-- 核心文字區塊 (毛玻璃) -->
                <div class="glass-panel w-full px-5 py-4 border-t border-white/10 flex flex-col">
                    
                    <!-- 特殊提醒/航班 -->
                    <div v-if="day.flight" class="mb-3 text-xs bg-amber-600/30 text-amber-100 border border-amber-500/30 p-2 rounded whitespace-pre-line leading-relaxed">
                        <svg class="w-4 h-4 inline-block mr-1 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        {{ day.flight }}
                    </div>
                    
                    <!-- 行程節點 -->
                    <ul class="space-y-3 mb-5 overflow-y-auto max-h-[22vh] hide-scrollbar pr-1 text-sm font-medium leading-relaxed opacity-95">
                        <li v-for="pt in day.points" :key="pt.name" class="flex items-start">
                            <svg class="w-4 h-4 text-teal-400 mt-1 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <div><strong class="text-white">{{ pt.name }}</strong><span class="mx-1 opacity-60">|</span><span class="opacity-80">{{ pt.desc }}</span></div>
                        </li>
                    </ul>

                    <!-- 底部三欄資訊 -->
                    <div class="grid grid-cols-3 gap-3 text-[11px] leading-tight pb-1">
                        <div>
                            <div class="flex items-center text-teal-300 font-bold mb-1 border-b border-white/20 pb-1">
                                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>必買/吃
                            </div>
                            <p class="opacity-80 whitespace-pre-line">{{ day.mustBuyEat }}</p>
                        </div>
                        <div>
                            <div class="flex items-center text-teal-300 font-bold mb-1 border-b border-white/20 pb-1">
                                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>膳宿
                            </div>
                            <p class="opacity-80 whitespace-pre-line">{{ day.mealsSleep }}</p>
                        </div>
                        <div>
                            <div class="flex items-center text-teal-300 font-bold mb-1 border-b border-white/20 pb-1">
                                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016zM12 9v2m0 4h.01"></path></svg>建議
                            </div>
                            <p class="opacity-80 whitespace-pre-line">{{ day.outfit }}</p>
                        </div>
                    </div>
                </div>

                <!-- 最底部 Tips (漸層) -->
                <div class="w-full bg-gradient-to-t from-[#0a1516] to-[#0a1516]/80 px-5 py-3 text-[11px] text-gray-300 flex items-start shrink-0">
                    <svg class="w-4 h-4 text-teal-500 mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="leading-relaxed opacity-90">{{ day.tips }}</span>
                </div>
            </div>
            
        </div>
    </div>
    
    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { itineraryData }; }
        }).mount('#app');
    </script>
</body>
</html>
