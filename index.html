                        const parts = spot.split(' ｜ ');
                        const name = parts[0];
                        const desc = parts[1] || '';
                        return `
                        <li class="relative flex items-start pl-12 md:pl-16 group">
                            <div class="absolute left-6 md:left-8 -translate-x-1/2 mt-3 w-4 h-4 rounded-full border-4 border-white bg-[#c88d75] shadow z-10 transition-transform group-hover:scale-125"></div>
                            <div class="bg-white/90 backdrop-blur-sm p-5 md:p-6 rounded-xl shadow-sm border border-gray-100 w-full text-left transition-all duration-300 hover:shadow-md hover:bg-white">

                            </div>
                        </li>
                        `;
                    }).join('')}
                </ul>
            `;

            let specialNotesHtml = '';

                        <ul class="list-disc ml-5 space-y-2 font-medium">
                            ${data.specialNotes.map(n => `<li>${n}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            let infoBottomHtml = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-gray-200 pt-6 mt-4">
                    <div class="flex items-start gap-3">
                        <div class="bg-teal-50 text-teal-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-teal-100"><i class="ph ph-t-shirt text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-teal-800 block mb-1">穿搭建議</span>
                            <span class="text-base md:text-lg text-gray-800 leading-relaxed">${data.outfit}</span>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="bg-pink-50 text-pink-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-pink-100"><i class="ph ph-shopping-bag text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-pink-800 block mb-1">必吃 / 必買</span>
                            <span class="text-base md:text-lg text-gray-800 block leading-relaxed"><b class="font-bold text-gray-900">買：</b>${data.buy}</span>
                            <span class="text-base md:text-lg text-gray-800 block mt-1 leading-relaxed"><b class="font-bold text-gray-900">吃：</b>${data.eat}</span>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="bg-blue-50 text-blue-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-blue-100"><i class="ph ph-bed text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-blue-800 block mb-1">膳宿</span>
                            <span class="text-base md:text-lg text-gray-800 leading-relaxed block space-y-1">${data.stay.replace(/ \/ /g, '<br>')}</span>
                        </div>
                    </div>
                </div>
            `;

            return `
                <div class="bg-[var(--card-bg)] backdrop-blur-md rounded-2xl shadow-lg border border-white/50 overflow-hidden transition-all duration-300 hover:shadow-2xl">
                    <!-- 卡片標題區 (可點擊) -->
                    <div class="header-bg flex justify-between items-stretch cursor-pointer relative transition-colors hover:brightness-110" onclick="toggleCard(this)">
                        
                        <!-- 左側標題區塊 (大幅壓縮上下空間) -->
                        <div class="py-3 pl-4 md:pl-5 flex flex-col justify-center flex-1 min-w-0 pr-3">

                        </div>

                        <!-- 右側天氣與箭頭，與標題列同高 (items-stretch) -->
                        <div class="flex items-stretch shrink-0">

                            <div class="flex flex-col justify-center items-center px-3 md:px-5 hidden sm:flex bg-transparent">

                            </div>
                            <!-- 箭頭 -->
                            <div class="flex items-center justify-center w-12 md:w-14 bg-white/5 border-l border-white/10">
                                <i class="ph ph-caret-down text-white text-xl md:text-2xl transition-transform duration-500 chevron-icon ${chevronClass}"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 卡片內容區 (展開/收合) -->
                    <div class="card-content bg-gradient-custom ${contentClass}">
                        <!-- 圖片區塊 (置中、靜態縮放、移除動態 hover 效果) -->
                        <div class="w-full h-48 md:h-64 overflow-hidden relative border-b border-gray-200/50 bg-[#e3dfd3]">
                            <img src="${data.image}" alt="${data.title}" class="w-full h-full object-cover object-center block" loading="lazy" />

                        <div class="p-4 md:p-8">

                            <div class="mb-8 mt-2">
                                ${spotsHtml}
                            </div>
                            
                            ${infoBottomHtml}
                            
                            <div class="mt-6 md:mt-8 bg-[#5c6c64] text-white/95 p-4 md:p-5 rounded-xl text-base md:text-lg flex gap-3 items-start shadow-inner tracking-wide leading-relaxed">
                                <i class="ph ph-lightbulb text-yellow-300 text-2xl md:text-3xl shrink-0 mt-0.5 drop-shadow"></i>
                                <p><b class="font-bold text-white mr-1 tracking-widest block md:inline mb-1 md:mb-0">TIPS｜</b>${data.tips}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        const listContainer = document.getElementById('itinerary-list');
        
        // 渲染所有卡片
        itineraryData.forEach((data, index) => {
            listContainer.innerHTML += createCard(data, index);
        });

        // 展開/收合卡片的邏輯
        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            const content = card.querySelector('.card-content');
            const chevron = card.querySelector('.chevron-icon');
            
            // 如果當前是關閉的，就打開它
            if (!content.classList.contains('open')) {
                content.classList.add('open');
                chevron.classList.add('rotate-180');
            } else {
                // 如果當前是打開的，就關閉它
                content.classList.remove('open');
                chevron.classList.remove('rotate-180');
            }
        }
    </script>
</body>
