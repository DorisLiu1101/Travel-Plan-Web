<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程規劃 - 新版模板</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
    
    <script>
        /* 色彩系統設定 (古籍苔綠) */
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        moss: {
                            100: '#F4EFD9', /* 最淺色 (背景) */
                            200: '#D8D2A7', /* 點綴淺色 */
                            300: '#A9B482', /* 輔助中色 */
                            400: '#6F7F5A', /* 品牌主色 */
                            500: '#3C4733', /* 最深色 (文字) */
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4EFD9;
            color: #3C4733;
            scroll-behavior: smooth;
        }

        /* 隱藏水平溢出的滑動軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 全域客製化拉 BAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F4EFD9; }
        ::-webkit-scrollbar-thumb { background: #A9B482; border-radius: 4px; border: 2px solid #F4EFD9; }
        ::-webkit-scrollbar-thumb:hover { background: #6F7F5A; }

        dialog::backdrop {
            background-color: rgba(60, 71, 51, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>

    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-moss-100/70 backdrop-blur-xl border border-white/50;
                box-shadow: 0 4px 20px rgba(60,71,51,0.05);
            }
            .sidebar-collapsed {
                @apply w-20;
            }
            .sidebar-collapsed .nav-text {
                @apply hidden opacity-0;
            }
            .sidebar-collapsed .nav-item {
                @apply justify-center px-0;
            }
            .nav-item.active {
                @apply bg-moss-400 text-moss-100 shadow-[0_4px_12px_rgba(111,127,90,0.3)];
            }
            .nav-item.active .nav-icon {
                @apply bg-moss-500 text-moss-100;
            }
            .spot-card {
                @apply bg-white/90 border border-moss-300/30 shadow-sm transition-all duration-300;
            }
            .spot-card:hover {
                @apply -translate-y-0.5 shadow-[0_12px_30px_rgba(60,71,51,0.08)];
            }
        }
    </style>
</head>
<body class="antialiased relative selection:bg-moss-300 selection:text-moss-500">

    <!-- 頂部主視覺 (Hero) -->
    <header id="hero" class="relative w-full h-[40vh] md:h-[50vh] bg-cover bg-center transition-all duration-500 bg-moss-300">
        <div class="absolute inset-0 bg-gradient-to-t from-moss-500/90 via-moss-500/30 to-transparent"></div>
        <div class="absolute bottom-12 md:bottom-16 left-0 w-full px-4 md:px-12 max-w-7xl mx-auto">
            <div class="mb-3 flex items-center gap-3 text-moss-100/90 text-[10px] md:text-xs font-black tracking-widest uppercase">
                <span id="ui-hero-date">--</span>
                <span class="w-1.5 h-1.5 rounded-full bg-moss-300"></span>
                <span id="ui-hero-days">-- DAYS</span>
            </div>
            <h1 id="ui-hero-title" class="text-3xl md:text-5xl lg:text-6xl font-serif font-black text-moss-100 mb-4 tracking-wide drop-shadow-lg">載入中...</h1>
            <p id="ui-subtitle" class="text-moss-100/80 text-sm md:text-base font-bold flex items-center gap-2">
                <i class="ph ph-spinner animate-spin"></i> 正在讀取資料
            </p>
        </div>
    </header>

    <!-- [PC 端專屬] 橫向主頁籤 (Sticky Navbar) -->
    <div class="hidden md:flex sticky top-0 z-40 bg-moss-100/90 backdrop-blur-lg border-b border-moss-300/30 w-full shadow-sm">
        <div class="max-w-7xl mx-auto px-12 flex items-center justify-start gap-6 overflow-x-auto no-scrollbar py-3">
            <button onclick="switchMainTab('tab-overview')" id="btn-pc-tab-overview" class="main-tab-btn-pc bg-moss-400 text-moss-100 shadow-md flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0 active">
                <i class="ph ph-compass text-xl"></i> 總覽
            </button>
            <button onclick="switchMainTab('tab-itinerary')" id="btn-pc-tab-itinerary" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0">
                <i class="ph ph-map-trifold text-xl"></i> 行程
            </button>
            <button onclick="switchMainTab('tab-expenses')" id="btn-pc-tab-expenses" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0">
                <i class="ph ph-coin text-xl"></i> 經費
            </button>
            <button onclick="switchMainTab('tab-todo')" id="btn-pc-tab-todo" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0">
                <i class="ph ph-check-square text-xl"></i> 待辦
            </button>
        </div>
    </div>

    <!-- 頁面主要容器 -->
    <div class="max-w-7xl mx-auto px-4 md:px-12 py-8 pb-24 md:pb-8 w-full min-h-[60vh] relative">
        
        <!-- 1. 總覽 (Overview) -->
        <main id="tab-overview" class="main-content-pane block space-y-8 animate-[rise_0.3s_ease-out]">
            
            <div class="glass-panel rounded-2xl p-6 md:p-8 flex flex-col md:flex-row md:items-start justify-start gap-5 md:gap-8 border border-white">
                <div class="md:w-[35%] shrink-0">
                    <p class="text-[10px] md:text-[11px] text-moss-400 font-black tracking-widest mb-1 uppercase">Dates / 日期</p>
                    <p id="ui-overview-date" class="text-sm md:text-base font-bold text-moss-500">--</p>
                </div>
                <div class="hidden md:block w-px h-8 bg-moss-300/40 mt-1"></div>
                <div class="md:w-[20%] shrink-0">
                    <p class="text-[10px] md:text-[11px] text-moss-400 font-black tracking-widest mb-1 uppercase">Duration / 天數</p>
                    <p id="ui-overview-days" class="text-sm md:text-base font-bold text-moss-500">--</p>
                </div>
                <div class="hidden md:block w-px h-8 bg-moss-300/40 mt-1"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] md:text-[11px] text-moss-400 font-black tracking-widest mb-1 uppercase">Cities / 地點</p>
                    <p id="ui-overview-cities" class="text-sm md:text-base font-bold text-moss-500 leading-relaxed break-words">--</p>
                </div>
                <div id="ui-overview-info-col" class="hidden flex-1 min-w-0">
                    <p id="ui-overview-info-title" class="text-[10px] md:text-[11px] text-moss-400 font-black tracking-widest mb-1 uppercase">Info / 說明</p>
                    <p class="text-sm md:text-base font-bold text-moss-500 leading-relaxed truncate"><a id="ui-overview-info-link" href="#" target="_blank" class="hover:text-moss-400 underline underline-offset-4 decoration-moss-300/50">--</a></p>
                </div>
            </div>

            <!-- 總覽地圖區塊 -->
            <div id="overview-map-container" class="w-full h-[450px] md:h-[500px] rounded-[2rem] overflow-hidden shadow-sm border border-moss-200 bg-moss-200/50 relative hidden">
                <!-- iframe 將於 JS 動態寫入並裁切表頭 -->
            </div>

            <div class="mt-8">
                <!-- 橫滑吸附容器 -->
                <div id="overview-city-cards" class="flex gap-4 overflow-x-auto pb-6 custom-scrollbar snap-x snap-mandatory">
                    <!-- 動態生成城市卡片 -->
                </div>
            </div>
        </main>

        <!-- 2. 行程 (Itinerary) -->
        <main id="tab-itinerary" class="main-content-pane hidden animate-[rise_0.3s_ease-out]">
            <div class="flex flex-col md:flex-row gap-8 items-start w-full relative">
                
                <nav id="itinerary-mobile-nav" class="md:hidden sticky top-4 z-30 glass-panel rounded-full p-1.5 flex overflow-x-auto no-scrollbar gap-1 w-full shadow-sm"></nav>

                <nav id="itinerary-sidebar" class="hidden md:flex flex-col sticky top-24 z-30 w-64 glass-panel rounded-2xl p-4 transition-all duration-300 ease-in-out shrink-0">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <span class="nav-text text-[10px] font-black text-moss-400 tracking-widest uppercase">目錄 Navigation</span>
                        <button id="toggle-sidebar" class="w-8 h-8 rounded-full hover:bg-moss-200 flex items-center justify-center text-moss-500 transition-colors">
                            <i class="ph ph-caret-left text-lg toggle-icon font-bold"></i>
                        </button>
                    </div>
                    <div id="pc-nav-links" class="flex flex-col gap-1"></div>
                </nav>

                <div id="itinerary-content" class="flex-1 w-full flex flex-col">
                    <!-- 動態生成每日行程 -->
                </div>
            </div>
        </main>

        <!-- 3. 經費 (Expenses) -->
        <main id="tab-expenses" class="main-content-pane hidden space-y-8 animate-[rise_0.3s_ease-out]">
            <div class="bg-white/80 rounded-2xl p-6 md:p-8 border border-moss-200 shadow-sm">
                <h3 class="text-xl font-black text-moss-500 mb-6 flex items-center gap-2"><i class="ph ph-chart-pie-slice text-2xl text-moss-400"></i> 經費儀表板</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-moss-100 p-4 rounded-xl border border-moss-200">
                        <p class="text-[10px] md:text-[11px] text-moss-400 font-black tracking-widest mb-1.5 uppercase">每人預估團費</p>
                        <p id="ui-expense-fee" class="text-xl md:text-2xl font-black text-moss-500 leading-none">--</p>
                        <p id="ui-expense-note" class="text-xs font-bold text-moss-400 mt-2 hidden"></p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 4. 待辦 (TODO) -->
        <main id="tab-todo" class="main-content-pane hidden space-y-8 animate-[rise_0.3s_ease-out]">
            <div class="bg-white/80 rounded-2xl p-6 md:p-8 border border-moss-200 shadow-sm border-l-4 border-l-moss-400">
                <div class="flex items-center gap-2 mb-8">
                    <h3 class="text-xl font-black text-moss-500 flex items-center gap-2"><i class="ph ph-check-square text-2xl text-moss-400"></i> 行程待辦事項</h3>
                    <div class="relative group cursor-pointer flex items-center justify-center">
                        <i class="ph ph-info text-moss-300 text-lg hover:text-moss-500 transition-colors"></i>
                        <div class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-56 p-3 bg-moss-500 text-moss-100 text-xs rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all pointer-events-none z-10 text-center shadow-lg leading-relaxed font-medium">
                            此清單與每日景點的待辦狀態雙向連動，方便您集中管理任務進度。
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-moss-500 rotate-45"></div>
                        </div>
                    </div>
                </div>
                
                <div id="todo-list-container" class="space-y-6">
                    <!-- 待辦清單動態生成 -->
                </div>
            </div>
        </main>
        
    </div>

    <!-- [手機端專屬] App 底部導航列 -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-moss-100/95 backdrop-blur-lg border-t border-moss-300/40 pt-1 pb-4 md:pb-6 shadow-[0_-4px_20px_rgba(60,71,51,0.08)]">
        <div class="flex justify-around items-center px-2">
            <button onclick="switchMainTab('tab-overview')" id="btn-mob-tab-overview" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-500 transition-all duration-200 active scale-[1.15] drop-shadow-sm">
                <i class="ph ph-compass text-2xl"></i>
                <span class="text-[10px] font-black leading-none">總覽</span>
            </button>
            <button onclick="switchMainTab('tab-itinerary')" id="btn-mob-tab-itinerary" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-map-trifold text-2xl"></i>
                <span class="text-[10px] font-black leading-none">行程</span>
            </button>
            <button onclick="switchMainTab('tab-expenses')" id="btn-mob-tab-expenses" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-coin text-2xl"></i>
                <span class="text-[10px] font-black leading-none">經費</span>
            </button>
            <button onclick="switchMainTab('tab-todo')" id="btn-mob-tab-todo" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-check-square text-2xl"></i>
                <span class="text-[10px] font-black leading-none">待辦</span>
            </button>
        </div>
    </div>

    <!-- 彈窗 (Modal) -->
    <dialog id="info-modal" class="bg-moss-100 rounded-[2rem] shadow-2xl p-0 w-[90%] max-w-md m-auto open:animate-[rise_0.3s_ease-out] border-4 border-white overflow-hidden relative">
        <div class="absolute top-0 left-0 w-full h-24 bg-moss-300/20"></div>
        <button onclick="closeModalByBtn()" class="absolute top-5 right-5 w-8 h-8 bg-white hover:bg-moss-400 hover:text-white rounded-full flex items-center justify-center text-moss-400 transition-colors z-20 shadow-sm border border-moss-200">
            <i class="ph ph-x font-bold text-sm"></i>
        </button>
        <div class="p-8 relative z-10 pt-10">
            <div class="flex flex-col items-center text-center gap-4 mb-6 pb-6 border-b border-moss-300/40">
                <div class="w-14 h-14 bg-white rounded-2xl shadow-sm border border-moss-200 flex items-center justify-center">
                    <i id="modal-icon" class="text-3xl text-moss-400"></i>
                </div>
                <h3 id="modal-title" class="text-lg md:text-xl font-black text-moss-500 tracking-wide"></h3>
            </div>
            <p id="modal-content" class="text-moss-500 font-medium leading-relaxed text-sm md:text-base whitespace-pre-line text-center"></p>
        </div>
    </dialog>

    <script>
        /* ================= 切換主頁籤邏輯 ================= */
        function switchMainTab(tabId) {
            document.querySelectorAll('.main-content-pane').forEach(el => el.classList.add('hidden'));
            const targetTab = document.getElementById(tabId);
            if(targetTab) targetTab.classList.remove('hidden');
            
            // PC 樣式切換
            document.querySelectorAll('.main-tab-btn-pc').forEach(btn => {
                btn.className = "main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0";
            });
            const activePc = document.getElementById('btn-pc-' + tabId);
            if(activePc) {
                activePc.className = "main-tab-btn-pc bg-moss-400 text-moss-100 shadow-md flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all shrink-0 active";
            }

            // 手機底部樣式切換 (加強未選與點選的對比度，縮小文字間隔)
            document.querySelectorAll('.main-tab-btn-mob').forEach(btn => {
                btn.className = "main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-400/60 hover:text-moss-400 transition-all duration-200";
            });
            const activeMob = document.getElementById('btn-mob-' + tabId);
            if(activeMob) {
                activeMob.className = "main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 pt-1.5 pb-1 w-16 text-moss-500 transition-all duration-200 active scale-[1.15] drop-shadow-sm";
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ================= 彩蛋選單切換邏輯 ================= */
        function switchEggTab(dayId, typeId) {
            document.querySelectorAll(`.egg-content-${dayId}`).forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`egg-${typeId}-${dayId}`);
            if (target) target.classList.remove('hidden');
            
            document.querySelectorAll(`.egg-tab-${dayId}`).forEach(el => {
                el.className = `egg-tab-${dayId} px-4 py-2 rounded-xl font-bold text-sm transition-all text-moss-500 hover:bg-moss-300/30 flex-1 md:flex-none text-center md:text-left`;
            });
            const activeBtn = document.getElementById(`btn-egg-${typeId}-${dayId}`);
            if (activeBtn) {
                activeBtn.className = `egg-tab-${dayId} px-4 py-2 rounded-xl font-bold text-sm transition-all bg-moss-400 text-moss-100 shadow-sm flex-1 md:flex-none text-center md:text-left active`;
            }
        }

        /* ================= 彈窗與收合邏輯 ================= */
        const modal = document.getElementById('info-modal');

        function openModal(title, content) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-icon').className = 'text-3xl text-moss-400 ph ph-info';
            document.getElementById('modal-content').innerHTML = content;
            modal.showModal();
            // 推入瀏覽器歷史狀態，阻斷上一頁直接跳出
            history.pushState({ modalOpen: true }, "");
        }

        // 綁定 X 按鈕
        function closeModalByBtn() {
            if(history.state && history.state.modalOpen) {
                history.back(); // 會觸發 popstate 事件來關閉
            } else {
                modal.close();
            }
        }

        // 監聽網頁上一頁事件 (或是透過 history.back() 觸發)
        window.addEventListener('popstate', (e) => {
            if (modal.hasAttribute('open')) {
                modal.close();
            }
        });

        // 監聽原生 ESC 取消事件
        modal.addEventListener('cancel', (e) => {
            if(history.state && history.state.modalOpen) {
                history.back();
            }
        });

        // 點擊事件代理
        document.addEventListener('click', (e) => {
            const noteBtn = e.target.closest('.btn-note');
            if (noteBtn) {
                openModal(noteBtn.getAttribute('data-title') || '備註資訊', decodeURIComponent(noteBtn.getAttribute('data-content')));
            }
        });

        const toggleBtn = document.getElementById('toggle-sidebar');
        const toggleIcon = document.querySelector('.toggle-icon');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const sidebar = document.getElementById('itinerary-sidebar');
                sidebar.classList.toggle('sidebar-collapsed');
                if (sidebar.classList.contains('sidebar-collapsed')) {
                    toggleIcon.classList.remove('ph-caret-left');
                    toggleIcon.classList.add('ph-list');
                } else {
                    toggleIcon.classList.remove('ph-list');
                    toggleIcon.classList.add('ph-caret-left');
                }
            });
        }

        window.travelItineraryData = null; // store for re-renders

        function renderTodos(itineraryData) {
            window.travelItineraryData = itineraryData;
            const container = document.getElementById('todo-list-container');
            if (!container) return;
            
            const savedTodos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
            
            let pendingHtml = '';
            let completedHtml = '';
            let pendingCount = 0;
            let completedCount = 0;

            const generateTaskHtml = (todoObj, tIdx, prefixTitle, isSpot, dayIndex, spotIndex) => {
                const task = typeof todoObj === 'string' ? todoObj : todoObj.task;
                const note = (typeof todoObj === 'object' && todoObj.note) ? ` <span class="text-[10px] md:text-xs font-normal opacity-80 ml-1">(${todoObj.note})</span>` : '';
                const todoId = isSpot ? `todo-${dayIndex}-${spotIndex}-${tIdx}` : `todo-day-${dayIndex}-${tIdx}`;
                const globalTodoId = `global-${todoId}`;
                const isChecked = !!savedTodos[todoId];
                
                const itemHtml = `
                    <label class="flex items-start gap-2 cursor-pointer group p-1.5 md:p-2 rounded-lg hover:bg-moss-200/50 transition-colors border border-transparent hover:border-moss-200/50 w-full ${isChecked ? 'grayscale opacity-60' : ''}">
                        <input type="checkbox" id="${globalTodoId}" data-target="${todoId}" class="global-todo-cb peer sr-only" ${isChecked ? 'checked' : ''}>
                        <div class="w-4 h-4 md:w-5 md:h-5 shrink-0 rounded border-2 flex items-center justify-center transition-all mt-0.5 shadow-sm ${isChecked ? 'border-moss-300 bg-moss-300' : 'border-moss-300 peer-checked:bg-moss-400 peer-checked:border-moss-400'}">
                            <i class="ph ph-check text-moss-100 opacity-0 peer-checked:opacity-100 font-bold text-xs md:text-sm"></i>
                        </div>
                        <div class="flex flex-col flex-1 min-w-0">
                            <span class="text-[9px] md:text-[10px] font-black text-moss-400 mb-0.5 tracking-wider truncate">${prefixTitle}</span>
                            <span class="text-sm md:text-base font-bold transition-colors break-words ${isChecked ? 'text-moss-400 line-through' : 'text-moss-500 peer-checked:text-moss-400/60 peer-checked:line-through'}">${task}${note}</span>
                        </div>
                    </label>
                `;
                
                if (isChecked) {
                    completedHtml += itemHtml;
                    completedCount++;
                } else {
                    return itemHtml;
                }
                return '';
            };

            itineraryData.forEach((day, index) => {
                let dayPendingHtml = '';
                
                if (day.todos && day.todos.length > 0) {
                    day.todos.forEach((todoObj, tIdx) => {
                        const item = generateTaskHtml(todoObj, tIdx, `D${index+1} ｜ 本日待辦`, false, index, null);
                        if(item) { dayPendingHtml += item; pendingCount++; }
                    });
                }

                if (day.spots) {
                    day.spots.forEach((spot, spotIndex) => {
                        if (spot.todos && spot.todos.length > 0) {
                            spot.todos.forEach((todoObj, tIdx) => {
                                const item = generateTaskHtml(todoObj, tIdx, `D${index+1} ｜ ${spot.name}`, true, index, spotIndex);
                                if(item) { dayPendingHtml += item; pendingCount++; }
                            });
                        }
                    });
                }
                
                if (dayPendingHtml) {
                    if (pendingHtml !== '') {
                        pendingHtml += '<hr class="border-moss-200 border-dashed my-3 opacity-60">';
                    }
                    pendingHtml += `<div class="space-y-0.5">${dayPendingHtml}</div>`;
                }
            });

            let html = '';
            if (pendingCount > 0) {
                html += `<div class="mb-6 bg-white/50 p-3 rounded-xl border border-moss-200/60">${pendingHtml}</div>`;
            } else if (completedCount === 0) {
                html += `<p class="text-moss-400 font-medium py-8 text-center bg-moss-100 rounded-xl border border-moss-200 border-dashed mb-6">目前沒有任何待辦事項</p>`;
            } else {
                html += `<p class="text-moss-400 font-medium py-6 text-center bg-moss-100 rounded-xl border border-moss-200 border-dashed mb-6">所有待辦事項皆已完成 🎉</p>`;
            }

            if (completedCount > 0) {
                html += `
                    <details class="group bg-moss-100 border border-moss-200 rounded-2xl p-4 transition-all duration-300">
                        <summary class="flex justify-between items-center cursor-pointer list-none font-black text-moss-400 text-sm md:text-base opacity-80 hover:opacity-100 transition-opacity">
                            <span class="flex items-center gap-2"><i class="ph ph-check-circle text-xl"></i> 已完成項目 (${completedCount})</span>
                            <div class="w-8 h-8 rounded-full bg-moss-200/50 flex items-center justify-center text-moss-500 group-open:rotate-180 transition-transform"><i class="ph ph-caret-down font-bold"></i></div>
                        </summary>
                        <div class="mt-4 pt-4 border-t border-moss-200/80 space-y-0.5">
                            ${completedHtml}
                        </div>
                    </details>
                `;
            }

            container.innerHTML = html;
        }

        function initTodos() {
            const savedTodos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
            
            document.querySelectorAll('.spot-todo-cb').forEach(cb => {
                cb.checked = !!savedTodos[cb.id];
                
                const newCb = cb.cloneNode(true);
                cb.parentNode.replaceChild(newCb, cb);
                
                newCb.addEventListener('change', (e) => {
                    const id = e.target.id;
                    const isChecked = e.target.checked;
                    const todos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
                    todos[id] = isChecked;
                    localStorage.setItem('travel_todos', JSON.stringify(todos));
                    
                    if (window.travelItineraryData) {
                        renderTodos(window.travelItineraryData);
                        bindGlobalTodos();
                    }
                });
            });
        }

        function bindGlobalTodos() {
            document.querySelectorAll('.global-todo-cb').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.dataset.target;
                    const isChecked = e.target.checked;
                    const todos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
                    todos[id] = isChecked;
                    localStorage.setItem('travel_todos', JSON.stringify(todos));
                    
                    const spotCb = document.getElementById(id);
                    if (spotCb) spotCb.checked = isChecked;
                    
                    if (window.travelItineraryData) {
                        renderTodos(window.travelItineraryData);
                        bindGlobalTodos();
                    }
                });
            });
        }

        async function loadItinerary() {
            try {
                const response = await fetch('2610.json');
                const data = await response.json();
                
                if(data.settings) {
                    renderHero(data.settings, data.itinerary);
                }
                
                renderNavigation(data.itinerary);
                renderOverviewCities(data.itinerary);
                renderItinerary(data.itinerary, data.settings);
                renderTodos(data.itinerary);
                initTodos();
                bindGlobalTodos();
                setupScrollSpy();

            } catch (error) {
                console.error("載入資料失敗:", error);
            }
        }

        function renderHero(settings, itineraryData) {
            document.title = settings.pageTitle || '行程表';
            
            document.getElementById('ui-hero-date').textContent = settings.dateText || '--';
            document.getElementById('ui-hero-days').textContent = (itineraryData ? itineraryData.length : '--') + ' DAYS';
            document.getElementById('ui-hero-title').textContent = settings.heroTitle || '未知旅程';
            document.getElementById('ui-subtitle').textContent = settings.subtitle || '';
            
            document.getElementById('ui-overview-date').textContent = settings.dateText || '--';
            document.getElementById('ui-overview-days').textContent = (itineraryData ? itineraryData.length : '--') + ' DAYS';
            
            if (itineraryData && itineraryData.length > 0) {
                const uniqueTitles = [...new Set(itineraryData.map(d => d.title.split(' ｜ ')[0]).filter(Boolean))];
                document.getElementById('ui-overview-cities').textContent = uniqueTitles.slice(0, 4).join(', ') + (uniqueTitles.length > 4 ? '...' : '');
            }
            
            if (settings.heroImage) {
                document.getElementById('hero').style.backgroundImage = `url('${settings.heroImage}')`;
            }

            if (settings.info) {
                const infoCol = document.getElementById('ui-overview-info-col');
                const infoTitle = document.getElementById('ui-overview-info-title');
                const infoLink = document.getElementById('ui-overview-info-link');
                
                infoTitle.textContent = settings.info.title || 'Info / 說明';
                infoLink.textContent = settings.info.text || '--';
                if (settings.info.link) {
                    infoLink.href = settings.info.link;
                    infoLink.classList.add('underline');
                } else {
                    infoLink.removeAttribute('href');
                    infoLink.classList.remove('underline');
                }
                infoCol.classList.remove('hidden');
            }

            if (settings.overviewMap && settings.overviewMap.iframeUrl) {
                const mapContainer = document.getElementById('overview-map-container');
                mapContainer.innerHTML = `<iframe src="${settings.overviewMap.iframeUrl}" style="position:absolute; top:-75px; left:0; width:100%; height:calc(100% + 75px); border:none;" loading="lazy"></iframe>`;
                mapContainer.classList.remove('hidden');
            }

            if (settings.expenses) {
                if(settings.expenses.tourFee) {
                    document.getElementById('ui-expense-fee').textContent = `${settings.expenses.currency || 'NT$'} ${settings.expenses.tourFee.toLocaleString()}`;
                }
                if(settings.expenses.note) {
                    const noteEl = document.getElementById('ui-expense-note');
                    noteEl.textContent = settings.expenses.note;
                    noteEl.classList.remove('hidden');
                }
            }
        }

        function renderOverviewCities(itineraryData) {
            const container = document.getElementById('overview-city-cards');
            if (!container) return;
            
            let spotsWithImages = [];
            itineraryData.forEach(day => {
                if(day.spots) {
                    day.spots.forEach(spot => {
                        if(spot.image && spotsWithImages.length < 8) {
                            spotsWithImages.push(spot);
                        }
                    });
                }
            });

            if(spotsWithImages.length === 0) return;

            let html = '<div class="w-[calc(50%-5rem)] md:w-[calc(50%-6rem)] shrink-0 pointer-events-none"></div>';
            spotsWithImages.forEach(spot => {
                html += `
                <div class="w-40 md:w-48 shrink-0 rounded-[2rem] overflow-hidden shadow-sm border border-moss-200 group cursor-pointer relative aspect-[3/4] snap-center">
                    <img src="${spot.image}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-moss-500/90 via-moss-500/20 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 w-full p-4 md:p-5 flex flex-col justify-end text-moss-100">
                        <h4 class="font-black text-base md:text-lg truncate shadow-sm drop-shadow-md">${spot.name}</h4>
                        <p class="text-[9px] md:text-[10px] font-black tracking-widest mt-1 uppercase opacity-90 truncate drop-shadow-md">Highlight</p>
                    </div>
                </div>
                `;
            });
            html += '<div class="w-[calc(50%-5rem)] md:w-[calc(50%-6rem)] shrink-0 pointer-events-none"></div>';
            container.innerHTML = html;
        }

        function renderNavigation(itineraryData) {
            const pcNavContainer = document.getElementById('pc-nav-links');
            const mobileNavContainer = document.getElementById('itinerary-mobile-nav');
            let pcHtml = '';
            let mobileHtml = '';

                            <div class="w-24 md:w-40 h-[2px] bg-moss-300/50 rounded-full"></div>
                            <i class="ph ph-airplane-in-flight text-moss-400 text-xl md:text-2xl"></i>
                            <div class="w-24 md:w-40 h-[2px] bg-moss-300/50 rounded-full"></div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function setupScrollSpy() {
            const observer = new IntersectionObserver((entries) => {
                if(document.getElementById('tab-itinerary').classList.contains('hidden')) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.nav-day').forEach(item => item.classList.remove('active'));
                        const activeItems = document.querySelectorAll(`.nav-day[data-target="${entry.target.id}"]`);
                        activeItems.forEach(item => {
                            item.classList.add('active');
                            if(item.closest('#itinerary-mobile-nav')) {
                                item.closest('#itinerary-mobile-nav').scrollTo({
                                    left: item.offsetLeft - 20,
                                    behavior: 'smooth'
                                });
                            }
                        });
                    }
                });
            }, { rootMargin: '-30% 0px -50% 0px', threshold: 0 });

            document.querySelectorAll('#itinerary-content section').forEach(section => observer.observe(section));
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadItinerary();
        });
    </script>
</body>
</html>
