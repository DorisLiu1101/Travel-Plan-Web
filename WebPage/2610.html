<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-color: #eef2ec;
            --text-main: #26332e;
            --accent-color: #c96f50;
            --card-bg: rgba(255, 255, 255, 0.94);
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: linear-gradient(rgba(49, 90, 76, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(49, 90, 76, .035) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(49, 90, 76, 0.38);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(49, 90, 76, 0.68);
        }

        /* 卡片展開動畫 */
        .card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-in-out;
            opacity: 0;
        }
        .card-content.open {
            max-height: 5000px;
            opacity: 1;
        }

        .bg-gradient-custom {
            background: linear-gradient(135deg, #f7f9f5 0%, #edf2ed 100%);
        }
        
        .header-bg {
            min-height: 238px;
            display: flex;
            align-items: center;
            background-color: #203d34;
            background-image: linear-gradient(90deg, rgba(25, 49, 41, .94) 0%, rgba(25, 49, 41, .72) 54%, rgba(25, 49, 41, .18) 100%), url('https://images.unsplash.com/photo-1549740425-5e9ed4d8cd34?q=80&w=1800&auto=format&fit=crop');
            background-position: center 48%;
            background-size: cover;
            color: white;
        }

        .header-inner { min-height: 176px; align-items: flex-start; justify-content: center; text-align: left; }
        .header-inner h1 { max-width: 720px; font-size: 38px; line-height: 1.25; }
        .header-meta { color: rgba(255,255,255,.88); }
        .page-tabs-wrap { width: min(1050px, 100%); margin: 0 auto; padding: 0 24px; }
        .page-tabs { display: flex; gap: 10px; overflow-x: auto; padding: 8px 8px 0; border-bottom: 1px solid rgba(49,90,76,.12); scrollbar-width: none; -ms-overflow-style: none; }
        .page-tabs::-webkit-scrollbar { display: none; }
        .page-tab { position: relative; min-height: 42px; flex: 0 0 auto; padding: 0 18px; border: 1px solid rgba(49,90,76,.12); border-bottom: 0; border-radius: 12px 12px 0 0; background: rgba(49,90,76,.03); color: var(--muted); font: 700 14px 'Noto Sans TC',sans-serif; transition: all .18s ease; }
        .page-tab:hover { background: rgba(49,90,76,.06); color: var(--text-main); }
        .page-tab[aria-selected="true"] { border-color: rgba(49,90,76,.18); background: rgba(255,255,255,.94); color: var(--green); box-shadow: 0 -3px 12px rgba(37,57,47,.08); }
        .page-tab[aria-selected="true"]::after { position: absolute; right: 8px; bottom: -1px; left: 8px; height: 3px; border-radius: 999px 999px 0 0; background: var(--coral); content: ''; }
        .page-tab:focus-visible { outline: 2px solid var(--green); outline-offset: -3px; }
        .page-view[hidden] { display: none; }
        .overview-facts { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; padding: 5px 0 18px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
        .overview-fact { display: grid; gap: 4px; min-width: 0; }
        .overview-fact span { color: var(--muted); font-size: 10px; }
        .overview-fact strong { overflow-wrap: anywhere; font-size: 14px; }
        .empty-page { padding: 28px 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
        .itinerary-card { overflow: hidden; border: 1px solid rgba(38,51,46,.09); border-radius: 11px; background: var(--card-bg); box-shadow: 0 8px 24px rgba(37,57,47,.07); transition: box-shadow .25s, transform .25s; }
        .itinerary-card:hover { box-shadow: 0 14px 34px rgba(37,57,47,.12); transform: translateY(-2px); }
        .day-header { background: #315a4c; color: white; }
        .spot-card { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; width: 100%; padding: 16px 12px 17px 0; border-bottom: 1px solid rgba(49,90,76,.12); text-align: left; transition: background .18s; }
        .spot-card:hover { background: rgba(255,255,255,.5); }
        .spot-copy { min-width: 0; flex: 1; }
        .spot-image { width: 132px; height: 92px; flex: 0 0 132px; border-radius: 7px; object-fit: cover; }
        .spot-note-button { display: inline-flex; width: 34px; height: 34px; flex: 0 0 34px; align-items: center; justify-content: center; border: 1px solid rgba(49,90,76,.18); border-radius: 50%; background: rgba(49,90,76,.07); color: var(--green); }
        .spot-note-button:hover { background: var(--green); color: white; }
        .spot-note-button i { font-size: 17px; }
        .spot-note-dialog { width: min(480px,calc(100% - 28px)); max-width: none; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); box-shadow: 0 24px 70px rgba(21,37,29,.28); }
        .spot-note-dialog::backdrop { background: rgba(16,29,23,.58); backdrop-filter: blur(3px); }
        .spot-note-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
        .spot-note-head h2 { overflow: hidden; margin: 0; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
        .spot-note-close { display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); }
        .spot-note-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.8; }
        .spot-note-content { min-height: 70px; padding: 18px; margin: 0; color: var(--ink); font-size: 13px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
        .tips-note { background: #315a4c; }
        .page-footer { color: #69776f; border-color: rgba(49,90,76,.2); }

        @media (max-width: 640px) {
            .header-bg { min-height: 205px; background-position: 58% center; }
            .header-inner { min-height: 155px; }
            .header-inner h1 { max-width: 330px; font-size: 30px; }
            .header-meta { font-size: 14px; }
            .page-tabs-wrap { padding: 0 16px; }
            .page-tabs { gap: 20px; }
            .overview-facts { grid-template-columns: 1fr; gap: 11px; }
            .spot-card { gap: 10px; padding-right: 4px; }
            .spot-image { width: 88px; height: 76px; flex-basis: 88px; }
        }
    </style>
</head>
<body class="antialiased min-h-screen relative overflow-x-hidden">

    <!-- 背景裝飾元素 -->
    <!-- 主標題區 -->
    <header class="header-bg py-8 shadow-md">
        <div class="header-inner max-w-4xl mx-auto px-4 flex flex-col">
            <h1 id="site-hero-title" class="text-3xl md:text-4xl font-bold mb-2 tracking-wider"></h1>
            <p class="header-meta text-lg opacity-90 flex items-center gap-2">
                <i class="ph ph-calendar-blank"></i> <span id="site-date-text"></span>
            </p>
            <p id="site-subtitle" class="header-meta text-lg opacity-90 flex items-center gap-2"></p>
        </div>
    </header>

    <div class="page-tabs-wrap"><nav id="journey-tabs" class="page-tabs" role="tablist" aria-label="行程頁面"></nav></div>
    <main class="max-w-5xl mx-auto px-2 md:px-4 py-4 md:py-8">
        <section id="page-overview" class="page-view" role="tabpanel" aria-label="總覽">
            <div class="overview-facts"><div class="overview-fact"><span>行程名稱</span><strong id="overview-title"></strong></div><div class="overview-fact"><span>日期</span><strong id="overview-date"></strong></div><div class="overview-fact"><span>行程天數</span><strong id="overview-days"></strong></div></div>
            <p id="overview-subtitle" class="text-sm text-gray-600 leading-relaxed"></p>
        </section>
        <section id="page-itinerary" class="page-view" role="tabpanel" aria-label="行程" hidden><div id="itinerary-list" class="space-y-6 md:space-y-8"></div></section>
        <section id="page-expenses" class="page-view" role="tabpanel" aria-label="經費" hidden><p class="empty-page">尚無經費資料</p></section>
        <section id="page-todo" class="page-view" role="tabpanel" aria-label="ToDo" hidden><p class="empty-page">尚無待辦事項</p></section>
    </main>

    <!-- 頁尾 -->
    <footer class="page-footer text-center py-8 text-base opacity-80 mt-12 border-t">
        <p>© 2026 行程規劃. All rights reserved.</p>
    </footer>
    <dialog id="spot-note-dialog" class="spot-note-dialog" aria-labelledby="spot-note-title" aria-describedby="spot-note-content"><div class="spot-note-head"><h2 id="spot-note-title">景點備註</h2><button id="spot-note-close" class="spot-note-close" type="button" aria-label="關閉備註"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="spot-note-content" class="spot-note-content"></p></dialog>

    <!-- 步驟2：在這裡引入剛剛建立的 data.js 檔案 -->
    <script>
        const pageFileName = decodeURIComponent(location.pathname.split('/').pop() || '');
        const dataFileName = pageFileName.replace(/\.html$/i, '.js');
        document.write(`<script src="${encodeURIComponent(dataFileName)}"><\/script>`);
    </script>

    <script>
        // 注意！請將原本從 const itineraryData = [ 一直到 ]; 的這幾百行資料「全部刪除」！
        // 刪除後，您的 <script> 標籤內應該直接從 function createCard(data, index) 開始，如下方所示：

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
        }

        function safeImageUrl(value) {
            const url = String(value ?? '').trim();
            return /^https?:\/\//i.test(url) ? escapeHtml(url) : '';
        }

        function getMapSearchUrl(searchText, engine) {
            const query = encodeURIComponent(searchText);
            if (engine === 'amap') return `https://uri.amap.com/search?keyword=${query}`;
            if (engine === 'baidu') return `https://map.baidu.com/search/${query}`;
            return `https://www.google.com/maps/search/?api=1&query=${query}`;
        }

        function getMapEngineLabel(engine) {
            return ({ amap: '高德地圖', baidu: '百度地圖' })[engine] || 'Google Map';
        }

        if (typeof siteSettings !== 'undefined' && siteSettings) {
            document.title = siteSettings.pageTitle ?? document.title;
            document.getElementById('site-hero-title').textContent = siteSettings.heroTitle ?? document.getElementById('site-hero-title').textContent;
            document.getElementById('site-date-text').textContent = siteSettings.dateText ?? document.getElementById('site-date-text').textContent;
            document.getElementById('site-subtitle').textContent = siteSettings.subtitle ?? document.getElementById('site-subtitle').textContent;
            if (Object.prototype.hasOwnProperty.call(siteSettings, 'heroImage')) {
                const layers = ['linear-gradient(90deg, rgba(25, 49, 41, .94) 0%, rgba(25, 49, 41, .72) 54%, rgba(25, 49, 41, .18) 100%)'];
                try {
                    const imageUrl = new URL(siteSettings.heroImage);
                    if (imageUrl.protocol === 'http:' || imageUrl.protocol === 'https:') layers.push(`url(${JSON.stringify(imageUrl.href)})`);
                } catch {}
                document.querySelector('.header-bg').style.backgroundImage = layers.join(', ');
            }
        }

        const pageSettings = typeof siteSettings !== 'undefined' && siteSettings ? siteSettings : {};
        const pageTabOptions = [
            {id: 'overview', label: '總覽'},
            {id: 'itinerary', label: '行程'},
            {id: 'expenses', label: '經費'},
            {id: 'todo', label: 'ToDo'}
        ];
        let visiblePageTabs = Array.isArray(pageSettings.visibleTabs) ? pageSettings.visibleTabs.filter((tab) => pageTabOptions.some((option) => option.id === tab)) : ['overview', 'itinerary'];
        if (!visiblePageTabs.length) visiblePageTabs = ['itinerary'];
        const pageTabList = document.getElementById('journey-tabs');
        pageTabList.innerHTML = pageTabOptions.filter((option) => visiblePageTabs.includes(option.id)).map((option, index) => `<button id="tab-${option.id}" class="page-tab" type="button" role="tab" aria-controls="page-${option.id}" aria-selected="false" tabindex="${index === 0 ? '0' : '-1'}">${option.label}</button>`).join('');
        document.getElementById('overview-title').textContent = pageSettings.heroTitle ?? document.getElementById('site-hero-title').textContent;
        document.getElementById('overview-date').textContent = pageSettings.dateText ?? document.getElementById('site-date-text').textContent;
        document.getElementById('overview-days').textContent = `${Array.isArray(itineraryData) ? itineraryData.length : 0} 天`;
        document.getElementById('overview-subtitle').textContent = pageSettings.subtitle ?? '';

        function activatePageTab(tabId, focus = false) {
            pageTabList.querySelectorAll('[role="tab"]').forEach((tab) => {
                const active = tab.id === `tab-${tabId}`;
                tab.setAttribute('aria-selected', String(active));
                tab.tabIndex = active ? 0 : -1;
            });
            document.querySelectorAll('.page-view').forEach((panel) => { panel.hidden = panel.id !== `page-${tabId}`; });
            if (focus) pageTabList.querySelector(`#tab-${tabId}`)?.focus();
        }

        pageTabList.addEventListener('click', (event) => {
            const tab = event.target.closest('[role="tab"]');
            if (tab) activatePageTab(tab.id.slice(4));
        });
        pageTabList.addEventListener('keydown', (event) => {
            const tabs = [...pageTabList.querySelectorAll('[role="tab"]')];
            const currentIndex = tabs.indexOf(event.target.closest('[role="tab"]'));
            if (currentIndex < 0) return;
            let nextIndex = currentIndex;
            if (event.key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
            else if (event.key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            else if (event.key === 'Home') nextIndex = 0;
            else if (event.key === 'End') nextIndex = tabs.length - 1;
            else return;
            event.preventDefault();
            activatePageTab(tabs[nextIndex].id.slice(4), true);
        });
        activatePageTab(visiblePageTabs.includes('overview') ? 'overview' : visiblePageTabs[0]);

        function createCard(data, index) {
            const isOpen = false; // 預設全部折疊
            const chevronClass = isOpen ? "rotate-180" : "";
            const contentClass = isOpen ? "open" : "";
            const title = escapeHtml(data.title);
            const image = safeImageUrl(data.image);
            const weatherIcon = String(data.weather?.icon || 'ph-sun').replace(/[^a-z0-9-]/gi, '');

            let flightsHtml = '';
            if (data.flights && data.flights.length > 0) {
                flightsHtml = `
                    <div class="mb-6 bg-orange-50 border-l-4 border-orange-400 p-4 md:p-5 rounded-r-xl shadow-sm">
                        <div class="flex items-center gap-2 text-orange-800 font-bold mb-3">
                            <i class="ph ph-airplane-tilt text-2xl md:text-3xl"></i>
                            <span class="text-lg md:text-xl tracking-wide">班機資訊</span>
                        </div>
                        <ul class="text-base md:text-lg text-orange-900 space-y-2 ml-8 list-disc font-medium">
                            ${data.flights.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // 行程節點統一改為靠左垂直時間軸
            let spotsHtml = `
                <ul class="space-y-5 mb-6 relative before:absolute before:inset-0 before:left-6 md:before:left-8 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-[#c88d75] before:to-transparent">
                    ${data.spots.map((spot, spotIndex) => {
                        const parts = typeof spot === 'string' ? spot.split(' ｜ ') : [];
                        const spotData = typeof spot === 'string' ? {name: parts[0], description: parts[1] || ''} : spot;
                        const name = String(spotData.name || '');
                        const desc = String(spotData.description || '');
                        const searchText = String(spotData.mapQuery ?? data.spotMapQueries?.[spotIndex] ?? '').trim() || `${name} 土耳其`;
                        const mapEngine = typeof siteSettings !== 'undefined' ? siteSettings.mapEngine : 'google';
                        const mapSearchUrl = getMapSearchUrl(searchText, mapEngine);
                        const mapEngineLabel = getMapEngineLabel(mapEngine);
                        const spotImage = safeImageUrl(spotData.image || data.spotImages?.[spotIndex]);
                        const spotNote = String(spotData.note ?? data.spotNotes?.[spotIndex] ?? '').trim();
                        return `
                        <li class="relative flex items-start pl-12 md:pl-16 group">
                            <div class="absolute left-6 md:left-8 -translate-x-1/2 mt-3 w-4 h-4 rounded-full border-4 border-white bg-[#c88d75] shadow z-10 transition-transform group-hover:scale-125"></div>
                            <div class="spot-card">
                                <div class="spot-copy">
                                <div class="flex items-center gap-2 mb-2">
                                    <h4 class="font-bold text-gray-800 text-lg md:text-xl">${escapeHtml(name)}</h4>
                                    <a href="${mapSearchUrl}" target="_blank" rel="noopener noreferrer" class="text-[#c88d75] hover:text-white bg-[#c88d75]/10 hover:bg-[#c88d75] transition-colors p-1.5 rounded-full inline-flex items-center justify-center" title="在 ${mapEngineLabel} 搜尋位置">
                                        <i class="ph ph-map-pin text-lg"></i>
                                    </a>
                                    ${spotNote ? `<button class="spot-note-button" type="button" data-spot-note data-day-index="${index}" data-spot-index="${spotIndex}" aria-label="查看 ${escapeHtml(name)} 備註" title="查看景點備註"><i class="ph ph-notebook" aria-hidden="true"></i></button>` : ''}
                                </div>
                                <p class="text-base md:text-lg text-gray-700 leading-relaxed">${escapeHtml(desc)}</p>
                                </div>
                                ${spotImage ? `<img class="spot-image" src="${spotImage}" alt="${escapeHtml(name)}" loading="lazy">` : ''}
                            </div>
                        </li>
                        `;
                    }).join('')}
                </ul>
            `;

            let specialNotesHtml = '';
            if (data.specialNotes && data.specialNotes.length > 0) {
                specialNotesHtml = `
                    <div class="mb-6 bg-red-50 text-red-800 p-4 md:p-5 rounded-xl text-base md:text-lg flex items-start gap-3 border border-red-100 shadow-sm">
                        <i class="ph ph-warning-circle text-2xl md:text-3xl mt-0.5 shrink-0 text-red-600"></i>
                        <ul class="list-disc ml-5 space-y-2 font-medium">
                            ${data.specialNotes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            const legacyStayParts = String(data.stay || '').split(/\s*\/\s*/).filter(Boolean);
            const legacyMeals = legacyStayParts.filter((part) => !/^宿\s*[：:]/.test(part.trim())).join(' / ');
            const legacyLodging = legacyStayParts.filter((part) => /^宿\s*[：:]/.test(part.trim())).map((part) => part.trim().replace(/^宿\s*[：:]\s*/, '')).join(' / ');
            const meals = escapeHtml(data.meals || legacyMeals).replace(/ \/ /g, '<br>');
            const lodging = escapeHtml(data.lodging || legacyLodging).replace(/ \/ /g, '<br>');

            let infoBottomHtml = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-gray-200 pt-6 mt-4">
                    <div class="flex items-start gap-3">
                        <div class="bg-teal-50 text-teal-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-teal-100"><i class="ph ph-t-shirt text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-teal-800 block mb-1">穿搭建議</span>
                            <span class="text-base md:text-lg text-gray-800 leading-relaxed">${escapeHtml(data.outfit)}</span>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="bg-pink-50 text-pink-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-pink-100"><i class="ph ph-shopping-bag text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-pink-800 block mb-1">必買 / 必吃推薦</span>
                            <span class="text-base md:text-lg text-gray-800 block leading-relaxed"><b class="font-bold text-gray-900">買：</b>${escapeHtml(data.buy)}</span>
                            <span class="text-base md:text-lg text-gray-800 block mt-1 leading-relaxed"><b class="font-bold text-gray-900">吃：</b>${escapeHtml(data.eat)}</span>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="bg-orange-50 text-orange-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-orange-100"><i class="ph ph-fork-knife text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-orange-800 block mb-1">美食</span>
                            <span class="text-base md:text-lg text-gray-800 leading-relaxed block space-y-1">${meals}</span>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="bg-blue-50 text-blue-700 p-2 rounded-xl mt-0.5 shrink-0 shadow-sm border border-blue-100"><i class="ph ph-bed text-2xl"></i></div>
                        <div>
                            <span class="text-base md:text-lg font-bold tracking-widest text-blue-800 block mb-1">住宿</span>
                            <span class="text-base md:text-lg text-gray-800 leading-relaxed block space-y-1">${lodging}</span>
                        </div>
                    </div>
                </div>
            `;

            return `
                <div class="itinerary-card">
                    <!-- 卡片標題區 (可點擊) -->
                    <div class="day-header flex justify-between items-stretch cursor-pointer relative transition-colors hover:brightness-110" onclick="toggleCard(this)">
                        
                        <!-- 左側標題區塊 (大幅壓縮上下空間) -->
                        <div class="py-3 pl-4 md:pl-5 flex flex-col justify-center flex-1 min-w-0 pr-3">
                            <!-- 日期與天數 (天數移到標籤右側) -->
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="bg-[#c88d75] text-white px-2 py-0.5 rounded text-xs md:text-sm font-bold tracking-wider shadow-sm shrink-0">
                                    ${escapeHtml(data.fullDate)}
                                </span>
                                <span class="text-white/90 text-sm md:text-base font-bold tracking-wide shrink-0">
                                    ${escapeHtml(data.day)}
                                </span>
                            </div>
                            <!-- 標題 (不換行) -->
                            <h3 class="text-lg md:text-2xl font-bold text-white tracking-wide truncate" title="${title}">
                                ${title}
                            </h3>
                        </div>

                        <!-- 右側天氣與箭頭，與標題列同高 (items-stretch) -->
                        <div class="flex items-stretch shrink-0">
                            <!-- 天氣標籤 (滿版高度，無底色) -->
                            <div class="flex flex-col justify-center items-center px-3 md:px-5 hidden sm:flex bg-transparent">
                                <i class="ph ${weatherIcon} text-2xl md:text-3xl text-yellow-300 drop-shadow-md"></i>
                                <span class="text-sm md:text-base mt-0.5 font-bold tracking-wide whitespace-nowrap text-white">${escapeHtml(data.weather.temp)}</span>
                            </div>
                            <!-- 箭頭 -->
                            <div class="flex items-center justify-center w-12 md:w-14 bg-white/5 border-l border-white/10">
                                <i class="ph ph-caret-down text-white text-xl md:text-2xl transition-transform duration-500 chevron-icon ${chevronClass}"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 卡片內容區 (展開/收合) -->
                    <div class="card-content bg-gradient-custom ${contentClass}">
                        <!-- 圖片區塊 (置中、靜態縮放、移除動態 hover 效果) -->
                        <div class="w-full h-48 md:h-64 overflow-hidden relative border-b border-gray-200/50 bg-[#e3dfd3]">
                            <img src="${image}" alt="${title}" class="w-full h-full object-cover object-center block" loading="lazy" />
                            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
                        </div>

                        <div class="p-4 md:p-8">
                            ${flightsHtml}
                            ${specialNotesHtml}
                            
                            <div class="mb-8 mt-2">
                                ${spotsHtml}
                            </div>
                            
                            ${infoBottomHtml}
                            
                            <div class="tips-note mt-6 md:mt-8 text-white/95 p-4 md:p-5 rounded-lg text-base md:text-lg flex gap-3 items-start tracking-wide leading-relaxed">
                                <i class="ph ph-lightbulb text-yellow-300 text-2xl md:text-3xl shrink-0 mt-0.5 drop-shadow"></i>
                                <p><b class="font-bold text-white mr-1 tracking-widest block md:inline mb-1 md:mb-0">TIPS｜</b>${escapeHtml(data.tips)}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        const listContainer = document.getElementById('itinerary-list');
        
        // 渲染所有卡片
        itineraryData.forEach((data, index) => {
            listContainer.innerHTML += createCard(data, index);
        });

        const spotNoteDialog = document.getElementById('spot-note-dialog');
        listContainer.addEventListener('click', (event) => {
            const button = event.target.closest('[data-spot-note]');
            if (!button) return;
            const day = itineraryData[Number(button.dataset.dayIndex)];
            const spot = day?.spots?.[Number(button.dataset.spotIndex)];
            const parts = typeof spot === 'string' ? spot.split(' ｜ ') : [];
            const name = typeof spot === 'string' ? parts[0] : spot?.name;
            const note = typeof spot === 'string' ? day?.spotNotes?.[Number(button.dataset.spotIndex)] : spot?.note;
            document.getElementById('spot-note-title').textContent = name ? `${name} 備註` : '景點備註';
            document.getElementById('spot-note-content').textContent = note || '';
            spotNoteDialog.showModal();
        });
        document.getElementById('spot-note-close').addEventListener('click', () => spotNoteDialog.close());
        spotNoteDialog.addEventListener('click', (event) => {
            if (event.target === spotNoteDialog) spotNoteDialog.close();
        });

        // 展開/收合卡片的邏輯
        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            const content = card.querySelector('.card-content');
            const chevron = card.querySelector('.chevron-icon');
            
            // 如果當前是關閉的，就打開它
            if (!content.classList.contains('open')) {
                content.classList.add('open');
                chevron.classList.add('rotate-180');
            } else {
                // 如果當前是打開的，就關閉它
                content.classList.remove('open');
                chevron.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>
