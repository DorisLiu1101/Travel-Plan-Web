<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程規劃</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
    
    <script>
        /* 色彩系統設定 (支援 2610.json 動態 CSS 變數，完美相容 /opacity 語法) */
        function withOpacity(varName) {
            return ({ opacityValue }) => {
                if (opacityValue !== undefined) {
                    return `rgba(var(${varName}-rgb), ${opacityValue})`;
                }
                return `var(${varName})`;
            };
        }

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['var(--font-body)', '"Noto Sans TC"', 'sans-serif'],
                        serif: ['var(--font-title)', '"Playfair Display"', 'serif'],
                        title: ['var(--font-title)', 'serif'],
                        body: ['var(--font-body)', 'sans-serif'],
                        badge: ['var(--font-badge)', 'sans-serif'],
                    },
                    fontSize: {
                        hero: 'var(--font-hero)',
                        heading: 'var(--font-heading)',
                        body: 'var(--font-body)',
                        small: 'var(--font-small)',
                        badge: 'var(--font-badge)',
                    },
                    colors: {
                        moss: {
                            100: withOpacity('--color-bg'),
                            200: withOpacity('--color-line'),
                            300: withOpacity('--color-accent'),
                            400: withOpacity('--color-primary'),
                            500: withOpacity('--color-deep'),
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* 預設色彩變數 (將由 2610.json settings 動態覆寫) */
            --color-bg: #F4EFD9;
            --color-line: #D8D2A7;
            --color-accent: #A9B482;
            --color-primary: #6F7F5A;
            --color-deep: #3C4733;

            --color-bg-rgb: 244, 239, 217;
            --color-line-rgb: 216, 210, 167;
            --color-accent-rgb: 169, 180, 130;
            --color-primary-rgb: 111, 127, 90;
            --color-deep-rgb: 60, 71, 51;

            /* 🔤 三大字型風格變數 (大標題 / 內文 / 徽章) */
            --font-title: "Noto Sans TC", sans-serif;
            --font-body: "Noto Sans TC", sans-serif;
            --font-badge: "DM Sans", "Noto Sans TC", sans-serif;

            --font-sans: var(--font-body);
            --font-serif: var(--font-title);

            --font-hero: 40px;
            --font-heading: 22px;
            --font-body: 17px;
            --font-small: 14px;
            --font-badge: 12px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
        ::selection {
            background-color: transparent;
        }
        ::-moz-selection {
            background-color: transparent;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-deep);
            font-family: var(--font-body);
            scroll-behavior: smooth;
        }

        /* 響應式字級輔助類別 (由 typography 動態控制) */
        .text-hero { font-size: var(--font-hero) !important; line-height: 1.25 !important; font-family: var(--font-title); }
        .text-heading { font-size: var(--font-heading) !important; line-height: 1.4 !important; font-family: var(--font-title); }
        .text-body { font-size: var(--font-body) !important; line-height: 1.6 !important; font-family: var(--font-body); }
        .text-small { font-size: var(--font-small) !important; line-height: 1.5 !important; font-family: var(--font-body); }
        .text-badge { font-size: var(--font-badge) !important; line-height: 1.25 !important; font-family: var(--font-badge); }

        /* 隱藏水平溢出的滑動軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 全域客製化拉 BAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 4px; border: 2px solid var(--color-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        dialog::backdrop {
            background-color: rgba(var(--color-deep-rgb), 0.4);
            backdrop-filter: blur(4px);
        }
        .glass-panel {
            background-color: var(--color-bg);
            opacity: 0.95;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--color-line);
            box-shadow: 0 4px 20px rgba(var(--color-deep-rgb), 0.05);
        }
        .sidebar-collapsed {
            width: 5rem !important;
        }
        .sidebar-collapsed .nav-text {
            display: none !important;
            opacity: 0 !important;
        }
        .sidebar-collapsed .nav-item {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        .nav-item.active {
            background-color: var(--color-primary) !important;
            color: var(--color-bg) !important;
            box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.3) !important;
        }
        .nav-item.active .nav-icon {
            background-color: var(--color-deep) !important;
            color: var(--color-bg) !important;
        }
        .spot-card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-line);
            box-shadow: 0 1px 3px rgba(var(--color-deep-rgb), 0.05);
            transition: all 0.3s ease;
        }
        .spot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(var(--color-deep-rgb), 0.08);
        }
        .mobile-bottom-bar {
            box-shadow: 0 -4px 20px rgba(var(--color-deep-rgb), 0.08);
        }

        /* 🏙️ 城市卡片 3D 翻轉效果 */
        .city-flip-card {
            perspective: 1000px;
        }
        .city-flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .city-flip-card.is-flipped .city-flip-card-inner {
            transform: rotateY(180deg);
        }
        .city-flip-card-front,
        .city-flip-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 2rem;
            overflow: hidden;
        }
        .city-flip-card-back {
            transform: rotateY(180deg);
        }

        /* 🥚 彩蛋卡片 3D 翻轉效果 */
        .egg-flip-card {
            perspective: 1000px;
        }
        .egg-flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .egg-flip-card.is-flipped .egg-flip-card-inner {
            transform: rotateY(180deg);
        }
        .egg-flip-card-front,
        .egg-flip-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .egg-flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="antialiased relative selection:bg-transparent">

    <!-- 頂部主視覺 (Hero) -->
    <header id="hero" class="relative w-full h-[40vh] md:h-[50vh] bg-cover bg-center transition-all duration-500 bg-moss-300">
        <div class="absolute inset-0 bg-gradient-to-t from-moss-500/90 via-moss-500/30 to-transparent"></div>
        <div class="absolute bottom-12 md:bottom-16 left-0 w-full px-4 md:px-12 max-w-7xl mx-auto">
            <div class="mb-3 flex items-center gap-3 text-moss-100/90 text-small font-black tracking-widest uppercase">
                <span id="ui-hero-date">--</span>
                <span class="w-1.5 h-1.5 rounded-full bg-moss-300"></span>
                <span id="ui-hero-days">-- DAYS</span>
            </div>
            <h1 id="ui-hero-title" class="text-hero font-serif font-black text-moss-100 mb-4 tracking-wide drop-shadow-lg">載入中...</h1>
            <p id="ui-subtitle" class="text-moss-100/80 text-body font-bold flex items-center gap-2">
                <i class="ph ph-spinner animate-spin"></i> 正在讀取資料
            </p>
        </div>
    </header>

    <!-- [PC 端專屬] 橫向主頁籤 (Sticky Navbar) -->
    <div class="hidden md:flex sticky top-0 z-40 bg-moss-100/90 backdrop-blur-lg border-b border-moss-300/30 w-full shadow-sm">
        <div class="max-w-7xl mx-auto px-12 flex items-center justify-start gap-6 overflow-x-auto no-scrollbar py-3">
            <button onclick="switchMainTab('tab-overview')" id="btn-pc-tab-overview" class="main-tab-btn-pc bg-moss-500 text-moss-100 shadow-md flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0 active">
                <i class="ph ph-compass text-xl"></i> 總覽
            </button>
            <button onclick="switchMainTab('tab-itinerary')" id="btn-pc-tab-itinerary" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0">
                <i class="ph ph-map-trifold text-xl"></i> 行程
            </button>
            <button onclick="switchMainTab('tab-info')" id="btn-pc-tab-info" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0">
                <i class="ph ph-info text-xl"></i> 資訊
            </button>
            <button onclick="switchMainTab('tab-expenses')" id="btn-pc-tab-expenses" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0">
                <i class="ph ph-coin text-xl"></i> 經費
            </button>
            <button onclick="switchMainTab('tab-todo')" id="btn-pc-tab-todo" class="main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0">
                <i class="ph ph-check-square text-xl"></i> 待辦
            </button>
        </div>
    </div>

    <!-- 頁面主要容器 -->
    <div class="max-w-7xl mx-auto px-4 md:px-12 py-8 pb-24 md:pb-8 w-full min-h-[60vh] relative">
        
        <!-- 1. 總覽 (Overview) -->
        <main id="tab-overview" class="main-content-pane block space-y-8 animate-[rise_0.3s_ease-out]">
            
            <!-- 城市卡片區塊 (置頂) -->
            <div id="overview-city-cards-section" class="w-full">
                <!-- 橫滑吸附容器 -->
                <div id="overview-city-cards" class="flex gap-4 overflow-x-auto pb-6 no-scrollbar snap-x snap-mandatory">
                    <!-- 動態生成城市卡片 -->
                </div>
            </div>

            <!-- 總覽地圖區塊 (置於城市卡片下方) -->
            <div id="overview-map-container" class="w-full rounded-[2rem] overflow-hidden shadow-sm border border-moss-200 bg-moss-200/40 relative hidden" style="position: relative !important; overflow: hidden !important;">
                <!-- iframe 或自適應圖片將於 JS 動態寫入 -->
            </div>

        </main>

        <!-- 2. 行程 (Itinerary) -->
        <main id="tab-itinerary" class="main-content-pane hidden animate-[rise_0.3s_ease-out]">
            <div class="flex flex-col md:flex-row gap-8 items-start w-full relative">
                
                <nav id="itinerary-mobile-nav" class="md:hidden sticky top-4 z-30 glass-panel rounded-full p-1.5 flex overflow-x-auto no-scrollbar gap-1 w-full shadow-sm"></nav>

                <nav id="itinerary-sidebar" class="hidden md:flex flex-col sticky top-24 z-30 w-64 glass-panel rounded-2xl p-4 transition-all duration-300 ease-in-out shrink-0">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <span class="nav-text text-small font-black text-moss-400 tracking-widest uppercase">目錄 Navigation</span>
                        <button id="toggle-sidebar" class="w-8 h-8 rounded-full hover:bg-moss-200 flex items-center justify-center text-moss-500 transition-colors">
                            <i class="ph ph-caret-left text-lg toggle-icon font-bold"></i>
                        </button>
                    </div>
                    <div id="pc-nav-links" class="flex flex-col gap-1"></div>
                </nav>

                <div id="itinerary-content" class="flex-1 w-full flex flex-col">
                    <!-- 動態生成每日行程 -->
                </div>
            </div>
        </main>

        <!-- 3. 資訊 (Info: 飯店資訊 / 行程備忘 / 急難救助) -->
        <main id="tab-info" class="main-content-pane hidden space-y-6 animate-[rise_0.3s_ease-out]">
            <!-- 資訊頁面頂部選單膠囊切換 -->
            <div class="glass-panel rounded-full p-1.5 flex items-center justify-start gap-1 border border-moss-200 shadow-sm w-max max-w-full">
                <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
                    <button type="button" id="btn-front-info-hotels" onclick="switchFrontInfoSubtab('hotels')" class="front-info-subtab-btn px-5 py-2 rounded-full text-body font-bold transition-all bg-moss-400 text-moss-100 shadow-sm flex items-center gap-2 shrink-0 select-none">
                        <i class="ph ph-bed text-lg"></i>
                        <span>飯店資訊</span>
                    </button>
                    <button type="button" id="btn-front-info-memo" onclick="switchFrontInfoSubtab('memo')" class="front-info-subtab-btn px-5 py-2 rounded-full text-body font-bold transition-all text-moss-500 hover:bg-moss-200/50 flex items-center gap-2 shrink-0 select-none">
                        <i class="ph ph-note-pencil text-lg"></i>
                        <span>行程備忘</span>
                    </button>
                    <button type="button" id="btn-front-info-emergency" onclick="switchFrontInfoSubtab('emergency')" class="front-info-subtab-btn px-5 py-2 rounded-full text-body font-bold transition-all text-moss-500 hover:bg-moss-200/50 flex items-center gap-2 shrink-0 select-none">
                        <i class="ph ph-first-aid text-lg"></i>
                        <span>急難救助</span>
                    </button>
                </div>
            </div>

            <!-- 子面板 1: 飯店資訊 (Hotels) -->
            <div id="front-info-hotels-section">
                <div id="front-info-hotels-container" class="space-y-3">
                    <!-- 由 JS 動態渲染各晚飯店資訊卡片 -->
                </div>
            </div>

            <!-- 子面板 2: 行程備忘 (Memo) -->
            <div id="front-info-memo-section" class="hidden">
                <div id="front-info-memo-content" class="text-body font-medium text-moss-500 leading-relaxed whitespace-pre-line bg-moss-100 p-6 md:p-8 rounded-2xl border border-moss-200 shadow-2xs">
                    <!-- 由 JS 動態帶入 settings.memo -->
                </div>
            </div>

            <!-- 子面板 3: 急難救助 (Emergency) -->
            <div id="front-info-emergency-section" class="hidden">
                <div id="front-info-emergency-content" class="text-body font-medium text-moss-500 leading-relaxed whitespace-pre-line bg-moss-100 p-6 md:p-8 rounded-2xl border border-moss-200 shadow-2xs">
                    <!-- 由 JS 動態帶入 settings.emergency -->
                </div>
            </div>
        </main>

        <!-- 4. 經費 (Expenses) -->
        <main id="tab-expenses" class="main-content-pane hidden space-y-8 animate-[rise_0.3s_ease-out]">
            <div class="bg-moss-100 rounded-2xl p-6 md:p-8 border border-moss-200 shadow-sm">
                <h3 class="text-heading font-black text-moss-500 mb-6 flex items-center gap-2"><i class="ph ph-chart-pie-slice text-2xl text-moss-400"></i> 經費儀表板</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-moss-200/40 p-4 rounded-xl border border-moss-200">
                        <p class="text-small text-moss-400 font-black tracking-widest mb-1.5 uppercase">每人預估團費</p>
                        <p id="ui-expense-fee" class="text-heading font-black text-moss-500 leading-none font-mono">--</p>
                        <p id="ui-expense-note" class="text-small font-bold text-moss-400 mt-2 hidden"></p>
                    </div>
                    <div class="bg-moss-200/40 p-4 rounded-xl border border-moss-200">
                        <p class="text-small text-moss-400 font-black tracking-widest mb-1.5 uppercase">已記帳總支出</p>
                        <p id="ui-expense-spent" class="text-heading font-black text-moss-500 leading-none font-mono">--</p>
                    </div>
                    <div class="bg-moss-200/40 p-4 rounded-xl border border-moss-200">
                        <p class="text-small text-moss-400 font-black tracking-widest mb-1.5 uppercase">預估剩餘額度</p>
                        <p id="ui-expense-remain" class="text-heading font-black text-moss-500 leading-none font-mono">--</p>
                    </div>
                </div>
                <!-- 記帳明細清單 -->
                <div id="ui-expense-records-section" class="mt-8 pt-6 border-t border-moss-200/80 hidden">
                    <h4 class="text-heading font-bold text-moss-500 mb-4 flex items-center gap-2">
                        <i class="ph ph-receipt text-lg text-moss-400"></i> 開銷記帳明細列表
                    </h4>
                    <div id="ui-expense-records-container" class="space-y-2">
                        <!-- 由 JS 動態產生 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- 4. 待辦 (TODO) -->
        <main id="tab-todo" class="main-content-pane hidden space-y-8 animate-[rise_0.3s_ease-out]">
            <div class="bg-moss-100 rounded-2xl p-6 md:p-8 border border-moss-200 shadow-sm border-l-4 border-l-moss-400">
                <div class="flex items-center gap-2 mb-8">
                    <h3 class="text-heading font-black text-moss-500 flex items-center gap-2"><i class="ph ph-check-square text-2xl text-moss-400"></i> 行程待辦事項</h3>
                    <div class="relative group cursor-pointer flex items-center justify-center">
                        <i class="ph ph-info text-moss-300 text-lg hover:text-moss-500 transition-colors"></i>
                        <div class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-56 p-3 bg-moss-500 text-moss-100 text-small rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all pointer-events-none z-10 text-center shadow-lg leading-relaxed font-medium">
                            此清單與每日景點的待辦狀態雙向連動，方便您集中管理任務進度。
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-moss-500 rotate-45"></div>
                        </div>
                    </div>
                </div>
                
                <div id="todo-list-container" class="space-y-6">
                    <!-- 待辦清單動態生成 -->
                </div>
            </div>
        </main>
        
    </div>

    <!-- [手機端專屬] App 底部導航列 -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-moss-100/95 backdrop-blur-lg border-t border-moss-300/40 pt-1 pb-2.5 mobile-bottom-bar">
        <div class="flex justify-around items-center px-1">
            <button onclick="switchMainTab('tab-overview')" id="btn-mob-tab-overview" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-500 transition-all duration-200 active scale-105 drop-shadow-xs">
                <i class="ph ph-compass text-xl"></i>
                <span class="text-[11px] font-black leading-none tracking-tight">總覽</span>
            </button>
            <button onclick="switchMainTab('tab-itinerary')" id="btn-mob-tab-itinerary" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-map-trifold text-xl"></i>
                <span class="text-[11px] font-black leading-none tracking-tight">行程</span>
            </button>
            <button onclick="switchMainTab('tab-info')" id="btn-mob-tab-info" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-info text-xl"></i>
                <span class="text-[11px] font-black leading-none tracking-tight">資訊</span>
            </button>
            <button onclick="switchMainTab('tab-expenses')" id="btn-mob-tab-expenses" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-coin text-xl"></i>
                <span class="text-[11px] font-black leading-none tracking-tight">經費</span>
            </button>
            <button onclick="switchMainTab('tab-todo')" id="btn-mob-tab-todo" class="main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-400/60 hover:text-moss-400 transition-all duration-200">
                <i class="ph ph-check-square text-xl"></i>
                <span class="text-[11px] font-black leading-none tracking-tight">待辦</span>
            </button>
        </div>
    </div>

    <!-- 彈窗 (Modal) -->
    <dialog id="info-modal" class="bg-moss-100 rounded-[2rem] shadow-2xl p-0 w-[90%] max-w-md m-auto open:animate-[rise_0.3s_ease-out] border-2 border-moss-200 overflow-hidden relative">
        <div class="absolute top-0 left-0 w-full h-24 bg-moss-300/20"></div>
        <button onclick="closeModalByBtn()" class="absolute top-5 right-5 w-8 h-8 bg-moss-100 hover:bg-moss-400 hover:text-moss-100 rounded-full flex items-center justify-center text-moss-400 transition-colors z-20 shadow-sm border border-moss-200">
            <i class="ph ph-x font-bold text-sm"></i>
        </button>
        <div class="p-8 relative z-10 pt-10">
            <div class="flex flex-col items-center text-center gap-4 mb-6 pb-6 border-b border-moss-300/40">
                <div class="w-14 h-14 bg-moss-200/50 rounded-2xl shadow-sm border border-moss-200 flex items-center justify-center">
                    <i id="modal-icon" class="text-3xl text-moss-400"></i>
                </div>
                <h3 id="modal-title" class="text-heading font-black text-moss-500 tracking-wide"></h3>
            </div>
            <p id="modal-content" class="text-moss-500 font-medium leading-relaxed text-body whitespace-pre-line text-center"></p>
        </div>
    </dialog>

    <script>
        /* ================= 切換主頁籤邏輯 ================= */
        function switchMainTab(tabId) {
            document.querySelectorAll('.main-content-pane').forEach(el => el.classList.add('hidden'));
            const targetTab = document.getElementById(tabId);
            if(targetTab) targetTab.classList.remove('hidden');
            
            // PC 樣式切換 (保留 hidden 狀態)
            document.querySelectorAll('.main-tab-btn-pc').forEach(btn => {
                const isActive = (btn.id === 'btn-pc-' + tabId);
                const isHidden = btn.classList.contains('hidden');
                btn.className = isActive
                    ? "main-tab-btn-pc bg-moss-500 text-moss-100 shadow-md flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0 active"
                    : "main-tab-btn-pc bg-transparent text-moss-500 hover:bg-moss-200/60 flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-body transition-all shrink-0";
                if (isHidden) btn.classList.add('hidden');
            });

            // 手機底部樣式切換 (保留 hidden 狀態，加強未選與點選的對比度，縮小文字間隔)
            document.querySelectorAll('.main-tab-btn-mob').forEach(btn => {
                const isActive = (btn.id === 'btn-mob-' + tabId);
                const isHidden = btn.classList.contains('hidden');
                btn.className = isActive
                    ? "main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-500 transition-all duration-200 active scale-105 drop-shadow-xs"
                    : "main-tab-btn-mob flex flex-col items-center justify-center gap-0.5 py-1 w-14 text-moss-400/60 hover:text-moss-400 transition-all duration-200";
                if (isHidden) btn.classList.add('hidden');
            });

            // 確保依據 settings.visibleTabs 嚴格維持頁籤隱藏狀態
            const visibleTabs = window.currentSiteSettings?.visibleTabs;
            if (Array.isArray(visibleTabs) && visibleTabs.length > 0) {
                const tabSet = new Set(visibleTabs);
                ['overview', 'itinerary', 'info', 'expenses', 'todo'].forEach(id => {
                    if (!tabSet.has(id)) {
                        document.getElementById(`btn-pc-tab-${id}`)?.classList.add('hidden');
                        document.getElementById(`btn-mob-tab-${id}`)?.classList.add('hidden');
                    }
                });
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }


        /* ================= 彈窗與收合邏輯 ================= */
        const modal = document.getElementById('info-modal');

        function openModal(title, content) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-icon').className = 'text-3xl text-moss-400 ph ph-info';
            document.getElementById('modal-content').innerHTML = content;
            modal.showModal();
            // 推入瀏覽器歷史狀態，阻斷上一頁直接跳出
            history.pushState({ modalOpen: true }, "");
        }

        // 綁定 X 按鈕
        function closeModalByBtn() {
            if(history.state && history.state.modalOpen) {
                history.back(); // 會觸發 popstate 事件來關閉
            } else {
                modal.close();
            }
        }

        // 監聽網頁上一頁事件 (或是透過 history.back() 觸發)
        window.addEventListener('popstate', (e) => {
            if (modal.hasAttribute('open')) {
                modal.close();
            }
        });

        // 監聽原生 ESC 取消事件
        modal.addEventListener('cancel', (e) => {
            if(history.state && history.state.modalOpen) {
                history.back();
            }
        });

        // 點擊事件代理
        document.addEventListener('click', (e) => {
            const noteBtn = e.target.closest('.btn-note');
            if (noteBtn) {
                openModal(noteBtn.getAttribute('data-title') || '備註資訊', decodeURIComponent(noteBtn.getAttribute('data-content')));
            }

            // 彩蛋卡片 3D 翻轉切換 (單一翻開：翻開另一張時，原先那一張自動翻回)
            const eggCard = e.target.closest('.egg-flip-card');
            if (eggCard) {
                const wasFlipped = eggCard.classList.contains('is-flipped');
                document.querySelectorAll('.egg-flip-card.is-flipped').forEach(c => {
                    if (c !== eggCard) c.classList.remove('is-flipped');
                });
                if (wasFlipped) {
                    eggCard.classList.remove('is-flipped');
                } else {
                    eggCard.classList.add('is-flipped');
                }
            }
        });

        const toggleBtn = document.getElementById('toggle-sidebar');
        const toggleIcon = document.querySelector('.toggle-icon');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const sidebar = document.getElementById('itinerary-sidebar');
                sidebar.classList.toggle('sidebar-collapsed');
                if (sidebar.classList.contains('sidebar-collapsed')) {
                    toggleIcon.classList.remove('ph-caret-left');
                    toggleIcon.classList.add('ph-list');
                } else {
                    toggleIcon.classList.remove('ph-list');
                    toggleIcon.classList.add('ph-caret-left');
                }
            });
        }

        window.travelItineraryData = null; // store for re-renders

        function renderTodos(itineraryData) {
            window.travelItineraryData = itineraryData;
            const container = document.getElementById('todo-list-container');
            if (!container) return;
            
            const savedTodos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
            
            let pendingHtml = '';
            let completedHtml = '';
            let pendingCount = 0;
            let completedCount = 0;

            const generateTaskHtml = (todoObj, tIdx, prefixTitle, isSpot, dayIndex, spotIndex) => {
                const task = typeof todoObj === 'string' ? todoObj : todoObj.task;
                const note = (typeof todoObj === 'object' && todoObj.note) ? ` <span class="text-small font-normal opacity-80 ml-1">(${todoObj.note})</span>` : '';
                const todoId = isSpot ? `todo-${dayIndex}-${spotIndex}-${tIdx}` : `todo-day-${dayIndex}-${tIdx}`;
                const globalTodoId = `global-${todoId}`;
                const isChecked = !!savedTodos[todoId];
                
                const itemHtml = `
                    <label class="flex items-start gap-2 cursor-pointer group p-1.5 md:p-2 rounded-lg hover:bg-moss-200/50 transition-colors border border-transparent hover:border-moss-200/50 w-full ${isChecked ? 'grayscale opacity-60' : ''}">
                        <input type="checkbox" id="${globalTodoId}" data-target="${todoId}" class="global-todo-cb peer sr-only" ${isChecked ? 'checked' : ''}>
                        <div class="w-4 h-4 md:w-5 md:h-5 shrink-0 rounded border-2 flex items-center justify-center transition-all mt-0.5 shadow-sm ${isChecked ? 'border-moss-300 bg-moss-300' : 'border-moss-300 peer-checked:bg-moss-400 peer-checked:border-moss-400'}">
                            <i class="ph ph-check text-moss-100 opacity-0 peer-checked:opacity-100 font-bold text-xs md:text-sm"></i>
                        </div>
                        <div class="flex flex-col flex-1 min-w-0">
                            <span class="text-small font-black text-moss-400 mb-0.5 tracking-wider truncate">${prefixTitle}</span>
                            <span class="text-body font-bold transition-colors break-words ${isChecked ? 'text-moss-400 line-through' : 'text-moss-500 peer-checked:text-moss-400/60 peer-checked:line-through'}">${task}${note}</span>
                        </div>
                    </label>
                `;
                
                if (isChecked) {
                    completedHtml += itemHtml;
                    completedCount++;
                } else {
                    return itemHtml;
                }
                return '';
            };

            itineraryData.forEach((day, index) => {
                let dayPendingHtml = '';
                
                if (day.todos && day.todos.length > 0) {
                    day.todos.forEach((todoObj, tIdx) => {
                        const item = generateTaskHtml(todoObj, tIdx, `D${index+1} ｜ 本日待辦`, false, index, null);
                        if(item) { dayPendingHtml += item; pendingCount++; }
                    });
                }

                if (day.spots) {
                    day.spots.forEach((spot, spotIndex) => {
                        if (spot.todos && spot.todos.length > 0) {
                            spot.todos.forEach((todoObj, tIdx) => {
                                const item = generateTaskHtml(todoObj, tIdx, `D${index+1} ｜ ${spot.name}`, true, index, spotIndex);
                                if(item) { dayPendingHtml += item; pendingCount++; }
                            });
                        }
                    });
                }
                
                if (dayPendingHtml) {
                    if (pendingHtml !== '') {
                        pendingHtml += '<hr class="border-moss-200 border-dashed my-3 opacity-60">';
                    }
                    pendingHtml += `<div class="space-y-0.5">${dayPendingHtml}</div>`;
                }
            });

            let html = '';
            if (pendingCount > 0) {
                html += `<div class="mb-6 bg-moss-200/35 p-3 rounded-xl border border-moss-200/60">${pendingHtml}</div>`;
            } else if (completedCount === 0) {
                html += `<p class="text-body text-moss-400 font-medium py-8 text-center bg-moss-100 rounded-xl border border-moss-200 border-dashed mb-6">目前沒有任何待辦事項</p>`;
            } else {
                html += `<p class="text-body text-moss-400 font-medium py-6 text-center bg-moss-100 rounded-xl border border-moss-200 border-dashed mb-6">所有待辦事項皆已完成 🎉</p>`;
            }

            const wasCompletedOpen = document.getElementById('details-completed-todos')?.hasAttribute('open');
            if (completedCount > 0) {
                html += `
                    <details id="details-completed-todos" class="group bg-moss-100 border border-moss-200 rounded-2xl p-4 transition-all duration-300" ${wasCompletedOpen ? 'open' : ''}>
                        <summary class="flex justify-between items-center cursor-pointer list-none font-black text-moss-400 text-body opacity-80 hover:opacity-100 transition-opacity">
                            <span class="flex items-center gap-2"><i class="ph ph-check-circle text-xl"></i> 已完成項目 (${completedCount})</span>
                            <div class="w-8 h-8 rounded-full bg-moss-200/50 flex items-center justify-center text-moss-500 group-open:rotate-180 transition-transform"><i class="ph ph-caret-down font-bold"></i></div>
                        </summary>
                        <div class="mt-4 pt-4 border-t border-moss-200/80 space-y-0.5">
                            ${completedHtml}
                        </div>
                    </details>
                `;
            }

            container.innerHTML = html;
        }

        /* 🔄 同步行程中的待辦膠囊顯隱 (已完成直接隱藏，未完成則顯示) */
        function syncTodoVisibility() {
            const savedTodos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
            
            document.querySelectorAll('.spot-todo-cb').forEach(cb => {
                const isChecked = !!savedTodos[cb.id];
                cb.checked = isChecked;
                const label = cb.closest('label');
                if (label) {
                    if (isChecked) {
                        label.classList.add('hidden');
                    } else {
                        label.classList.remove('hidden');
                    }
                }
            });

            // 若群組中所有待辦均已完成隱藏，則一併隱藏外層容器避免殘留空白間距
            document.querySelectorAll('.todo-group-container').forEach(group => {
                const totalItems = group.querySelectorAll('label').length;
                const hiddenItems = group.querySelectorAll('label.hidden').length;
                if (totalItems > 0 && totalItems === hiddenItems) {
                    group.classList.add('hidden');
                } else {
                    group.classList.remove('hidden');
                }
            });
        }

        function initTodos() {
            syncTodoVisibility();
            
            document.querySelectorAll('.spot-todo-cb').forEach(cb => {
                const newCb = cb.cloneNode(true);
                cb.parentNode.replaceChild(newCb, cb);
                
                newCb.addEventListener('change', (e) => {
                    const id = e.target.id;
                    const isChecked = e.target.checked;
                    const todos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
                    todos[id] = isChecked;
                    localStorage.setItem('travel_todos', JSON.stringify(todos));
                    
                    syncTodoVisibility();
                    
                    if (window.travelItineraryData) {
                        renderTodos(window.travelItineraryData);
                        bindGlobalTodos();
                    }
                });
            });
        }

        function bindGlobalTodos() {
            document.querySelectorAll('.global-todo-cb').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.dataset.target;
                    const isChecked = e.target.checked;
                    const todos = JSON.parse(localStorage.getItem('travel_todos') || '{}');
                    todos[id] = isChecked;
                    localStorage.setItem('travel_todos', JSON.stringify(todos));
                    
                    syncTodoVisibility();
                    
                    if (window.travelItineraryData) {
                        renderTodos(window.travelItineraryData);
                        bindGlobalTodos();
                    }
                });
            });
        }

        /* ================= 資訊頁面 (Info: 飯店資訊 / 行程備忘 / 急難救助) ================= */
        let currentFrontInfoSubtab = 'hotels';
        function switchFrontInfoSubtab(subtab) {
            currentFrontInfoSubtab = subtab;
            const btnHotels = document.getElementById('btn-front-info-hotels');
            const btnMemo = document.getElementById('btn-front-info-memo');
            const btnEmergency = document.getElementById('btn-front-info-emergency');
            const secHotels = document.getElementById('front-info-hotels-section');
            const secMemo = document.getElementById('front-info-memo-section');
            const secEmergency = document.getElementById('front-info-emergency-section');

            const ACTIVE = 'front-info-subtab-btn px-5 py-2 rounded-full text-body font-bold transition-all bg-moss-400 text-moss-100 shadow-sm flex items-center gap-2 shrink-0 select-none';
            const INACTIVE = 'front-info-subtab-btn px-5 py-2 rounded-full text-body font-bold transition-all text-moss-500 hover:bg-moss-200/50 flex items-center gap-2 shrink-0 select-none';

            if (btnHotels) btnHotels.className = subtab === 'hotels' ? ACTIVE : INACTIVE;
            if (btnMemo) btnMemo.className = subtab === 'memo' ? ACTIVE : INACTIVE;
            if (btnEmergency) btnEmergency.className = subtab === 'emergency' ? ACTIVE : INACTIVE;

            if (secHotels) secHotels.classList.toggle('hidden', subtab !== 'hotels');
            if (secMemo) secMemo.classList.toggle('hidden', subtab !== 'memo');
            if (secEmergency) secEmergency.classList.toggle('hidden', subtab !== 'emergency');
        }

        function toggleHotelDrawer(idx, type) {
            const drawer = document.getElementById(`hotel-${type}-drawer-${idx}`);
            const btn = document.getElementById(`btn-hotel-${type}-${idx}`);
            const caret = document.getElementById(`caret-hotel-${type}-${idx}`);
            if (!drawer) return;
            const isHidden = drawer.classList.contains('hidden');
            if (isHidden) {
                drawer.classList.remove('hidden');
                if (btn) {
                    btn.classList.add('border-moss-500', 'bg-moss-200/25');
                    btn.classList.remove('border-moss-300/60');
                }
                if (caret) {
                    caret.classList.add('rotate-180');
                }
            } else {
                drawer.classList.add('hidden');
                if (btn) {
                    btn.classList.remove('border-moss-500', 'bg-moss-200/25');
                    btn.classList.add('border-moss-300/60');
                }
                if (caret) {
                    caret.classList.remove('rotate-180');
                }
            }
        }

        function renderFrontInfo(settings, itineraryData) {
            // 1. 渲染飯店
            const hotelContainer = document.getElementById('front-info-hotels-container');
            if (hotelContainer) {
                if (!Array.isArray(itineraryData) || itineraryData.length === 0) {
                    hotelContainer.innerHTML = '<p class="text-body text-moss-400 py-6 text-center">暫無行程住宿資料</p>';
                } else {
                    let hotelHtml = '';
                    itineraryData.forEach((day, idx) => {
                        const lodgingName = day.lodging ? String(day.lodging).trim() : '';
                        const bookingInfo = day.lodgingBooking ? String(day.lodgingBooking).trim() : '';
                        const lodgingInfo = day.lodgingInfo ? String(day.lodgingInfo).trim() : '';
                        const lodgingMap = day.lodgingMap ? String(day.lodgingMap).trim() : '';
                        const dayTag = day.day || `Day ${idx + 1}`;
                        const dateTag = day.fullDate || '';
                        const cityTag = day.city || '';

                        let mapTargetUrl = '';
                        if (lodgingMap) {
                            if (/^https?:\/\//i.test(lodgingMap)) {
                                mapTargetUrl = lodgingMap;
                            } else {
                                mapTargetUrl = getMapSearchUrl(lodgingMap, settings?.mapEngine);
                            }
                        }

                        hotelHtml += `
                            <div class="rounded-2xl border border-moss-200 bg-moss-100 overflow-hidden shadow-2xs select-none">
                                <!-- 每日表頭列 (獨立底色，選中不高亮) -->
                                <div class="px-4 py-2.5 bg-moss-200/50 border-b border-moss-200 flex items-center gap-2 flex-wrap select-none">
                                    <span class="px-2.5 py-0.5 rounded-lg bg-moss-500 text-moss-100 font-mono text-small font-black">
                                        ${escapeHtml(dayTag)}
                                    </span>
                                    ${dateTag ? `<span class="text-small font-bold text-moss-500">${escapeHtml(dateTag)}</span>` : ''}
                                    ${cityTag ? `<span class="text-small px-2.5 py-0.5 rounded-lg bg-moss-500 text-moss-100 font-bold">${escapeHtml(cityTag)}</span>` : ''}
                                </div>
                                
                                <!-- 飯店內容區 -->
                                <div class="p-4 md:p-5 space-y-3">
                                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pt-0.5">
                                        <div class="flex items-center gap-2 min-w-0 flex-1">
                                            <i class="ph ph-buildings text-xl text-moss-400 shrink-0"></i>
                                            <span class="text-body font-black text-moss-500 break-words select-text">
                                                ${escapeHtml(lodgingName || '夜泊機上 / 無下榻飯店')}
                                            </span>
                                        </div>
                                        ${(bookingInfo || lodgingInfo || mapTargetUrl) ? `
                                            <div class="flex items-center gap-1.5 shrink-0 self-start sm:self-auto flex-wrap">
                                                ${mapTargetUrl ? `
                                                    <a href="${escapeHtml(mapTargetUrl)}" target="_blank" rel="noopener noreferrer" title="開啟飯店地圖導航" class="hotel-action-btn w-8 h-8 rounded-xl border border-moss-300/60 bg-transparent hover:bg-moss-200/40 text-moss-500 flex items-center justify-center transition-all cursor-pointer active:scale-95 group">
                                                        <i class="ph ph-map-pin text-base text-moss-500 group-hover:text-moss-400 transition-colors"></i>
                                                    </a>
                                                ` : ''}
                                                ${(mapTargetUrl && (bookingInfo || lodgingInfo)) ? `<span class="text-moss-300/60 select-none hidden sm:inline">|</span>` : ''}
                                                ${bookingInfo ? `
                                                    <button type="button" onclick="toggleHotelDrawer(${idx}, 'booking')" title="預約資料 (點擊展開/收合)" id="btn-hotel-booking-${idx}" class="hotel-action-btn flex items-center gap-1.5 px-2.5 py-1 rounded-xl border border-moss-300/60 bg-transparent hover:bg-moss-200/40 text-moss-500 text-small font-bold transition-all cursor-pointer active:scale-95 select-none">
                                                        <i class="ph ph-ticket text-base text-moss-500 transition-colors"></i>
                                                        <span class="text-small">預約資料</span>
                                                        <i class="ph ph-caret-down text-xs text-moss-500 transition-transform duration-200" id="caret-hotel-booking-${idx}"></i>
                                                    </button>
                                                ` : ''}
                                                ${(bookingInfo && lodgingInfo) ? `<span class="text-moss-300/60 select-none hidden sm:inline">|</span>` : ''}
                                                ${lodgingInfo ? `
                                                    <button type="button" onclick="toggleHotelDrawer(${idx}, 'info')" title="聯絡資訊 (點擊展開/收合)" id="btn-hotel-info-${idx}" class="hotel-action-btn flex items-center gap-1.5 px-2.5 py-1 rounded-xl border border-moss-300/60 bg-transparent hover:bg-moss-200/40 text-moss-500 text-small font-bold transition-all cursor-pointer active:scale-95 select-none">
                                                        <i class="ph ph-phone text-base text-moss-500 transition-colors"></i>
                                                        <span class="text-small">聯絡資訊</span>
                                                        <i class="ph ph-caret-down text-xs text-moss-500 transition-transform duration-200" id="caret-hotel-info-${idx}"></i>
                                                    </button>
                                                ` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                    ${(bookingInfo || lodgingInfo) ? `
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                            ${bookingInfo ? `
                                                <div id="hotel-booking-drawer-${idx}" class="hidden p-3.5 rounded-xl bg-moss-300/15 border border-moss-300/35 text-small font-medium text-moss-500 whitespace-pre-line leading-relaxed break-all break-words overflow-hidden select-text animate-[rise_0.2s_ease-out] ${!lodgingInfo ? 'md:col-span-2' : ''}">${escapeHtml(bookingInfo.trim())}</div>
                                            ` : ''}
                                            ${lodgingInfo ? `
                                                <div id="hotel-info-drawer-${idx}" class="hidden p-3.5 rounded-xl bg-moss-300/15 border border-moss-300/35 text-small font-medium text-moss-500 whitespace-pre-line leading-relaxed break-all break-words overflow-hidden select-text animate-[rise_0.2s_ease-out] ${!bookingInfo ? 'md:col-span-2' : ''}">${escapeHtml(lodgingInfo.trim())}</div>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });
                    hotelContainer.innerHTML = hotelHtml;
                }
            }

            // 2. 渲染備忘
            const memoContainer = document.getElementById('front-info-memo-content');
            if (memoContainer) {
                if (settings?.memo && settings.memo.trim()) {
                    memoContainer.textContent = settings.memo;
                } else {
                    memoContainer.innerHTML = '<span class="text-moss-400 italic">尚無行程備忘事項</span>';
                }
            }

            // 3. 渲染急難救助
            const emergencyContainer = document.getElementById('front-info-emergency-content');
            if (emergencyContainer) {
                if (settings?.emergency && settings.emergency.trim()) {
                    emergencyContainer.textContent = settings.emergency;
                } else {
                    emergencyContainer.innerHTML = '<span class="text-moss-400 italic">尚無海外急難救助資訊</span>';
                }
            }
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const PRESET_THEMES = {
            moss:        { primary: '#6F7F5A', deep: '#3C4733', accent: '#A9B482', line: '#D8D2A7', bg: '#F4EFD9' },
            mountain:    { primary: '#4A6572', deep: '#2D3E50', accent: '#6B8E9E', line: '#9BB5C2', bg: '#F0F4F7' },
            sandalwood:  { primary: '#795548', deep: '#5D4037', accent: '#A1887F', line: '#D7CCC8', bg: '#F5F0E6' },
            cinnabar:    { primary: '#A62424', deep: '#5C3D3D', accent: '#8C5A5A', line: '#D9B8B8', bg: '#F5EBEB' },
            autumn:      { primary: '#AF7E22', deep: '#212410', accent: '#D9AF29', line: '#725B15', bg: '#FAF6EA' },
            // 相容舊名稱
            forest:      { primary: '#6F7F5A', deep: '#3C4733', accent: '#A9B482', line: '#D8D2A7', bg: '#F4EFD9' }
        };

        function hexToRgb(colorStr) {
            if (!colorStr) return { r: 49, g: 90, b: 76 };
            if (typeof colorStr === 'string' && colorStr.startsWith('rgb')) {
                const matches = colorStr.match(/\d+/g);
                if (matches && matches.length >= 3) {
                    return { r: Number(matches[0]), g: Number(matches[1]), b: Number(matches[2]) };
                }
            }
            let clean = String(colorStr || '').replace('#', '');
            if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
            const num = parseInt(clean, 16);
            if (isNaN(num)) return { r: 49, g: 90, b: 76 };
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        /* 🎨 動態色彩主題引擎 (Theme Engine - 5 階完整色票) */
        function applyTheme(settings) {
            let colors = settings?.themeColors || settings?.customTheme;
            if (!colors || !colors.primary) {
                const themeKey = settings?.theme || 'moss';
                colors = PRESET_THEMES[themeKey] || PRESET_THEMES.moss || PRESET_THEMES.forest;
            }

            const primary = colors.primary || '#6F7F5A';
            const deep = colors.deep || '#3C4733';
            const accent = colors.accent || '#A9B482';
            const bg = colors.bg || '#F4EFD9';

            // 優先讀取明確指定的 line (moss-200)；若舊格式未提供則退回混合計算，保證 100% 相容
            let line = colors.line;
            if (!line) {
                const pRgb = hexToRgb(primary);
                const bgRgb = hexToRgb(bg);
                const lineR = Math.round(pRgb.r * 0.25 + bgRgb.r * 0.75);
                const lineG = Math.round(pRgb.g * 0.25 + bgRgb.g * 0.75);
                const lineB = Math.round(pRgb.b * 0.25 + bgRgb.b * 0.75);
                line = `rgb(${lineR}, ${lineG}, ${lineB})`;
            }

            const root = document.documentElement;
            root.style.setProperty('--color-primary', primary);
            root.style.setProperty('--color-deep', deep);
            root.style.setProperty('--color-accent', accent);
            root.style.setProperty('--color-bg', bg);
            root.style.setProperty('--color-line', line);
            root.style.setProperty('--theme-primary', primary);
            root.style.setProperty('--theme-deep', deep);
            root.style.setProperty('--theme-accent', accent);
            root.style.setProperty('--bg-color', bg);

            const pRgbVal = hexToRgb(primary);
            const dRgbVal = hexToRgb(deep);
            const aRgbVal = hexToRgb(accent);
            const bgRgbVal = hexToRgb(bg);
            const lRgbVal = hexToRgb(line);
            root.style.setProperty('--color-primary-rgb', `${pRgbVal.r}, ${pRgbVal.g}, ${pRgbVal.b}`);
            root.style.setProperty('--color-deep-rgb', `${dRgbVal.r}, ${dRgbVal.g}, ${dRgbVal.b}`);
            root.style.setProperty('--color-accent-rgb', `${aRgbVal.r}, ${aRgbVal.g}, ${aRgbVal.b}`);
            root.style.setProperty('--color-bg-rgb', `${bgRgbVal.r}, ${bgRgbVal.g}, ${bgRgbVal.b}`);
            root.style.setProperty('--color-line-rgb', `${lRgbVal.r}, ${lRgbVal.g}, ${lRgbVal.b}`);

            // 瀏覽器主題顏色同步
            let metaTheme = document.querySelector('meta[name="theme-color"]');
            if (!metaTheme) {
                metaTheme = document.createElement('meta');
                metaTheme.name = 'theme-color';
                document.head.appendChild(metaTheme);
            }
            metaTheme.content = deep;
        }

        function applyTypography(settings) {
            const typo = settings?.typography || {};
            const isMobile = window.innerWidth < 768;

            // 1. 解析標題、內文、徽章三域字體代號 (相容舊版 typo.style)
            let titleKey = typo.fontTitle;
            let bodyKey = typo.fontBody;
            let badgeKey = typo.fontBadge;

            if (!titleKey || !bodyKey || !badgeKey) {
                const legacy = typo.style || 'modern';
                if (legacy === 'elegant') {
                    titleKey = titleKey || 'fashion';
                    bodyKey = bodyKey || 'editorial';
                    badgeKey = badgeKey || 'geometric';
                } else if (legacy === 'journal') {
                    titleKey = titleKey || 'japanese';
                    bodyKey = bodyKey || 'rounded';
                    badgeKey = badgeKey || 'ticket';
                } else if (legacy === 'reading') {
                    titleKey = titleKey || 'japanese';
                    bodyKey = bodyKey || 'reading';
                    badgeKey = badgeKey || 'geometric';
                } else if (legacy === 'playful') {
                    titleKey = titleKey || 'handwriting';
                    bodyKey = bodyKey || 'rounded';
                    badgeKey = badgeKey || 'geometric';
                } else {
                    titleKey = titleKey || 'modern';
                    bodyKey = bodyKey || 'standard';
                    badgeKey = badgeKey || 'geometric';
                }
            }

            const titleConfig = FONT_TITLE_MAP[titleKey] || FONT_TITLE_MAP.modern;
            const bodyConfig = FONT_BODY_MAP[bodyKey] || FONT_BODY_MAP.standard;
            const badgeConfig = FONT_BADGE_MAP[badgeKey] || FONT_BADGE_MAP.geometric;

            // 2. 動態引入 Google Fonts
            const googleQueries = [titleConfig.google, bodyConfig.google, badgeConfig.google].filter(Boolean);

                const fontUrl = `https://fonts.googleapis.com/css2?${googleQueries.join('&')}&display=swap`;

                if (!link) {
                    link = document.createElement('link');
                    link.id = 'dynamic-font-link';
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }
                if (link.href !== fontUrl) {
                    link.href = fontUrl;
                }
            }

            // 3. 設定 CSS 變數
            const root = document.documentElement;
            root.style.setProperty('--font-title', titleConfig.family);
            root.style.setProperty('--font-body', bodyConfig.family);
            root.style.setProperty('--font-badge', badgeConfig.family);
            root.style.setProperty('--font-sans', bodyConfig.family);

        function getMapSearchUrl(searchText, engine = 'google') {
            const query = encodeURIComponent(searchText);
            if (engine === 'amap') return `https://uri.amap.com/search?keyword=${query}`;
            if (engine === 'baidu') return `https://map.baidu.com/search/${query}`;
            return `https://www.google.com/maps/search/?api=1&query=${query}`;
        }

        function getTargetJsonPath() {
            try {
                const path = window.location.pathname;
                const fileName = path.substring(path.lastIndexOf('/') + 1);
                const baseName = fileName.replace(/\.[^/.]+$/, "");

                const urlParams = new URLSearchParams(window.location.search);
                const queryPlan = urlParams.get('plan') || urlParams.get('data');
                if (queryPlan) {
                    return queryPlan.endsWith('.json') ? queryPlan : `${queryPlan}.json`;
                }

                if (baseName && baseName !== 'Template' && baseName !== 'index') {
                    return `${baseName}.json`;
                }
            } catch (e) {}
            return '2610.json';
        }

        function calculateTripDays(settings, itineraryData) {
            // 優先嘗試從 settings.dateText 解析起訖日 (支援 2026/10/8 ~ 2026/10/18 或 2026/10/8 - 10/18 或 2026-10-08 至 2026-10-18 等)
            const dateText = String(settings?.dateText || '').trim();
            if (dateText) {
                // 找出所有連續日期結構 YYYY/MM/DD 或 MM/DD
                const matches = dateText.match(/(\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2})|(\d{1,2}[\/\-\.]\d{1,2})/g);
                if (matches && matches.length >= 2) {
                    let startStr = matches[0].replace(/[\-\.]/g, '/');
                    let endStr = matches[matches.length - 1].replace(/[\-\.]/g, '/');
                    // 若結束日未帶年份，自動補上起始日的年份
                    if (startStr.split('/').length === 3 && endStr.split('/').length === 2) {
                        const startYear = startStr.split('/')[0];
                        endStr = `${startYear}/${endStr}`;
                    }
                    const startDate = new Date(startStr);
                    const endDate = new Date(endStr);
                    if (!isNaN(startDate.getTime()) && !isNaN(endDate.getTime())) {
                        const diffTime = endDate.getTime() - startDate.getTime();
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
                        if (diffDays > 0) return diffDays;
                    }
                }
            }

            // 備援：從 itineraryData 第一天與最後一天的 fullDate 解析
            if (Array.isArray(itineraryData) && itineraryData.length > 0) {
                const firstDayStr = String(itineraryData[0]?.fullDate || '').match(/\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2}/)?.[0];
                const lastDayStr = String(itineraryData[itineraryData.length - 1]?.fullDate || '').match(/\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2}/)?.[0];
                if (firstDayStr && lastDayStr) {
                    const start = new Date(firstDayStr.replace(/[\-\.]/g, '/'));
                    const end = new Date(lastDayStr.replace(/[\-\.]/g, '/'));
                    if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
                        const diffDays = Math.round((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1;
                        if (diffDays > 0) return diffDays;
                    }
                }
                return itineraryData.length;
            }

            return '--';
        }

            const section = document.getElementById('overview-city-cards-section');
            if (!container) return;
            
            let cityList = [];
            if (Array.isArray(settings?.cities) && settings.cities.length > 0) {
                cityList = settings.cities;
            } else if (itineraryData && itineraryData.length > 0) {
                // 備援：若無 cities 設定，提取每日行程之城市作為後備
                const seenCities = new Set();
                itineraryData.forEach((day, idx) => {
                    const c = (day.city || '').trim();
                    if (c && !seenCities.has(c.toLowerCase())) {
                        seenCities.add(c.toLowerCase());
                        const zh = (c.match(/[\u4e00-\u9fa5]+/g) || []).join('');
                        cityList.push({
                            name: (zh && zh.length >= 2) ? zh : c,
                            desc: '行程精選',
                            tag: day.day || `Day ${idx + 1}`,
                            image: day.image || '',
                            detail: ''
                        });
                    }
                });
            }

            if (cityList.length === 0) {
                if (section) section.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            if (section) section.classList.remove('hidden');

            let html = '<div class="w-[calc(50%-8rem)] md:w-[calc(50%-9rem)] shrink-0 pointer-events-none"></div>';
            cityList.forEach(city => {
                const imgUrl = city.image || 'https://images.unsplash.com/photo-1549740425-5e9ed4d8cd34?q=80&w=800';
                const cleanDetail = (city.detail ? String(city.detail).trim() : '') || '暫無詳細說明';
                html += `
                <div class="city-flip-card w-64 md:w-72 shrink-0 aspect-[4/5] snap-center cursor-pointer select-none" data-action="flip-city-card">
                    <div class="city-flip-card-inner">
                        <!-- 正面: 圖片面 (僅顯示上排城市名稱、下排簡介) -->
                        <div class="city-flip-card-front shadow-sm border border-moss-200 bg-moss-200/50 group">
                            <img src="${escapeHtml(imgUrl)}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${escapeHtml(city.name || '')}">
                            <div class="absolute inset-0 bg-gradient-to-t from-moss-500/95 via-moss-500/30 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 w-full p-4 md:p-5 flex flex-col justify-end text-moss-100">
                                <h4 class="font-black text-heading truncate drop-shadow-md">${escapeHtml(city.name || '城市')}</h4>
                                ${city.desc ? `<p class="text-small font-medium tracking-wide mt-1 opacity-90 truncate drop-shadow-md">${escapeHtml(city.desc)}</p>` : ''}
                            </div>
                        </div>

                        <!-- 背面: 詳細說明面 (頂部顯示城市名稱，下方承接詳細介紹，不帶簡短副標) -->
                        <div class="city-flip-card-back shadow-md border border-moss-400/30 bg-moss-500 text-moss-100 p-5 md:p-6 flex flex-col justify-start">
                            <div class="border-b border-moss-400/50 pb-2 mb-3 shrink-0">
                                <h4 class="font-black text-heading text-moss-100 truncate">${escapeHtml(city.name || '城市')}</h4>
                            </div>
                            <div class="text-body font-medium leading-relaxed text-moss-100/95 overflow-y-auto no-scrollbar whitespace-pre-line flex-1 text-left">${escapeHtml(cleanDetail)}</div>
                        </div>
                    </div>
                </div>
                `;
            });
            html += '<div class="w-[calc(50%-8rem)] md:w-[calc(50%-9rem)] shrink-0 pointer-events-none"></div>';
            container.innerHTML = html;

            // 翻牌互動：點擊卡片翻面
            container.onclick = (e) => {
                const card = e.target.closest('.city-flip-card');
                if (!card) return;
                const isFlipped = card.classList.contains('is-flipped');
                // 先翻回其他所有已翻轉卡片
                container.querySelectorAll('.city-flip-card.is-flipped').forEach(c => {
                    if (c !== card) c.classList.remove('is-flipped');
                });
                // 切換當前卡片
                if (isFlipped) {
                    card.classList.remove('is-flipped');
                } else {
                    card.classList.add('is-flipped');
                }
            };

            // 自動回翻防呆：當使用者滑動橫滑容器（移至下一張卡片）時，自動翻回圖片面
            if (!container.dataset.flipBound) {
                container.dataset.flipBound = 'true';
                container.addEventListener('scroll', () => {
                    container.querySelectorAll('.city-flip-card.is-flipped').forEach(c => {
                        c.classList.remove('is-flipped');
                    });
                }, { passive: true });

                // 點擊容器外部時也翻回圖片面
                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        container.querySelectorAll('.city-flip-card.is-flipped').forEach(c => {
                            c.classList.remove('is-flipped');
                        });
                    }
                });
            }
        }

        function parseDailyMeals(day) {
            const list = [];
            if (Array.isArray(day.mealItems) && day.mealItems.length > 0) {
                day.mealItems.forEach(item => {
                    const text = (item.text || '').trim();
                    if (!text && !item.tag) return;
                    let tagCode = 'MEAL';
                    let label = item.tag || '餐飲';
                    if (/早/.test(label)) { tagCode = 'BFAST'; label = '早餐'; }
                    else if (/午/.test(label)) { tagCode = 'LUNCH'; label = '午餐'; }
                    else if (/晚/.test(label)) { tagCode = 'DINNER'; label = '晚餐'; }
                    else if (/點心|茶/.test(label)) { tagCode = 'SNACK'; label = '點心'; }
                    else if (/宵夜/.test(label)) { tagCode = 'LATE'; label = '宵夜'; }
                    list.push({ tagCode, label, text });
                });
            } else if (day.meals && String(day.meals).trim()) {
                const parts = String(day.meals).split(/\s*[\/\n]\s*/).map(s => s.trim()).filter(Boolean);
                parts.forEach(part => {
                    const match = part.match(/^(早|午|晚|早餐|午餐|晚餐|點心|宵夜|下午茶|茶)[:：\s-]\s*(.*)$/);
                    if (match) {
                        let tagCode = 'MEAL';
                        let label = match[1];
                        if (/早/.test(label)) { tagCode = 'BFAST'; label = '早餐'; }
                        else if (/午/.test(label)) { tagCode = 'LUNCH'; label = '午餐'; }
                        else if (/晚/.test(label)) { tagCode = 'DINNER'; label = '晚餐'; }
                        else if (/點心|茶/.test(label)) { tagCode = 'SNACK'; label = '點心'; }
                        else if (/宵夜/.test(label)) { tagCode = 'LATE'; label = '宵夜'; }
                        const cleanText = (match[2] || '').trim().replace(/^[-—:：]\s*/, '');
                        list.push({ tagCode, label, text: cleanText });
                    } else if (/飛機|機上/.test(part)) {
                        list.push({ tagCode: 'FLIGHT', label: '機上', text: part });
                    } else {
                        list.push({ tagCode: 'MEAL', label: '餐飲', text: part });
                    }
                });
            }
            return list;
        }

                                    <!-- 正面: 圖片/圖示面 (左上角圖示徽章，文字貼齊卡片寬度) -->
                                    <div class="egg-flip-card-front shadow-sm border border-moss-200 bg-moss-300/20 group overflow-hidden">
                                        ${item.image ? `<img src="${escapeHtml(item.image)}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">` : `<i class="ph ${itemIcon} text-[68px] text-moss-400/20 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform duration-700"></i>`}
                                        <div class="absolute inset-0 bg-gradient-to-t from-moss-500/90 via-moss-500/25 to-transparent"></div>
                                        
                                        <!-- 左上角圖示小徽章 -->
                                        <div class="absolute top-2.5 left-2.5 w-7 h-7 rounded-full bg-moss-500/80 backdrop-blur-xs text-moss-100 flex items-center justify-center text-sm shadow-sm z-10 border border-moss-300/30">
                                            <i class="ph ${itemIcon}"></i>
                                        </div>

                                        <!-- 底部文字區塊 (左右貼齊卡片寬度) -->
                                        <div class="absolute bottom-0 left-0 w-full p-2.5 md:p-3 flex flex-col justify-end text-moss-100 z-10">
                                            <h4 class="font-black text-small leading-snug drop-shadow-md whitespace-normal text-left break-words w-full">
                                                ${escapeHtml(item.name)}
                                            </h4>
                                        </div>
                                    </div>

                                    <!-- 背面: 詳細說明面 (點擊翻轉顯示文字說明) -->
                                    <div class="egg-flip-card-back shadow-md border border-moss-400/40 bg-moss-500 text-moss-100 p-3.5 flex flex-col justify-start">
                                        <div class="text-badge font-black text-moss-300 uppercase tracking-widest mb-1.5 flex items-center gap-1 border-b border-moss-400/40 pb-1 shrink-0">
                                            <i class="ph ${itemIcon}"></i>
                                            <span>${escapeHtml(item.tagLabel)}</span>
                                        </div>
                                        <div class="text-small font-bold text-moss-100 mb-1.5 line-clamp-2 shrink-0">${escapeHtml(item.name)}</div>
                                        ${cleanEggDetail ? `<div class="text-badge font-medium leading-relaxed text-moss-100/90 overflow-y-auto no-scrollbar whitespace-pre-line flex-1 text-left">${escapeHtml(cleanEggDetail)}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    cardsHtml += '<div class="w-1 md:w-2 shrink-0 pointer-events-none"></div>';

                    eggHtml = `
                        <div class="mt-6">
                            <details class="group transition-all duration-300">
                                <summary class="flex justify-between items-center cursor-pointer list-none font-black text-moss-500 text-body select-none pb-2">
                                    <span class="flex items-center gap-2">
                                        <i class="ph ph-gift text-xl text-moss-400"></i>
                                        <span>驚喜彩蛋 (${allEggItems.length})</span>
                                    </span>
                                    <div class="w-6 h-6 flex items-center justify-center text-moss-500 group-open:rotate-180 transition-transform text-base">
                                        <i class="ph ph-caret-down font-bold"></i>
                                    </div>
                                </summary>
                                <div class="pt-2 overflow-hidden">
                                    <div class="flex gap-3.5 md:gap-4 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-2 pt-1">
                                        ${cardsHtml}
                                    </div>
                                </div>
                            </details>
                        </div>
                    `;
                }


                html += `
                    <section id="${dayId}" class="scroll-mt-32 md:scroll-mt-24">
                        <div class="mb-5">
                            <div class="flex items-center flex-wrap gap-2.5 mb-2">
                                <span class="inline-flex items-center gap-1.5 bg-moss-500 text-moss-100 px-3.5 py-1 rounded-full font-black text-small tracking-wider shadow-sm uppercase font-mono">
                                    ${day.fullDate ? `<span>${escapeHtml(day.fullDate)}</span>` : ''}
                                    ${(day.fullDate && day.day) ? `<span class="opacity-70">&middot;</span>` : ''}
                                    ${day.day ? `<span>${escapeHtml(day.day)}</span>` : ''}
                                </span>
                                ${hasWeather ? `
                                    <span class="inline-flex items-center gap-1.5 text-moss-500 font-bold text-small">
                                        <i class="ph ${day.weather.icon || 'ph-sun'} text-base text-moss-400"></i>
                                        <span>${escapeHtml(day.weather.temp || '')}</span>
                                    </span>
                                ` : ''}
                            </div>
                            <h2 class="text-heading font-serif font-black text-moss-500 leading-tight">${day.title}</h2>
                        </div>
                        
                        ${specialNotesHtml}
                        ${dailyTodoHtml}
                        ${flightsHtml}
                        ${mapHtml}
                        ${spotsHtml}
                        ${tipsHtml}
                        ${summaryHtml}
                        ${eggHtml}
                    </section>
                `;

                if (index < itineraryData.length - 1) {
                    html += `
                        <div class="py-12 flex justify-center items-center gap-4 opacity-70">
                            <div class="w-24 md:w-40 h-[2px] bg-moss-300/50 rounded-full"></div>
                            <i class="ph ph-airplane-in-flight text-moss-400 text-xl md:text-2xl"></i>
                            <div class="w-24 md:w-40 h-[2px] bg-moss-300/50 rounded-full"></div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function setupScrollSpy() {
            const observer = new IntersectionObserver((entries) => {
                if(document.getElementById('tab-itinerary').classList.contains('hidden')) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.nav-day').forEach(item => item.classList.remove('active'));
                        const activeItems = document.querySelectorAll(`.nav-day[data-target="${entry.target.id}"]`);
                        activeItems.forEach(item => {
                            item.classList.add('active');
                            if(item.closest('#itinerary-mobile-nav')) {
                                item.closest('#itinerary-mobile-nav').scrollTo({
                                    left: item.offsetLeft - 20,
                                    behavior: 'smooth'
                                });
                            }
                        });
                    }
                });
            }, { rootMargin: '-30% 0px -50% 0px', threshold: 0 });

            document.querySelectorAll('#itinerary-content section').forEach(section => observer.observe(section));
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadItinerary();
        });
    </script>
</body>
</html>
